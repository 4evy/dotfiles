---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
version: 2
base:
  image:
    registry: ghcr.io
    repository: projectbluefin/bluefin-nvidia
    tag: stable
    digest: sha256:27dc87ad87606fea73092a9e6271663f90058698e24339f8d8e05fdb639e8746
metadata:
  name: spectrum
  description: Evy's Bluefin workstation image
  labels:
    org.opencontainers.image.source: https://github.com/4evy/dotfiles
spec:
  tool-versions:
    # Build preparation resolves this from source-bluebuild-cli in flake.lock.
    bluebuild: ${BLUEBUILD_CLI_REVISION}
  platforms:
    - linux/amd64

stages:
  - from-file: spectrum/stages/python-runtime.yml
  - from-file: spectrum/stages/ghostty.yml
  - from-file: spectrum/stages/hyper-window-tiling.yml
  - from-file: spectrum/stages/kanata.yml

modules:
  # Put immutable, remote-heavy work first. Local source and configuration
  # changes then invalidate only the cheap assembly/finalization tail.
  - from-file: spectrum/modules/software.yml
  - from-file: spectrum/modules/local.yml
  - from-file: spectrum/modules/system.yml
