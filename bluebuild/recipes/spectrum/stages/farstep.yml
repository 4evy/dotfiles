---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: farstep
# Match the final image's Fedora release and runtime libraries
from: ${BASE_IMAGE}
modules:
  - type: dnf@v1
    source: ghcr.io/blue-build/modules/dnf:v1@sha256:4fa89e050fbbc397ec7c04ed11339a5f430cc339224facaa8b8ce65e07d39921
    install:
      install-weak-deps: false
      packages:
        - alsa-lib
        - binutils
        - ca-certificates
        - curl
        - cmake
        - gjs
        - grim
        - kf6-kconfig
        - kwin-devel
        - extra-cmake-modules
        - sway
        - dbus
        - dbus-daemon
        - gcc
        - gcc-c++
        - glib2-devel
        - gstreamer1-devel
        - gstreamer1-plugins-base-devel
        - gstreamer1-plugins-good
        - libxkbcommon-devel
        - make
        - patch
        - java-21-openjdk-devel
        - python3
        - python3-pip
        - pipewire-devel
        - qt6-qtbase-devel
        - qt6-qtdeclarative-devel
        - qt6-qttools-devel
        - wayland-protocols-devel
        - pipewire-gstreamer
        - pkgconf-pkg-config
        - systemd
        - tar
        - unzip
        - util-linux-core
        - wayland-devel
        - xdg-desktop-portal
        - xkeyboard-config
        - xz

  # Checksum-pinned standalone toolchains stay independent of local source
  # inputs and never enter the final image except the bundled Bun binary
  - type: containerfile
    snippets:
      - |-
        # renovate: datasource=github-tags depName=oven-sh/bun
        ARG BUN_VERSION=1.4.3
        ARG BUN_SHA256=1fc2edac843102909e3a1be1d8d9802cc6071cf074e67e88231f4ffe0f8b397b
        # renovate: datasource=rust-version depName=rust
        ARG RUST_VERSION=1.99.1
        ARG RUST_SHA256=231fcae47ee950621374725b5fc3b5441d2fbda2955ac45dd7dc816d8876cfe7
        # renovate: datasource=github-releases depName=goreleaser/nfpm
        ARG NFPM_VERSION=2.48.0
        ARG NFPM_SHA256=6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
        RUN set -eu; \
          mkdir -p /build/toolchains/bin /build/downloads; \
          curl --fail --location --retry 3 \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64-baseline.zip" \
            --output /build/downloads/bun.zip; \
          printf '%s  %s\n' "$BUN_SHA256" /build/downloads/bun.zip | sha256sum --check -; \
          unzip -q /build/downloads/bun.zip -d /build/downloads; \
          install -m 0755 /build/downloads/bun-linux-x64-baseline/bun /build/toolchains/bin/bun; \
          curl --fail --location --retry 3 \
            "https://static.rust-lang.org/dist/rust-${RUST_VERSION}-x86_64-unknown-linux-gnu.tar.xz" \
            --output /build/downloads/rust.tar.xz; \
          printf '%s  %s\n' "$RUST_SHA256" /build/downloads/rust.tar.xz | sha256sum --check -; \
          tar -xJf /build/downloads/rust.tar.xz -C /build/downloads; \
          "/build/downloads/rust-${RUST_VERSION}-x86_64-unknown-linux-gnu/install.sh" \
            --prefix=/build/toolchains --disable-ldconfig \
            --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu; \
          curl --fail --location --retry 3 \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            --output /build/downloads/nfpm.tar.gz; \
          printf '%s  %s\n' "$NFPM_SHA256" /build/downloads/nfpm.tar.gz | sha256sum --check -; \
          tar -xzf /build/downloads/nfpm.tar.gz -C /build/toolchains/bin nfpm; \
          rm -rf /build/downloads

  - type: copy@v1
    src: bluebuild/recipes/spectrum/sources/ai.json
    dest: /src/ai-build.json

  - type: containerfile
    snippets:
      - |-
        RUN --mount=type=cache,id=spectrum-farstep-bun-v1,sharing=locked,target=/build/bun-cache \
            --mount=type=cache,id=spectrum-farstep-cargo-v1,sharing=locked,target=/build/cargo \
            set -eu; \
            export PATH=/build/toolchains/bin:$PATH BUN_INSTALL_CACHE_DIR=/build/bun-cache CARGO_HOME=/build/cargo; \
            revision=$(bun -p 'require("/src/ai-build.json").revision'); \
            curl --fail --location --retry 3 "https://github.com/4evy/ai/archive/$revision.tar.gz" -o /build/ai.tar.gz; \
            mkdir -p /src/ai; \
            tar -xzf /build/ai.tar.gz --strip-components=1 -C /src/ai; \
            cd /src/ai; \
            bun install --frozen-lockfile --ignore-scripts; \
            SOURCE_DATE_EPOCH=$(bun -p 'require("/src/ai-build.json").sourceDateEpoch') \
              bun farstep/packaging/build.ts --format rpm --install-root /usr/lib/farstep --output /out \
              --release "$(bun -p 'require("/src/ai-build.json").release')"; \
            bun tools/scripts/cli/cli.ts ghidra install --output /out; \
            bun tools/scripts/cli/cli.ts setup codex claude opencode --output /out
