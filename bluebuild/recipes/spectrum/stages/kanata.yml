---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: kanata
# Use the final image's Fedora release and runtime libraries.
from: ${BASE_IMAGE}
modules:
  - type: copy@v1
    src: bluebuild/recipes/spectrum/sources/kanata.json
    dest: /src/sources.json

  - type: copy@v1
    src: bluebuild/recipes/spectrum/sources/patches.json
    dest: /src/patches.json

  - type: copy@v1
    src: packages/kanata-with-cmd/build-linux.sh
    dest: /src/build-kanata.sh

  - type: dnf@v1
    source: ghcr.io/blue-build/modules/dnf:v1@sha256:b4037298aa9dc3203ddccda40791284a66e28b478fded6d5b9ce560ecd9ba3c6
    install:
      install-weak-deps: false
      packages:
        - cargo
        - gcc
        - git
        - jq
        - python3
        - rust

  - type: containerfile
    snippets:
      - |-
        RUN \
          --mount=type=cache,id=spectrum-kanata-cargo-registry-v1,sharing=locked,target=/root/.cargo/registry \
          --mount=type=cache,id=spectrum-kanata-cargo-git-v1,sharing=locked,target=/root/.cargo/git \
          --mount=type=cache,id=spectrum-kanata-target-v1,sharing=locked,target=/build/kanata-source/target \
          SOURCE_LOCK=/src/sources.json \
          SOURCE_PIN=kanata-homebrew \
          PATCHES_LOCK=/src/patches.json \
          PATCH_STACK=kanata \
          PREFIX=/out/usr \
          bash /src/build-kanata.sh
