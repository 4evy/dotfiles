---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: hyper-window-tiling
from: docker.io/oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
modules:
  - type: copy@v1
    src: packages/hyper-window-tiling/package.json
    dest: /src/package.json

  - type: copy@v1
    src: packages/hyper-window-tiling/bun.lock
    dest: /src/bun.lock

  - type: copy@v1
    src: packages/hyper-window-tiling/vendor
    dest: /src/vendor

  # Keep dependency installation cached when extension source or metadata changes
  - type: containerfile
    snippets:
      - |-
        RUN \
          --mount=type=cache,id=spectrum-hyper-window-tiling-bun-v1,sharing=locked,target=/root/.bun/install/cache \
          cd /src && \
          bun install --frozen-lockfile

  - type: copy@v1
    src: packages/hyper-window-tiling/tsconfig.json
    dest: /src/tsconfig.json

  - type: copy@v1
    src: packages/hyper-window-tiling/src
    dest: /src/src

  - type: copy@v1
    src: packages/hyper-window-tiling/gnome
    dest: /src/gnome

  - type: copy@v1
    src: packages/hyper-window-tiling/kde
    dest: /src/kde

  - type: containerfile
    snippets:
      - |-
        RUN cd /src && bun run build
