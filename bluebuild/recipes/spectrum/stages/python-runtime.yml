---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: python-runtime
# Use the final image's Fedora release and runtime libraries.
from: ${BASE_IMAGE}
modules:
  # This projection contains only Astral's pin. Updating an unrelated flake
  # source therefore leaves this stage's cache key intact.
  - type: copy@v1
    src: bluebuild/recipes/spectrum/sources/astral.json
    dest: /src/sources.json

  - type: copy@v1
    src: packages/source-lock/source_lock.py
    dest: /src/source_lock.py

  - type: dnf@v1
    source: ghcr.io/blue-build/modules/dnf:v1@sha256:b4037298aa9dc3203ddccda40791284a66e28b478fded6d5b9ce560ecd9ba3c6
    install:
      install-weak-deps: false
      packages:
        - python3

  - type: script@v2
    source: ghcr.io/blue-build/modules/script:v2@sha256:b19e432cf10bf5dab8d881e04ed692a9c61dd336e839acf77f9361cccf394484
    snippets:
      - |-
        python3 - <<'PYTHON'
        import json
        import shutil
        import tarfile
        import tempfile
        import sys
        from pathlib import Path

        sys.path.insert(0, "/src")
        from source_lock import download_file

        pin = json.loads(Path("/src/sources.json").read_text())["pins"]["python-astral"]
        with tempfile.TemporaryDirectory() as temporary_directory:
            temporary_path = Path(temporary_directory)
            archive = temporary_path / "astral.tar.gz"
            download_file(pin, archive)

            with tarfile.open(archive) as source_archive:
                source_archive.extractall(temporary_path, filter="data")
            source = next(temporary_path.glob("astral-*/src/astral"))
            destination = Path("/out/usr/lib/dotfiles/python/astral")
            destination.parent.mkdir(parents=True, exist_ok=True)
            shutil.copytree(source, destination)
            version = source.parents[1].name.removeprefix("astral-")
            (destination.parent / ".astral-version").write_text(f"{version}\n")
        PYTHON
