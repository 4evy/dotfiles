---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: python-runtime
# Use the final image's Fedora release and runtime libraries.
from: ${BASE_IMAGE}
modules:
  # This projection contains only Astral's pin. Updating an unrelated flake
  # source therefore leaves this stage's cache key intact.
  - type: copy@v1
    src: bluebuild/recipes/spectrum/sources/astral.json
    dest: /src/sources.json

  - type: copy@v1
    src: packages/source-lock/source_lock.py
    dest: /src/source_lock.py

  - type: copy@v1
    src: bluebuild/recipes/spectrum/install-astral.py
    dest: /src/install-astral.py

  - type: dnf@v1
    source: ghcr.io/blue-build/modules/dnf:v1@sha256:4fa89e050fbbc397ec7c04ed11339a5f430cc339224facaa8b8ce65e07d39921
    install:
      install-weak-deps: false
      packages:
        - python3

  - type: script@v2
    source: ghcr.io/blue-build/modules/script:v2@sha256:fa4455089da980cb871c804521786ffa74c534987df4251a90eba850fe4a7d86
    snippets:
      - python3.14 /src/install-astral.py
