---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Install stable, remote-heavy inputs before repository-local files so local
  # edits do not force these downloads to run again.
  # Repository definitions are intentional inputs to the following DNF layer.
  - type: copy@v1
    src: bluebuild/files/dnf
    dest: /etc/yum.repos.d

  - type: dnf@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    repos:
      cleanup: true
      keys:
        - https://downloads.1password.com/linux/keys/1password.asc
        - https://packages.microsoft.com/keys/microsoft.asc
      nonfree: rpmfusion
    install:
      install-weak-deps: false
      packages:
        - 1password
        - 1password-cli
        - blueprint-compiler
        - bootc
        - bubblewrap
        - ayugram-desktop
        - code
        - curl
        - file
        - findutils
        - fuse3
        - git
        - google-noto-color-emoji-fonts
        - google-noto-emoji-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-sans-egyptian-hieroglyphs-fonts
        - google-noto-sans-mono-cjk-vf-fonts
        - google-noto-sans-mono-vf-fonts
        - google-noto-sans-symbols-2-fonts
        - google-noto-sans-symbols-vf-fonts
        - google-noto-sans-vf-fonts
        - gsound
        - gtk4-layer-shell
        - just
        - kmscon
        - kmscon-freetype
        - libgda
        - libgda-sqlite
        - liberation-mono-fonts
        - liberation-sans-fonts
        - liberation-serif-fonts
        - libxdo
        - ncurses
        - opensc
        - openssh-clients
        - pinentry
        - pinentry-gnome3
        - pipewire-gstreamer
        - podman
        - podman-compose
        - procps-ng
        - python3
        - rsync
        - selinux-policy-devel
        - solaar
        - systemd-oomd-defaults
        - tailscale
        - telegram-desktop
        - uresourced
        - vim-enhanced
        - vicinae
        - vulkan-tools
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        # renovate: datasource=github-releases depName=getsops/sops
        - https://github.com/getsops/sops/releases/download/v3.13.3/sops-3.13.3-1.x86_64.rpm
        # renovate: datasource=github-releases depName=rustdesk/rustdesk
        - https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-0.x86_64.rpm
        - https://discord.com/api/download?platform=linux&format=rpm

  # The RPM owns desktop files and icons. Preserve the fixed helper GIDs used
  # by bling without its obsolete resources/1password.desktop copy step.
  - type: script@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    snippets:
      - |
        chmod 4755 /opt/1Password/chrome-sandbox
        chgrp 1500 /opt/1Password/1Password-BrowserSupport
        chmod g+s /opt/1Password/1Password-BrowserSupport
        chgrp 1600 /usr/bin/op
        chmod g+s /usr/bin/op
        printf 'g onepassword 1500\n' > /usr/lib/sysusers.d/onepassword.conf
        printf 'g onepassword-cli 1600\n' > /usr/lib/sysusers.d/onepassword-cli.conf
        rm -f /usr/lib/sysusers.d/30-rpmostree-pkg-group-onepassword.conf
        rm -f /usr/lib/sysusers.d/30-rpmostree-pkg-group-onepassword-cli.conf
        rm -f /etc/yum.repos.d/1password.repo

  # Provision Linuxbrew as part of the image so the bootstrap only has to
  # apply the Brewfile. Keep package upgrades explicit through `just update`.
  - type: brew@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    auto-update: false
    auto-upgrade: false
    brew-analytics: false
    direct-pull: true
    installer-commit: f4aa1b1ca5b256954dbde0315455fb259cdfc45a

  - type: fonts@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    fonts:
      nerd-fonts:
        - JetBrainsMono
      url-fonts:
        - name: NotoColorEmojiBitmap
          url: https://raw.githubusercontent.com/googlefonts/noto-emoji/main/fonts/NotoColorEmoji.ttf

  # Reconcile user Flatpaks at boot. Flatpak itself selects and maintains the
  # host's matching graphics-driver extensions with each runtime.
  - type: default-flatpaks@v2
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    configurations:
      - scope: user
        notify: false
        repo:
          name: flathub
          title: Flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - org.gnome.NautilusPreviewer

  - type: gnome-extensions@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    install:
      - 4974 # Window Calls Extended
      - 5060 # Xremap
      - 5592 # Focused Window D-Bus
      - 8594 # Vicinae
      - 8834 # Copyous
