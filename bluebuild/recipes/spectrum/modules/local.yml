---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Builder outputs and repository-local configuration deliberately follow
  # remote-heavy modules. Changes here invalidate only this assembly tail.
  - type: copy@v1
    from: python-runtime
    src: /out/usr
    dest: /usr

  - type: copy@v1
    from: ghostty
    src: /out/usr
    dest: /usr

  - type: copy@v1
    from: hyper-window-tiling
    src: /src/gnome/metadata.json
    dest: /usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/metadata.json

  - type: copy@v1
    from: hyper-window-tiling
    src: /src/dist/gnome/extension.js
    dest: /usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/extension.js

  - type: copy@v1
    from: hyper-window-tiling
    src: /src/gnome/schemas/org.gnome.shell.extensions.hyper-window-tiling.gschema.xml
    dest: /usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/schemas/org.gnome.shell.extensions.hyper-window-tiling.gschema.xml

  - type: copy@v1
    from: hyper-window-tiling
    src: /src/kde/metadata.json
    dest: /usr/share/kwin/scripts/hyper-window-tiling/metadata.json

  - type: copy@v1
    from: hyper-window-tiling
    src: /src/dist/kde/contents/code/main.js
    dest: /usr/share/kwin/scripts/hyper-window-tiling/contents/code/main.js

  - type: copy@v1
    from: kanata
    src: /out/usr
    dest: /usr

  - type: copy@v1
    src: bluebuild/files/system
    dest: /

  - type: copy@v1
    src: packages/kanata/kanata.kbd
    dest: /usr/libexec/dotfiles/kanata/kanata.kbd

  - type: copy@v1
    src: bluebuild/files/kmscon
    dest: /usr/libexec/dotfiles/kmscon

  - type: copy@v1
    src: dotfiles/.chezmoidata/t3_chat.json
    dest: /usr/share/dotfiles/t3_chat_palette.json
