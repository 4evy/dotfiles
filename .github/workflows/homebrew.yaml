---
name: Homebrew

on:
  pull_request:
    paths: &homebrew-paths
      - .github/workflows/homebrew.yaml
      - Brewfile
      - Formula/**
      - LICENSE
      - flake.lock
      - packages/source-lock/**
      - packages/theme-run/**
  push:
    branches:
      - master
    paths: *homebrew-paths
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: Formula Style
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Homebrew RubyGems
        run: brew install-bundler-gems

      - name: Package theme-run Source
        run: |
          mkdir -p Sources
          tar -cf Sources/theme-run-0.1.0.tar \
            -C packages/theme-run go.mod go.sum README.md cmd internal \
            -C ../.. LICENSE

      - name: Check Formula Style
        run: brew style Formula/*.rb

      - name: Parse Brewfile
        run: brew bundle list --file Brewfile --all >/dev/null
