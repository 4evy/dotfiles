---
name: GitHub Actions

on:
  pull_request: null
  push:
    branches:
      - master
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read # needed to checkout and validate repository workflows

jobs:
  validate:
    name: Validate Workflows
    # Immutable GitHub bot IDs: Renovate, GitHub Actions, Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Check Tools
        uses: ./.github/actions/setup-check-tools # zizmor: ignore[self-repository]
        with:
          tools: just actionlint zizmor

      - name: Check Workflows
        run: just github-actions-check
