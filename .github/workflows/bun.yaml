---
name: Bun

on:
  pull_request: null
  push:
    branches:
      - master
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read # needed to checkout repository contents

jobs:
  workspace:
    name: Check JavaScript and TypeScript
    # Immutable GitHub bot IDs: Renovate, GitHub Actions, Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Check Tools
        uses: ./.github/actions/setup-check-tools # zizmor: ignore[self-repository]

      - name: Set Up Bun
        uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository]
        with:
          cache-dependency-path: |
            bun.lock
            packages/hyper-window-tiling/bun.lock
          cache-scope: workspace

      - name: Install Dependencies
        run: just bun-install

      - name: Check Workspace
        run: just bun-check
