name: Dockerfile Smoke

on:
  pull_request:
    branches:
      - master
    paths: &dockerfile-paths
      - .github/workflows/dockerfile.yaml
      - .ansible-lint
      - .dockerignore
      - .yamllint
      - Dockerfile
      - ansible.cfg
      - ansible/**
      - '!ansible/tests/**'
      - browser/**
      - containers/**
      - dotfiles/**
      - npins/sources.json
      - packages/dotfiles-python/assets/**
      - packages/dotfiles-python/src/**
      - packages/terminal-theme-tools/build.zig
      - packages/terminal-theme-tools/build.zig.zon
      - packages/terminal-theme-tools/build_support.zig
      - packages/terminal-theme-tools/config/**
      - packages/terminal-theme-tools/include/**
      - packages/terminal-theme-tools/src/**
      - packages/terminal-theme-tools/tests/**
      - packages/terminal-theme-tools/vendor/**
      - pyproject.toml
      - uv.lock
  push:
    branches:
      - master
    paths: *dockerfile-paths
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read # needed to checkout repository contents

jobs:
  smoke:
    name: Build Smoke Image
    # Immutable GitHub bot IDs: Renovate, GitHub Actions, Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build Image
        run: |
          sudo podman build \
            --pull=newer \
            --platform linux/amd64 \
            --build-arg TARGETPLATFORM=linux/amd64 \
            --target dotfiles-test \
            --tag dotfiles:fedora-test \
            .

      - name: Validate Image
        run: |
          sudo podman run --rm dotfiles:fedora-test sh -eu -c '
            ! command -v starship
            ansible-playbook --version >/dev/null
            ansible-lint --version >/dev/null
            yamllint --version >/dev/null
          '
