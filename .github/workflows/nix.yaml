---
name: Nix

on:
  pull_request: null
  push:
    branches:
      - master
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read # needed to checkout repository contents

jobs:
  checks:
    name: Flake checks
    # Immutable GitHub bot IDs: Renovate, GitHub Actions, Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      native-checks: ${{ steps.native-inputs.outputs.checks }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Check Tools
        uses: ./.github/actions/setup-check-tools # zizmor: ignore[self-repository]

      - name: Set Up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]

      - name: Check Generated Bun Dependencies
        run: just bun-nix-check

      - name: Check Flake and Repository
        run: just nix-ci-check

      - name: Discover Native Checks
        id: native-inputs
        run: |
          checks=$(just --quiet nix-native-checks)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  # Omit `name` so skipped matrices do not expose an unevaluated matrix expression.
  native-checks: # zizmor: ignore[anonymous-definition] GitHub adds matrix values to the job ID.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.checks.outputs.native-checks) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Check Tools
        uses: ./.github/actions/setup-check-tools # zizmor: ignore[self-repository]

      - name: Set Up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]

      # Independent runners prevent one expensive package from consuming the
      # entire workflow timeout and preserve successful caches for other checks.
      - name: Build Native Check
        env:
          CHECK: ${{ matrix.check }}
        run: just nix-build-check "$CHECK"
