---
name: Renovate

on:
  schedule:
    - cron: "37 0 */2 * *"
  push:
    branches:
      - master
    paths:
      - .tool-versions
      - .github/actions/setup-bun/**
      - .github/actions/setup-nix/**
      - .github/renovate.json
      - .github/renovate/bun.lock
      - .github/renovate/package.json
      - .github/workflows/renovate.yaml
      - .github/workflows/validate-renovate.yaml
      - ansible/roles/system/defaults/main/macos.yml
      - pyproject.toml
      - flake.nix
      - flake.lock
      - packages/source-lock/**
      - bluebuild/recipes/spectrum.yml
      - bluebuild/recipes/spectrum.lock
      - Gemfile
      - Gemfile.lock
  workflow_dispatch: null

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Update Dependencies
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # needed to create and update dependency branches
      pull-requests: write # needed to inspect and create fallback dependency PRs
      statuses: write # needed to report Renovate branch status
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - name: Set Up Bun
        uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository]
        with:
          cache-dependency-path: .github/renovate/bun.lock
          cache-scope: renovate

      - name: Install Renovate
        run: bun install --cwd .github/renovate --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: .tool-versions

      - name: Run Renovate
        run: .github/renovate/node_modules/.bin/renovate
        env:
          LOG_LEVEL: info
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_ALLOWED_COMMANDS: '["^nix flake lock$"]'
