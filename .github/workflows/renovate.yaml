---
name: Renovate

on:
  schedule:
    - cron: "37 0 */2 * *"
  push:
    branches:
      - master
  workflow_dispatch: null

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Update Dependencies
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Nix
        uses: ./.github/actions/setup/nix # zizmor: ignore[self-repository]

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Set Up Bun
        uses: ./.github/actions/setup/bun # zizmor: ignore[self-repository]
        with:
          cache-dependency-path: .github/renovate/bun.lock
          cache-scope: renovate

      - name: Install Renovate
        run: bun install --cwd .github/renovate --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions

      - name: Install Artifact Tools
        run: |-
          nix profile install --inputs-from . \
            nixpkgs#nixfmt nixpkgs#deadnix nixpkgs#yazi \
            nixpkgs-unstable#cargo
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Run Renovate
        run: .github/renovate/node_modules/.bin/renovate
        env:
          LOG_LEVEL: info
          RENOVATE_EXIT_CODE_FOR_ERRORS: "true"
          # Separate OAuth token with repo and workflow scopes
          # The source patch still forbids creating PRs and Issues
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_CONFIG_FILE: .github/renovate/src/config.cjs
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
