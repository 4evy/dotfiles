---
name: Renovate

on:
  schedule:
    - cron: "37 0 */2 * *"
  push:
    branches:
      - master
  workflow_dispatch: null

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Update Dependencies
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Never grant issues or pull-requests write access under any circumstances
      # Only new commits on top of master may be published by this bot
      contents: write # needed to fast-forward master with dependency commits
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Set Up Bun
        uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository]
        with:
          cache-dependency-path: .github/renovate/bun.lock
          cache-scope: renovate

      - name: Install Renovate
        run: bun install --cwd .github/renovate --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .tool-versions

      - name: Install Artifact Tools
        run: |-
          nix profile install --inputs-from . \
            nixpkgs#bundix nixpkgs#nixfmt nixpkgs#deadnix nixpkgs#yazi \
            nixpkgs#go_1_27 nixpkgs-unstable#cargo
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Install Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0

      - name: Run Renovate
        run: .github/renovate/node_modules/.bin/renovate
        env:
          LOG_LEVEL: info
          RENOVATE_EXIT_CODE_FOR_ERRORS: "true"
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_CONFIG_FILE: .github/renovate/src/config.cjs
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
