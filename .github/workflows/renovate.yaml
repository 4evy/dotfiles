name: Renovate

on:
  schedule:
    - cron: "37 */6 * * *"
  push:
    branches:
      - master
    paths:
      - .tool-versions
      - .github/renovate.json
      - .github/workflows/renovate.yaml
      - .github/workflows/validate-renovate.yaml
      - bun.lock
      - package.json
      - pyproject.toml
  workflow_dispatch: null

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Update Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # needed to create and update dependency branches
      pull-requests: read # needed to inspect existing dependency pull requests
      statuses: write # needed to report Renovate branch status
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install Renovate
        run: bun install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version-file: .tool-versions

      - name: Run Renovate
        run: npm exec -- renovate
        env:
          LOG_LEVEL: info
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_GIT_AUTHOR: "4evy <git@evy.pink>"
          RENOVATE_GIT_PRIVATE_KEY: ${{ secrets.RENOVATE_GIT_PRIVATE_KEY }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
