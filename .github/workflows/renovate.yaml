---
name: Renovate

on:
  schedule:
    - cron: "37 0 */2 * *"
  push:
    branches:
      - master
    paths:
      - .tool-versions
      - .github/actions/setup-bun/**
      - .github/actions/setup-nix/**
      - .github/renovate.json
      - .github/renovate/bun.lock
      - .github/renovate/package.json
      - .github/workflows/renovate.yaml
      - .github/workflows/validate-renovate.yaml
      - ansible/roles/system/defaults/main/macos.yml
      - pyproject.toml
      - flake.nix
      - flake.lock
      - packages/source-lock/**
      - bluebuild/recipes/spectrum.yml
      - bluebuild/recipes/spectrum.lock
      - Gemfile
      - Gemfile.lock
  workflow_dispatch: null

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Update Dependencies
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # needed to create and update dependency branches
      pull-requests: write # needed to inspect and create fallback dependency PRs
      statuses: write # needed to report Renovate branch status
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set Up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions

      - name: Set Up Bun
        uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository]
        with:
          cache-dependency-path: .github/renovate/bun.lock
          cache-scope: renovate

      - name: Install Renovate
        run: bun install --cwd .github/renovate --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version-file: .tool-versions

      - name: Run Renovate
        run: .github/renovate/node_modules/.bin/renovate
        env:
          LOG_LEVEL: info
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_ALLOWED_COMMANDS: '["^nix flake lock$"]'
