---
name: Spectrum Image

on:
  push:
    branches: [master]
    paths:
      - .dockerignore
      - .github/actions/setup-nix/**
      - .github/actions/spectrum-build/**
      - .github/actions/spectrum-prepare/**
      - .github/actions/spectrum-publish/**
      - .github/workflows/spectrum.yaml
      - bluebuild/**
      - files/dnf/**
      - recipes
      - flake.lock
      - flake.nix
      - lib/flake.nix
      - nix/dev/flake-module.nix
      - packages/source-lock/**
      - overlays/default.nix
      - packages/bluebuild-v2/**
      - packages/ghostty-patched/build.sh
      - packages/hyper-window-tiling/**
      - packages/kanata/**
      - packages/kanata-with-cmd/build-linux.sh
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    name: Build and Publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # publish the image to GHCR
      id-token: write # keyless image signing and attestations
      attestations: write # publish GitHub build provenance
      artifact-metadata: write # attach package metadata to the image
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Build
        id: prepare
        uses: ./.github/actions/spectrum-prepare # zizmor: ignore[self-repository]

      - name: Build and Publish
        id: image
        uses: ./.github/actions/spectrum-build # zizmor: ignore[self-repository]
        with:
          bluebuild: ${{ steps.prepare.outputs.bluebuild }}
          publish: "true"

      - name: Sign and Attest
        uses: ./.github/actions/spectrum-publish # zizmor: ignore[self-repository]
        with:
          image-ref: ${{ steps.image.outputs.image-ref }}
          image-digest: ${{ steps.image.outputs.image-digest }}
