name: Spectrum Image

on:
  pull_request:
    branches: [master]
    paths: &spectrum-paths
      - .github/workflows/spectrum.yaml
      - bluebuild/**
      - flake.lock
      - flake.nix
      - lib/flake.nix
      - nix/dev/flake-module.nix
      - npins/sources.json
      - overlays/default.nix
      - packages/bluebuild-v2.nix
      - packages/ghostty/**
      - patches/ghostty/**
  push:
    branches: [master]
    paths: *spectrum-paths
  schedule:
    - cron: "42 4 * * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  IMAGE_NAME: spectrum

jobs:
  build:
    name: Build Bluefin Image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # publish the image to GHCR
      id-token: write # keyless image signing and attestations
      attestations: write # publish GitHub build provenance
      artifact-metadata: write # attach package metadata to the image
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Maximize Build Space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: 80G

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          cache-binary: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Locked Bluefin Base
        env:
          BASE_LOCK: bluebuild/recipes/spectrum.lock
        run: |
          set -euo pipefail
          locked_ref=$(tr -d '\n' <"$BASE_LOCK")
          tagged_ref=${locked_ref%@*}
          locked_digest=${locked_ref##*@}
          resolved_digest=$(skopeo inspect "docker://$tagged_ref" | jq -r .Digest)
          test "$resolved_digest" = "$locked_digest"
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp='^https://github.com/projectbluefin/(bluefin|actions)/\.github/workflows/.*' \
            "$locked_ref"

      - name: Build Feature-Gated BlueBuild CLI
        id: bluebuild
        run: |
          set -euo pipefail
          path=$(nix build --no-link --print-out-paths .#bluebuild-v2)
          validator=$(nix build --no-link --print-out-paths .#check-jsonschema)
          "$path/bin/bluebuild" --version
          echo "path=$path" >>"$GITHUB_OUTPUT"
          echo "validator=$validator" >>"$GITHUB_OUTPUT"

      - name: Generate and Validate Containerfile
        env:
          BLUEBUILD: ${{ steps.bluebuild.outputs.path }}/bin/bluebuild
          CHECK_JSONSCHEMA: ${{ steps.bluebuild.outputs.validator }}/bin/check-jsonschema
        run: |
          set -euo pipefail
          "$CHECK_JSONSCHEMA" \
            --base-uri https://schema.blue-build.org/ \
            --schemafile https://schema.blue-build.org/recipe-v2.json \
            bluebuild/recipes/spectrum.yml
          # Upstream's feature-gated v2 parser works, but its validate
          # subcommand still hardcodes the v1 schema.
          "$BLUEBUILD" generate \
            --skip-validation \
            --output /tmp/Containerfile \
            bluebuild/recipes/spectrum.yml
          expected=$(tr -d '\n' <bluebuild/recipes/spectrum.lock)
          tagged=${expected%@*}
          expected_arg="${tagged%:*}@${expected##*@}"
          generated=$(sed -n 's/^ARG BASE_IMAGE="\\(.*\\)"/\\1/p' /tmp/Containerfile | head -n1)
          test "$generated" = "$expected_arg"

      - name: Build Spectrum with BlueBuild
        env:
          BLUEBUILD: ${{ steps.bluebuild.outputs.path }}/bin/bluebuild
          GH_TOKEN: ${{ github.token }}
          BB_BUILD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          BB_PASSWORD: ${{ github.token }}
          BB_USERNAME: ${{ github.repository_owner }}
          BB_REGISTRY: ghcr.io
          BB_REGISTRY_NAMESPACE: ${{ github.repository_owner }}
          GH_PR_EVENT_NUMBER: ${{ github.event.number }}
          BB_CACHE_LAYERS: "true"
          RUST_LOG_STYLE: always
          CLICOLOR_FORCE: "1"
        run: |
          set -euo pipefail
          "$BLUEBUILD" build -v --skip-validation --no-sign bluebuild/recipes/spectrum.yml

      - name: Validate Local Image
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          image=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -m1 "/spectrum:")
          docker run --rm --privileged "$image" bootc container lint --fatal-warnings

      - name: Resolve Published Digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: image
        env:
          IMAGE_REF: "ghcr.io/${{ github.repository_owner }}/spectrum"
        run: |
          set -euo pipefail
          image_ref=${IMAGE_REF,,}
          digest=$(skopeo inspect "docker://$image_ref:latest" | jq -r .Digest)
          echo "ref=$image_ref@$digest" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Generate Syft SBOM
        if: steps.image.outputs.ref != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: spectrum.spdx.json
          upload-artifact: true

      - name: Sign Image and Attach SBOM
        if: steps.image.outputs.ref != ''
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes \
            --predicate spectrum.spdx.json \
            --type spdxjson \
            "$IMAGE_REF"

      - name: Attest Build Provenance
        if: steps.image.outputs.ref != ''
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/spectrum
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
