name: Spectrum Image

on:
  pull_request:
    branches: [master]
    paths: &spectrum-paths
      - .dockerignore
      - .github/actions/spectrum-build/**
      - .github/workflows/spectrum.yaml
      - bluebuild/**
      - flake.lock
      - flake.nix
      - lib/flake.nix
      - nix/dev/flake-module.nix
      - npins/sources.json
      - overlays/default.nix
      - packages/bluebuild-v2.nix
      - packages/ghostty/**
      - patches/ghostty/**
  push:
    branches: [master]
    paths: *spectrum-paths
  schedule:
    - cron: "42 4 * * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate:
    name: Validate Pull Request
    # Immutable GitHub bot IDs: Renovate, GitHub Actions, Dependabot.
    if: >-
      (github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))) &&
      (github.event_name == 'pull_request' ||
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build and Validate
        uses: ./.github/actions/spectrum-build

  publish:
    name: Build and Publish
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # publish the image to GHCR
      id-token: write # keyless image signing and attestations
      attestations: write # publish GitHub build provenance
      artifact-metadata: write # attach package metadata to the image
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build, Publish, and Attest
        uses: ./.github/actions/spectrum-build
