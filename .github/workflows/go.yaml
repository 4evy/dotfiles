---
name: Go

on:
  pull_request:
    paths: &go-paths
      - .github/workflows/go.yaml
      - packages/records/**
      - go.work
      - go.work.sum
      - packages/theme-run/**
  push:
    branches:
      - master
    paths: *go-paths
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    # Immutable GitHub bot IDs: Renovate, GitHub Actions, Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/records/go.mod
          cache-dependency-path: |
            packages/records/go.sum
            packages/theme-run/go.sum

      - name: Check Formatting
        run: >-
          test -z
          "$(find packages/records packages/theme-run -type f -name '*.go' -exec gofmt -l {} +)"

      - name: Test
        run: |
          go -C packages/records test ./...
          go -C packages/theme-run test ./...

      - name: Vet
        run: |
          go -C packages/records vet ./...
          go -C packages/theme-run vet ./...

      - name: Build Static theme-run
        env:
          CGO_ENABLED: 0
        run: go -C packages/theme-run build -trimpath -o ../../theme-run ./cmd/theme-run
