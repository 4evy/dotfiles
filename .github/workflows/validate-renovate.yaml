---
name: Validate Renovate

on:
  pull_request:
    paths: &renovate-paths
      - .tool-versions
      - .github/actions/setup-bun/**
      - .github/renovate.json
      - .github/renovate/bun.lock
      - .github/renovate/package.json
      - .github/workflows/renovate.yaml
      - .github/workflows/validate-renovate.yaml
      - flake.nix
      - flake.lock
      - packages/source-lock/**
  push:
    branches:
      - master
    paths: *renovate-paths
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Renovate Config
    # Immutable GitHub bot IDs: Renovate, GitHub Actions, Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions

      - name: Set Up Bun
        uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository]
        with:
          cache-dependency-path: .github/renovate/bun.lock
          cache-scope: renovate

      - name: Validate Renovate Config
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: |-
          bun install --cwd .github/renovate --frozen-lockfile
          bun run --cwd .github/renovate validate
          bun run --cwd .github/renovate extract
