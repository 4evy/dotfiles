---
name: Validate Renovate

on:
  pull_request: null
  push:
    branches:
      - master
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Renovate Config
    # Immutable GitHub bot IDs: Renovate, GitHub Actions, Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Check Tools
        uses: ./.github/actions/setup-check-tools # zizmor: ignore[self-repository]

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - name: Set Up Bun
        uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository]
        with:
          cache-dependency-path: .github/renovate/bun.lock
          cache-scope: renovate

      - name: Validate Renovate Config
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: just renovate-check
