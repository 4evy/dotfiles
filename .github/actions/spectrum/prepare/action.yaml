---
name: Prepare Spectrum Build
description: Provision build tools, verify the locked base, and generate the Containerfile.

outputs:
  bluebuild:
    description: Absolute path to the feature-gated BlueBuild executable.
    value: ${{ steps.tools.outputs.bluebuild }}

runs:
  using: composite
  steps:
    - name: Set Up Check Tools
      uses: ./.github/actions/setup/check/tools # zizmor: ignore[self-repository]

    - name: Set Up Bun
      uses: ./.github/actions/setup/bun # zizmor: ignore[self-repository]
      with:
        cache-scope: spectrum

    - name: Maximize Build Space
      uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
      with:
        # Apt removals are slow and fail when runner images drop a package
        remove-large-packages: "false"

    - name: Set Up Determinate Nix
      uses: ./.github/actions/setup/nix # zizmor: ignore[self-repository]

    # Archive runtime closures together instead of making hundreds of per-path
    # requests to the rate-limited GitHub Nix cache, before any tools are built
    - name: Restore Runtime Tooling Cache
      id: tooling-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/spectrum-tooling-cache
        key: >-
          spectrum-tooling-v2-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.github/actions/spectrum/prepare/action.yaml',
          'flake.nix', 'flake.lock', 'packages/bluebuild/**',
          'nix/**/*.nix', 'lib/**/*.nix') }}
        restore-keys: |
          spectrum-tooling-v2-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore Tooling Closure
      env:
        TOOLING_CACHE: ${{ runner.temp }}/spectrum-tooling-cache
      shell: bash
      run: |
        set -euo pipefail
        if [[ -f "$TOOLING_CACHE/roots" ]]; then
          mapfile -t roots <"$TOOLING_CACHE/roots"
          # Only import closures produced by this repository's cache
          nix copy --from "file://$TOOLING_CACHE" --no-check-sigs "${roots[@]}"
        fi

    - name: Build Runtime Tooling
      id: tools
      env:
        TOOLING_CACHE: ${{ runner.temp }}/spectrum-tooling-cache
        TOOLING_CACHE_HIT: ${{ steps.tooling-cache.outputs.cache-hit }}
      shell: bash
      run: |
        set -euo pipefail
        # Build runtime tools together and retain every output with a root link
        nix build --inputs-from . --out-link /tmp/spectrum-tools \
          'nixpkgs#podman^out' 'nixpkgs#skopeo^out' nixpkgs#cosign \
          .#bluebuild-v2 .#check-jsonschema
        # Nix numbers links by installable index, omitting the zero suffix
        podman_store=$(readlink -f /tmp/spectrum-tools)
        skopeo_store=$(readlink -f /tmp/spectrum-tools-1)
        cosign_store=$(readlink -f /tmp/spectrum-tools-2)
        bluebuild_store=$(readlink -f /tmp/spectrum-tools-3)
        validator_store=$(readlink -f /tmp/spectrum-tools-4)
        bluebuild="$bluebuild_store/bin/bluebuild"
        validator="$validator_store/bin/check-jsonschema"
        "$bluebuild" --version
        echo "bluebuild=$bluebuild" >>"$GITHUB_OUTPUT"
        echo "validator=$validator" >>"$GITHUB_OUTPUT"
        if [[ "$TOOLING_CACHE_HIT" != true ]]; then
          # Replace old closures restored by the fallback key
          rm -rf "$TOOLING_CACHE"
          nix copy --to "file://$TOOLING_CACHE?compression=zstd" \
            "$podman_store" "$skopeo_store" "$cosign_store" \
            "$bluebuild_store" "$validator_store"
          printf '%s\n' "$podman_store" "$skopeo_store" "$cosign_store" \
            "$bluebuild_store" "$validator_store" >"$TOOLING_CACHE/roots"
        fi

    # Save before base verification/generation so failures do not lose tooling
    - name: Save Runtime Tooling Cache
      if: steps.tooling-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/spectrum-tooling-cache
        key: ${{ steps.tooling-cache.outputs.cache-primary-key }}

    - name: Set Up Container Tools
      shell: bash
      run: |
        set -euo pipefail
        # Use the locked container stack instead of Ubuntu's older cache exporter
        sudo ln --symbolic --force /tmp/spectrum-tools/bin/podman /usr/local/bin/podman
        sudo ln --symbolic --force /tmp/spectrum-tools-1/bin/skopeo /usr/local/bin/skopeo
        sudo ln --symbolic --force /tmp/spectrum-tools-2/bin/cosign /usr/local/bin/cosign
        sudo podman info
        cosign version

    - name: Verify Locked Bluefin Base
      env:
        BASE_LOCK: systems/spectrum/recipes/spectrum.lock
      shell: bash
      run: |
        set -euo pipefail
        locked_ref=$(tr -d '\n' <"$BASE_LOCK")
        # Verify the pinned image even when the upstream tag has moved
        cosign verify \
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
          --certificate-identity-regexp='^https://github.com/projectbluefin/(bluefin|actions)/\.github/workflows/.*' \
          "$locked_ref"

    - name: Generate and Validate Containerfile
      env:
        BLUEBUILD: ${{ steps.tools.outputs.bluebuild }}
        CHECK_JSONSCHEMA: ${{ steps.tools.outputs.validator }}
      shell: bash
      run: |-
        bun install --frozen-lockfile --ignore-scripts
        just spectrum generate /tmp/Containerfile
