---
name: Publish Spectrum Metadata
description: Sign the image and publish build provenance.

inputs:
  image-ref:
    description: Digest-qualified reference of the published image.
    required: true
  image-digest:
    description: Digest of the published image.
    required: true

runs:
  using: composite
  steps:
    - name: Sign Image
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        REGISTRY_USERNAME: ${{ github.actor }}
        REGISTRY_PASSWORD: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        printf '%s' "$REGISTRY_PASSWORD" |
          cosign login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
        cosign sign --yes "$IMAGE_REF"

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/spectrum
        subject-digest: ${{ inputs.image-digest }}
        push-to-registry: true
