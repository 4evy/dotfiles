---
name: Build Spectrum Image
description: Build Spectrum, validate pull-request images, and resolve published digests.

inputs:
  bluebuild:
    description: Absolute path to the BlueBuild executable.
    required: true
  publish:
    description: Whether BlueBuild should publish the image to GHCR.
    required: false
    default: "false"

outputs:
  image-ref:
    description: Digest-qualified reference of the published image.
    value: ${{ steps.image.outputs.ref }}
  image-digest:
    description: Digest of the published image.
    value: ${{ steps.image.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Build and Publish Spectrum with BlueBuild
      if: inputs.publish == 'true'
      env:
        BLUEBUILD: ${{ inputs.bluebuild }}
        GH_TOKEN: ${{ github.token }}
        BB_BUILD_PUSH: ${{ inputs.publish }}
        BB_PASSWORD: ${{ github.token }}
        BB_USERNAME: ${{ github.repository_owner }}
        BB_REGISTRY: ghcr.io
        BB_REGISTRY_NAMESPACE: ${{ github.repository_owner }}
        GH_PR_EVENT_NUMBER: ${{ github.event.number }}
        BB_CACHE_LAYERS: "true"
        BB_BUILD_RETRY_PUSH: ${{ inputs.publish }}
        BB_BUILD_RETRY_COUNT: "3"
        RUST_LOG_STYLE: always
        CLICOLOR_FORCE: "1"
      shell: bash
      run: |
        set -euo pipefail
        python3 bluebuild/recipes/spectrum/prepare-sources.py
        "$BLUEBUILD" build -v --skip-validation --no-sign bluebuild/recipes/.spectrum.generated.yml

    # BlueBuild intentionally enables its registry cache only for publishing
    # builds. Read-only PR builds use the Containerfile generated by the same
    # pinned CLI, adding GitHub's cache backend without pushing an image.
    - name: Build Spectrum with Pull Request Cache
      if: inputs.publish != 'true'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: /tmp/Containerfile
        platforms: linux/amd64
        pull: true
        load: true
        tags: ghcr.io/${{ github.repository_owner }}/spectrum:ci-${{ github.run_id }}
        cache-from: |
          type=registry,ref=ghcr.io/${{ github.repository_owner }}/spectrum:latest-cache
          type=gha,scope=spectrum
        cache-to: type=gha,mode=max,scope=spectrum,ignore-error=true

    - name: Validate Local Image
      if: inputs.publish != 'true'
      shell: bash
      run: |
        set -euo pipefail
        image=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -m1 "/spectrum:")
        docker run --rm --privileged "$image" bootc container lint --fatal-warnings
        docker run --rm --entrypoint ghostty "$image" +version
        docker run --rm --entrypoint bluebuild "$image" --version
        docker run --rm --entrypoint bluebuild "$image" recipe --help >/dev/null

    - name: Resolve Published Digest
      if: inputs.publish == 'true'
      id: image
      env:
        IMAGE_REF: "ghcr.io/${{ github.repository_owner }}/spectrum"
      shell: bash
      run: |-
        set -euo pipefail
        image_ref=${IMAGE_REF,,}
        digest=$(skopeo inspect "docker://$image_ref:latest" | jq -r .Digest)
        echo "ref=$image_ref@$digest" >>"$GITHUB_OUTPUT"
        echo "digest=$digest" >>"$GITHUB_OUTPUT"
