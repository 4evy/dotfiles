---
name: Build Spectrum Image
description: Build Spectrum, validate pull-request images, and resolve published digests.

inputs:
  bluebuild:
    description: Absolute path to the BlueBuild executable.
    required: true
  publish:
    description: Whether BlueBuild should publish the image to GHCR.
    required: false
    default: "false"

outputs:
  image-ref:
    description: Digest-qualified reference of the published image.
    value: ${{ steps.image.outputs.ref }}
  image-digest:
    description: Digest of the published image.
    value: ${{ steps.image.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Build and Publish Spectrum with BlueBuild
      if: inputs.publish == 'true'
      env:
        BLUEBUILD: ${{ inputs.bluebuild }}
        GH_TOKEN: ${{ github.token }}
        BB_BUILD_PUSH: ${{ inputs.publish }}
        BB_PASSWORD: ${{ github.token }}
        BB_USERNAME: ${{ github.repository_owner }}
        BB_REGISTRY: ghcr.io
        BB_REGISTRY_NAMESPACE: ${{ github.repository_owner }}
        GH_PR_EVENT_NUMBER: ${{ github.event.number }}
        BB_BUILD_DRIVER: podman
        BB_RUN_DRIVER: podman
        BB_CACHE_LAYERS: "true"
        BB_BUILD_RETRY_PUSH: ${{ inputs.publish }}
        BB_BUILD_RETRY_COUNT: "3"
        RUST_LOG_STYLE: always
        CLICOLOR_FORCE: "1"
      shell: bash
      run: |
        set -euo pipefail
        bun bluebuild/recipes/spectrum/sources/sources.ts
        sudo --preserve-env "$BLUEBUILD" build -v --compression-format zstd --skip-validation --no-sign bluebuild/recipes/spectrum.yml

    # BlueBuild enables registry caching only when publishing. PR builds read
    # Podman's cache from the same repository without exporting cache layers
    - name: Build Spectrum with Pull Request Cache
      if: inputs.publish != 'true'
      env:
        IMAGE_REF: ghcr.io/${{ github.repository_owner }}/spectrum
        IMAGE_TAG: ci-${{ github.run_id }}
      shell: bash
      run: |
        set -euo pipefail
        image_ref=${IMAGE_REF,,}
        sudo podman build \
          --file /tmp/Containerfile \
          --platform linux/amd64 \
          --pull=always \
          --layers \
          --cache-from "$image_ref" \
          --tag "$image_ref:$IMAGE_TAG" .

    - name: Validate Local Image
      if: inputs.publish != 'true'
      env:
        IMAGE_REF: ghcr.io/${{ github.repository_owner }}/spectrum
        IMAGE_TAG: ci-${{ github.run_id }}
      shell: bash
      run: |
        set -euo pipefail
        image="${IMAGE_REF,,}:$IMAGE_TAG"
        sudo podman run --rm --privileged "$image" bootc container lint --fatal-warnings
        sudo podman run --rm --entrypoint ghostty "$image" +version
        sudo podman run --rm --entrypoint bluebuild "$image" --version
        sudo podman run --rm --entrypoint bluebuild "$image" recipe --help >/dev/null

    - name: Resolve Published Digest
      if: inputs.publish == 'true'
      id: image
      env:
        IMAGE_REF: "ghcr.io/${{ github.repository_owner }}/spectrum"
      shell: bash
      run: |-
        set -euo pipefail
        image_ref=${IMAGE_REF,,}
        digest=$(skopeo inspect "docker://$image_ref:latest" | jq -r .Digest)
        echo "ref=$image_ref@$digest" >>"$GITHUB_OUTPUT"
        echo "digest=$digest" >>"$GITHUB_OUTPUT"
