---
name: Prepare Spectrum Build
description: Provision build tools, verify the locked base, and generate the Containerfile.

outputs:
  bluebuild:
    description: Absolute path to the feature-gated BlueBuild executable.
    value: ${{ steps.tools.outputs.bluebuild }}

runs:
  using: composite
  steps:
    - name: Set Up Check Tools
      uses: ./.github/actions/setup-check-tools # zizmor: ignore[self-repository]
      with:
        tools: just bun

    - name: Maximize Build Space
      uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

    - name: Install uv and Python
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version-file: .tool-versions

    - name: Set Up Determinate Nix
      uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]

    - name: Set Up Podman
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes podman skopeo
        sudo podman info

    - name: Install Cosign
      shell: bash
      run: |
        set -euo pipefail
        cosign_store=$(nix build --inputs-from . --out-link /tmp/cosign-result --print-out-paths nixpkgs#cosign)
        sudo ln --symbolic --force "$cosign_store/bin/cosign" /usr/local/bin/cosign
        cosign version

    - name: Verify Locked Bluefin Base
      env:
        BASE_LOCK: bluebuild/recipes/spectrum.lock
      shell: bash
      run: |
        set -euo pipefail
        locked_ref=$(tr -d '\n' <"$BASE_LOCK")
        # Verify the pinned image even when the upstream tag has moved.
        cosign verify \
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
          --certificate-identity-regexp='^https://github.com/projectbluefin/(bluefin|actions)/\.github/workflows/.*' \
          "$locked_ref"

    - name: Build Feature-Gated Tooling
      id: tools
      shell: bash
      run: |
        set -euo pipefail
        bluebuild_store=$(nix build --out-link /tmp/bluebuild-result --print-out-paths .#bluebuild-v2)
        validator_store=$(nix build --out-link /tmp/validator-result --print-out-paths .#check-jsonschema)
        bluebuild="$bluebuild_store/bin/bluebuild"
        validator="$validator_store/bin/check-jsonschema"
        "$bluebuild" --version
        echo "bluebuild=$bluebuild" >>"$GITHUB_OUTPUT"
        echo "validator=$validator" >>"$GITHUB_OUTPUT"

    - name: Generate and Validate Containerfile
      env:
        BLUEBUILD: ${{ steps.tools.outputs.bluebuild }}
        CHECK_JSONSCHEMA: ${{ steps.tools.outputs.validator }}
      shell: bash
      run: |-
        bun install --frozen-lockfile --ignore-scripts
        just spectrum generate /tmp/Containerfile
