---
name: Prepare Spectrum Build
description: Provision build tools, verify the locked base, and generate the Containerfile.

outputs:
  bluebuild:
    description: Absolute path to the feature-gated BlueBuild executable.
    value: ${{ steps.tools.outputs.bluebuild }}

runs:
  using: composite
  steps:
    - name: Maximize Build Space
      uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

    - name: Set Up Determinate Nix
      uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]

    - name: Set Up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        cache-binary: true

    - name: Install Cosign
      shell: bash
      run: |
        set -euo pipefail
        cosign_store=$(nix build --inputs-from . --out-link /tmp/cosign-result --print-out-paths nixpkgs#cosign)
        sudo ln --symbolic --force "$cosign_store/bin/cosign" /usr/local/bin/cosign
        cosign version

    - name: Verify Locked Bluefin Base
      env:
        BASE_LOCK: bluebuild/recipes/spectrum.lock
      shell: bash
      run: |
        set -euo pipefail
        locked_ref=$(tr -d '\n' <"$BASE_LOCK")
        # Verify the pinned image even when the upstream tag has moved.
        cosign verify \
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
          --certificate-identity-regexp='^https://github.com/projectbluefin/(bluefin|actions)/\.github/workflows/.*' \
          "$locked_ref"

    - name: Build Feature-Gated Tooling
      id: tools
      shell: bash
      run: |
        set -euo pipefail
        bluebuild_store=$(nix build --out-link /tmp/bluebuild-result --print-out-paths .#bluebuild-v2)
        validator_store=$(nix build --out-link /tmp/validator-result --print-out-paths .#check-jsonschema)
        bluebuild="$bluebuild_store/bin/bluebuild"
        validator="$validator_store/bin/check-jsonschema"
        "$bluebuild" --version
        echo "bluebuild=$bluebuild" >>"$GITHUB_OUTPUT"
        echo "validator=$validator" >>"$GITHUB_OUTPUT"

    - name: Generate and Validate Containerfile
      env:
        BLUEBUILD: ${{ steps.tools.outputs.bluebuild }}
        CHECK_JSONSCHEMA: ${{ steps.tools.outputs.validator }}
      shell: bash
      run: |-
        set -euo pipefail
        python3 bluebuild/recipes/spectrum/prepare-sources.py
        "$CHECK_JSONSCHEMA" \
          --base-uri https://schema.blue-build.org/ \
          --schemafile https://schema.blue-build.org/recipe-v2.json \
          bluebuild/recipes/.spectrum.generated.yml
        "$CHECK_JSONSCHEMA" \
          --base-uri https://schema.blue-build.org/ \
          --schemafile https://schema.blue-build.org/stage-v1.json \
          bluebuild/recipes/spectrum/stages/*.yml
        "$CHECK_JSONSCHEMA" \
          --base-uri https://schema.blue-build.org/ \
          --schemafile https://schema.blue-build.org/module-list-v1.json \
          bluebuild/recipes/spectrum/modules/*.yml
        # Upstream's feature-gated v2 parser works, but its validate
        # subcommand still hardcodes the v1 schema.
        "$BLUEBUILD" generate \
          --skip-validation \
          --output /tmp/Containerfile \
          bluebuild/recipes/.spectrum.generated.yml
        ! grep -Fq 'COPY --from=ghcr.io/blue-build/cli:' /tmp/Containerfile
        # Docker inserts --link; Podman does not.
        grep -Eq 'COPY --from=bluebuild-cli( --link)? /out/usr /usr' /tmp/Containerfile
        grep -Fq 'bluebuild/recipes/spectrum/sources/bluebuild.json /src/sources.json' /tmp/Containerfile
        grep -Fq -- '--mount=type=cache,sharing=locked,dst=/var/cache/rpm-ostree,id=rpm-ostree-cache-spectrum-' /tmp/Containerfile
        grep -Fq -- '--mount=type=cache,sharing=locked,dst=/var/cache/libdnf5,id=dnf-cache-spectrum-' /tmp/Containerfile
        grep -Fq 'bluebuild/recipes/spectrum/sources/astral.json /src/sources.json' /tmp/Containerfile
        grep -Fq 'bluebuild/recipes/spectrum/sources/ghostty.json /src/sources.json' /tmp/Containerfile
        grep -Fq -- '--mount=type=cache,id=spectrum-ghostty-zig-global-v1,sharing=locked,target=/build/zig-cache' /tmp/Containerfile
        grep -Fq -- '--mount=type=cache,id=spectrum-ghostty-zig-local-v1,sharing=locked,target=/build/source/.zig-cache' /tmp/Containerfile
        ! grep -Fq 'flake.lock /src/' /tmp/Containerfile
        expected=$(tr -d '\n' <bluebuild/recipes/spectrum.lock)
        tagged=${expected%@*}
        expected_arg="${tagged%:*}@${expected##*@}"
        generated=$(sed -n 's/^ARG BASE_IMAGE="\([^"]*\)".*/\1/p' /tmp/Containerfile | head -n1)
        if [[ "$generated" != "$expected_arg" ]]; then
          printf 'generated base %s does not match lock %s\n' "$generated" "$expected_arg" >&2
          exit 1
        fi
