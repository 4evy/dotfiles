---
name: Set Up Check Tools
description: Install check tools at versions declared in the root .tool-versions.

inputs:
  tools:
    description: Space-separated tool names from .tool-versions.
    default: just

runs:
  using: composite
  steps:
    - name: Install Check Tools
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |- # zizmor: ignore[github-env] mise resolves pinned tools from .tool-versions
        set -euo pipefail

        version=v2026.10.12
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)
            platform=linux-x64
            checksum=72404716768b5b044cbd5170136d3d795cbd592658b6e932b66f0f8d67a54875
            ;;
          Darwin-arm64)
            platform=macos-arm64
            checksum=0cb03302051f844c9f9dddc4d53e3c5c9ea5fdd72ee1ca7fd3e3b1a55ac34ddf
            ;;
          Darwin-x86_64)
            platform=macos-x64
            checksum=471a885e775cf5022372d4c5c2f426228e8e1f48cdc4dca5cc718547cb390cab
            ;;
          *)
            echo 'Unsupported runner platform' >&2
            exit 1
            ;;
        esac

        mise_dir="$RUNNER_TEMP/mise-bin"
        mkdir -p "$mise_dir"
        mise_binary="$mise_dir/mise"
        curl --fail --location --retry 5 --silent --show-error \
          "https://github.com/jdx/mise/releases/download/$version/mise-$version-$platform" \
          --output "$mise_binary"
        printf '%s  %s\n' "$checksum" "$mise_binary" | shasum -a 256 --check
        chmod +x "$mise_binary"

        read -r -a tools <<< "$TOOLS"
        "$mise_binary" install "${tools[@]}"
        for tool in "${tools[@]}"; do
          dirname "$("$mise_binary" which "$tool")" >> "$GITHUB_PATH"
        done
