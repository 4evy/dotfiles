---
name: Set Up Bun
description: Install the pinned Bun runtime and restore its dependency download cache.

inputs:
  cache-dependency-path:
    description: Newline-separated lockfile patterns, defaults to the shared project inventory.
    required: false
  cache-scope:
    description: Stable namespace that prevents unrelated Bun projects sharing entries.
    required: true

runs:
  using: composite
  steps:
    - name: Install Bun
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |- # zizmor: ignore[github-env] export the pinned runtime path only
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux-x64 ;;
          macOS-ARM64) platform=darwin-aarch64 ;;
          macOS-X64) platform=darwin-x64 ;;
          *) echo 'Unsupported runner platform' >&2; exit 1 ;;
        esac
        version=
        while read -r tool pinned; do
          if [[ "$tool" == bun ]]; then
            version=$pinned
            break
          fi
        done < .tool-versions
        [[ -n "$version" ]]
        temporary=$(mktemp -d)
        trap 'rm -rf "$temporary"' EXIT
        # Use the release API, not the browser download route
        gh release download "bun-v$version" --repo oven-sh/bun \
          --pattern "bun-$platform.zip" --output "$temporary/bun.zip"
        unzip -q "$temporary/bun.zip" -d "$temporary"
        bin="$RUNNER_TEMP/bun/bin"
        mkdir -p "$bin"
        install -m 755 "$temporary/bun-$platform/bun" "$bin/bun"
        printf '%s\n' "$bin" >> "$GITHUB_PATH"

    - name: Resolve Bun Lockfiles
      id: lockfiles
      shell: bash
      env:
        DEPENDENCY_PATHS: ${{ inputs.cache-dependency-path }}
      run: |
        {
          echo 'paths<<BUN_LOCKFILES'
          if [[ -n "$DEPENDENCY_PATHS" ]]; then
            printf '%s\n' "$DEPENDENCY_PATHS"
          else
            bun -e 'import projects from "./data/bun/projects.json"; console.log(projects.map(project => project.directory === "." ? "bun.lock" : `${project.directory}/bun.lock`).join("\n"))'
          fi
          echo BUN_LOCKFILES
        } >> "$GITHUB_OUTPUT"

    - name: Restore Bun Dependency Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ inputs.cache-scope }}-${{
          hashFiles(steps.lockfiles.outputs.paths) }}
        restore-keys: >-
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ inputs.cache-scope }}-
