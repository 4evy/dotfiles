---
name: Set Up Check Tools
description: Install check tools at versions declared in the root .tool-versions.

inputs:
  tools:
    description: Space-separated tool names from .tool-versions.
    default: just

runs:
  using: composite
  steps:
    # Bootstrap directly because the repository allowlist excludes mise-action
    - name: Install Check Tools
      shell: bash
      env:
        MISE_VERSION: v2026.11.6
        LINUX_X64_SHA256: 5fb74f80aab81e0a5ca20eb6414cc69b78ae0cab1deaeb521572ed26d8d4a6e3
        MACOS_ARM64_SHA256: 8b9b3459f331bde1e7b830d829dddd7cda5a558063103e451fba9f976e91acdb
        MACOS_X64_SHA256: a502913a19b7e2284ed9aa1f349434245929f0cd3ae53acfd300b0ad28043c71
        TOOLS: ${{ inputs.tools }}
        # Trust only the version file, not arbitrary repository mise configuration
        MISE_TRUSTED_CONFIG_PATHS: ${{ env.MISE_TRUSTED_CONFIG_PATHS || format('{0}/.tool-versions', github.workspace) }}
        MISE_GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
      run: |- # zizmor: ignore[github-env] export the verified bootstrap and pinned tool paths only
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux-x64; checksum=$LINUX_X64_SHA256 ;;
          macOS-ARM64) platform=macos-arm64; checksum=$MACOS_ARM64_SHA256 ;;
          macOS-X64) platform=macos-x64; checksum=$MACOS_X64_SHA256 ;;
          *) echo 'Unsupported runner platform' >&2; exit 1 ;;
        esac
        bin="$RUNNER_TEMP/check-tools/bin"
        mkdir -p "$bin"
        temporary=$(mktemp -d)
        trap 'rm -rf "$temporary"' EXIT
        # The release API avoids the browser download route's gateway failures
        gh release download "$MISE_VERSION" --repo jdx/mise \
          --pattern "mise-$MISE_VERSION-$platform" --output "$temporary/mise"
        # BSD sha256sum requires an explicit stdin operand in check mode
        if command -v sha256sum >/dev/null 2>&1; then
          printf '%s  %s\n' "$checksum" "$temporary/mise" | sha256sum -c -
        else
          printf '%s  %s\n' "$checksum" "$temporary/mise" | shasum -a 256 -c -
        fi
        install -m 755 "$temporary/mise" "$bin/mise"
        export PATH="$bin:$PATH"
        read -r -a tools <<< "$TOOLS"
        mise install "${tools[@]}"
        # Export only selected tools, not mise shims or repository environment
        printf '%s\n' "$bin" >> "$GITHUB_PATH"
        for tool in "${tools[@]}"; do
          dirname "$(mise which "$tool")" >> "$GITHUB_PATH"
        done
