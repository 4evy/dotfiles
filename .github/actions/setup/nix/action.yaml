---
name: Set Up Nix
description: Install pinned Determinate Nix.

runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      # Prevent installer login from enabling FlakeHub Cache in OIDC-enabled jobs.
      # Image signing retains OIDC access in its own steps.
      env:
        ACTIONS_ID_TOKEN_REQUEST_URL: ""

    - name: Cache Nix Store
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-gha-cache: enabled
        use-flakehub: disabled
