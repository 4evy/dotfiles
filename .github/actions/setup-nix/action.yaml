---
name: Set Up Nix
description: Install pinned Determinate Nix.

runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      # Prevent installer login from enabling FlakeHub Cache in OIDC-enabled jobs.
      # Image signing retains OIDC access in its own steps.
      env:
        ACTIONS_ID_TOKEN_REQUEST_URL: ""

    - name: Cache Nix Store
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-gha-cache: enabled
        use-flakehub: disabled
