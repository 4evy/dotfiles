---
name: Set Up Nix
description: Install pinned Determinate Nix.

runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      # Prevent installer login from enabling FlakeHub Cache in OIDC-enabled jobs.
      # Image signing retains OIDC access in its own steps.
      env:
        ACTIONS_ID_TOKEN_REQUEST_URL: ""

    - name: Cache Nix Store
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      with:
        use-gha-cache: enabled
        use-flakehub: disabled
