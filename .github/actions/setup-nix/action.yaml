---
name: Set Up Nix
description: Install pinned Determinate Nix.

runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
      # Prevent installer login from enabling FlakeHub Cache in OIDC-enabled jobs.
      # Image signing retains OIDC access in its own steps.
      env:
        ACTIONS_ID_TOKEN_REQUEST_URL: ""

    - name: Cache Nix Store
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-gha-cache: enabled
        use-flakehub: disabled
