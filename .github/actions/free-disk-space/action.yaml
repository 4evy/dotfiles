name: Free Runner Disk Space
description: Remove preinstalled toolchains that container-image builds do not use.

runs:
  using: composite
  steps:
    - name: Remove Unused Runner Software
      shell: bash
      run: |
        echo "Available space before cleanup:"
        df -h

        sudo swapoff -a || true
        sudo rm -f /swapfile

        shopt -s nullglob
        printf '%s\0' \
          /opt/PyPy \
          /opt/Ruby \
          /opt/az \
          /opt/go \
          /opt/google/chrome \
          /opt/microsoft/msedge \
          /opt/node \
          /opt/pipx \
          /usr/lib/firefox \
          /usr/lib/llvm-* \
          /usr/local/.ghcup \
          /usr/local/julia* \
          /usr/local/lib/android \
          /usr/share/dotnet \
          /usr/share/swift \
          | sudo xargs -0 -n1 -P4 rm -rf

        echo "Available space after cleanup:"
        df -h
