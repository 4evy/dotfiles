---
applications_helium_linux_current: "{{ dotfiles_data_dir }}/helium/current"
applications_black_rose_doll_palette: >-
  {{
    lookup(
      "file",
      dotfiles_repo_root
      ~ '/dotfiles/.chezmoitemplates/black_rose_doll_palette.json'
    )
    | from_json
  }}
applications_helium_accent_rgb: >-
  {{ applications_black_rose_doll_palette.dark.rose | hex_color_to_rgb_csv }}
applications_helix_revision: >-
  {{
    lookup('env', 'HELIX_TIP_REVISION')
    | default(dotfiles_pins.helix.revision, true)
  }}
applications_helix_repository: >-
  https://github.com/{{ dotfiles_pins.helix.repository.owner }}/{{
    dotfiles_pins.helix.repository.repo
  }}.git
applications_helix_cache_dir: "{{ dotfiles_cache_dir }}/helix"
applications_helix_source_dir: "{{ applications_helix_cache_dir }}/source"
applications_helix_install_prefix: "{{ dotfiles_data_dir }}/helix-tip"
applications_helix_runtime_dir: >-
  {{ applications_helix_install_prefix }}/libexec/runtime
applications_helix_executable: "{{ applications_helix_install_prefix }}/bin/hx"
