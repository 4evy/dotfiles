---
- name: Detect Ghostty
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - command -v ghostty
  changed_when: false
  failed_when: false
  check_mode: false
  register: applications_ghostty
  when: platform_is_linux

- name: Require Ghostty from the native Linux host or image
  ansible.builtin.assert:
    that:
      - applications_ghostty.rc == 0
    fail_msg: >-
      Ghostty is not installed. Spectrum supplies the patched native build in
      its BlueBuild image and NixOS supplies packages.ghostty-patched; this
      role does not install GUI applications through Nix on other Linux hosts.
  when:
    - platform_is_linux

- name: Link Homebrew's patched Ghostty application on macOS
  ansible.builtin.file:
    src: "{{ platform_homebrew_prefix }}/opt/ghostty-patched/Ghostty.app"
    dest: /Applications/Ghostty.app
    state: link
    force: true
  when: platform_is_macos

- name: Keep Ghostty's macOS signing identity stable
  ansible.builtin.command:
    argv: >-
      {{
        [
          dotfiles_bin_dir ~ '/dotfiles-scripts',
          'macos',
          'sign-ghostty',
          '--app',
          platform_homebrew_prefix ~ '/opt/ghostty-patched/Ghostty.app'
        ]
        + (['--check'] if ansible_check_mode else [])
      }}
  environment:
    PATH: "{{ dotfiles_bin_dir }}:{{ dotfiles_path }}"
  changed_when: false
  check_mode: false
  when: platform_is_macos
