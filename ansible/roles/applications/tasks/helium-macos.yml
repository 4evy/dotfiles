---
- name: Detect a running Helium application on macOS
  ansible.builtin.command:
    argv:
      - /usr/bin/pgrep
      - -f
      - ^/Applications/Helium[.]app/
  register: applications_helium_running
  changed_when: false
  failed_when: applications_helium_running.rc not in [0, 1]
  check_mode: false
  tags:
    - helium

- name: Require Helium to be closed before changing its profile
  ansible.builtin.assert:
    that:
      - ansible_check_mode or applications_helium_running.rc == 1
    fail_msg: >-
      Helium or one of its helper processes is running. Close it before
      applying the Helium role so its profile databases and preferences
      cannot be modified concurrently.
  tags:
    - helium

- name: Configure Helium on macOS
  ansible.builtin.import_tasks: helium-profile.yml
  vars:
    applications_helium_platform: macos
    applications_helium_root: "{{ dotfiles_cache_dir }}/helium"
    applications_helium_app_dir: /Applications/Helium.app
    applications_helium_bin_dir: "{{ dotfiles_bin_dir }}"
    applications_helium_installer_bin: >-
      {{ dotfiles_cache_dir }}/helium/configurer
    applications_helium_path: >-
      {{ dotfiles_bin_dir }}:{{ platform_homebrew_path | default(dotfiles_path) }}
    applications_helium_profile_dir: >-
      {{ dotfiles_home_dir }}/Library/Application Support/net.imput.helium/Default
    applications_helium_flags: >-
      --no-first-run --no-default-browser-check --disable-search-engine-choice-screen
      --extension-mime-request-handling=always-prompt-for-install
      --omnibox-autocomplete-filtering=search
      --set-user-color={{ applications_helium_accent_rgb }}
      --set-color-scheme=dark --set-color-variant=tonal_spot
  tags:
    - helium
