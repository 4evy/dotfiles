---
bootstrap_homebrew_installer_url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
bootstrap_homebrew_repository: >-
  {{
    bootstrap_homebrew_prefix
    if platform_is_macos and platform_architecture == 'arm64'
    else bootstrap_homebrew_prefix ~ '/Homebrew'
  }}
bootstrap_homebrew_local_tap_dir: >-
  {{ bootstrap_homebrew_repository }}/Library/Taps/4evy/homebrew-dotfiles

bootstrap_permstrap_version: 1.0.0
bootstrap_permstrap_archive_url: >-
  https://github.com/4evy/permstrap/releases/download/v{{ bootstrap_permstrap_version }}/permstrap-{{ bootstrap_permstrap_version }}-macos-arm64.zip
bootstrap_permstrap_archive_checksum: >-
  sha256:54991233614cfca6e59bf8d0dfaa29ac33bd96f6e919a6f82149beeb608565df
bootstrap_permstrap_app_path: /Applications/Permstrap.app
bootstrap_permstrap_targets_path: >-
  {{ dotfiles_repo_root }}/manifests/permstrap/PermissionTargets.json

bootstrap_bootstrap_packages:
  apt:
    - bubblewrap
    - curl
    - file
    - git
    - podman
    - podman-compose
    - procps
  apk:
    - bubblewrap
    - curl
    - file
    - git
    - podman
    - podman-compose
    - procps-ng
  dnf:
    - bubblewrap
    - curl
    - file
    - git
    - podman
    - podman-compose
    - procps-ng
  pacman:
    - bubblewrap
    - curl
    - file
    - git
    - podman
    - podman-compose
    - procps-ng

bootstrap_build_toolchain_packages:
  apt:
    - binutils
    - build-essential
    - clang
    - cmake
    - libclang-dev
    - libglib2.0-dev
    - libssl-dev
    - libvterm-dev
    - lld
    - lldb
    - patch
    - perl
    - pkg-config
    - zlib1g-dev
  apk:
    - binutils
    - build-base
    - clang
    - cmake
    - glib-dev
    - libvterm-dev
    - linux-headers
    - lld
    - lldb
    - openssl-dev
    - patch
    - perl
    - pkgconf
    - zlib-dev
  dnf:
    - binutils
    - clang
    - cmake
    - gcc
    - gcc-c++
    - glibc-devel
    - glib2-devel
    - libvterm-devel
    - lld
    - lldb
    - make
    - openssl-devel
    - patch
    - perl
    - pkgconf-pkg-config
    - zlib-devel
  pacman:
    - base-devel
    - binutils
    - clang
    - cmake
    - glib2
    - libvterm
    - lld
    - lldb
    - openssl
    - patch
    - perl
    - pkgconf
    - zlib
