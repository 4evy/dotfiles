---
- name: Inspect repository Python tool installation
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ dotfiles_cache_dir }}/dotfiles-python-tool.sha256"
    - "{{ dotfiles_bin_dir }}/phone-mirror"
  register: bootstrap_dotfiles_python_tool_state
  tags:
    - bootstrap
    - repo-tools
    - python
    - scripts

- name: Install repository Python tool when its locked metadata changes
  when: >-
    not bootstrap_dotfiles_python_tool_state.results[0].stat.exists
    or not bootstrap_dotfiles_python_tool_state.results[1].stat.exists
    or bootstrap_dotfiles_python_tool_state.results[0].stat.checksum | default('')
      != bootstrap_dotfiles_python_tool_metadata | hash('sha256')
  vars:
    bootstrap_uv_command: "{{ bootstrap_homebrew_prefix ~ '/bin/uv' if bootstrap_homebrew_prefix is defined else 'uv' }}"
    bootstrap_dotfiles_python_tool_metadata: >-
      {{ lookup('ansible.builtin.file', dotfiles_repo_root ~ '/pyproject.toml') }}
      {{ lookup('ansible.builtin.file', dotfiles_repo_root ~ '/uv.lock') }}
  tags:
    - bootstrap
    - repo-tools
    - python
    - scripts
  block:
    - name: Export locked Python runtime constraints
      ansible.builtin.command:
        argv:
          - "{{ bootstrap_uv_command }}"
          - export
          - --locked
          - --no-dev
          - --no-emit-project
          - --no-hashes
          - --no-annotate
          - --no-header
          - --output-file
          - "{{ dotfiles_cache_dir }}/dotfiles-python-constraints.txt"
        chdir: "{{ dotfiles_repo_root }}"
      environment:
        PATH: "{{ bootstrap_homebrew_path | default(dotfiles_path) }}"
      changed_when: false

    - name: Install repository Python commands with uv
      ansible.builtin.command:
        argv:
          - "{{ bootstrap_uv_command }}"
          - tool
          - install
          - --python
          - "3.14"
          - --editable
          - --force
          - --compile-bytecode
          - --constraints
          - "{{ dotfiles_cache_dir }}/dotfiles-python-constraints.txt"
          - "{{ dotfiles_repo_root }}"
      environment:
        PATH: "{{ bootstrap_homebrew_path | default(dotfiles_path) }}"
        UV_PYTHON_PREFERENCE: only-managed
        UV_TOOL_BIN_DIR: "{{ dotfiles_bin_dir }}"
        UV_TOOL_DIR: "{{ dotfiles_data_dir }}/uv-tools"
      changed_when: true

    - name: Record installed repository Python tool metadata
      ansible.builtin.copy:
        content: "{{ bootstrap_dotfiles_python_tool_metadata }}"
        dest: "{{ dotfiles_cache_dir }}/dotfiles-python-tool.sha256"
        mode: "0644"
