---
- name: Install Linux bootstrap packages before Homebrew
  ansible.builtin.import_tasks: packages.yml
  when: platform_is_linux
  tags:
    - bootstrap
    - packages

- name: Install Homebrew and modern Bash first
  ansible.builtin.import_tasks: homebrew.yml
  when: platform_system in ['Darwin', 'Linux']
  tags:
    - bootstrap
    - bash
    - homebrew

- name: Apply Homebrew bundle
  ansible.builtin.import_tasks: homebrew-bundle.yml
  when: bootstrap_homebrew_enabled | default(false)
  tags:
    - bootstrap
    - homebrew

- name: Install the dotfiles CLI early
  ansible.builtin.import_tasks: dotfiles-cli.yml
  when: platform_system in ['Darwin', 'Linux']
  tags:
    - bootstrap
    - repo-tools
    - scripts
    - system-runner

- name: Install non-Linux bootstrap packages
  ansible.builtin.import_tasks: packages.yml
  when: not platform_is_linux
  tags:
    - bootstrap
    - packages

- name: Install Rust
  ansible.builtin.import_tasks: rust.yml
  tags:
    - bootstrap
    - rustup
