---
- name: Install bootstrap packages with the detected package manager
  module_defaults:
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
    community.general.apk:
      update_cache: true
    community.general.pacman:
      update_cache: true
  ansible.builtin.package:
    name: >-
      {{
        bootstrap_bootstrap_packages[bootstrap_package_key]
        + bootstrap_build_toolchain_packages[bootstrap_package_key]
      }}
    state: present
  become: true
  when:
    - not platform_has_rpm_ostree
    - bootstrap_package_key in bootstrap_bootstrap_packages
  vars:
    bootstrap_package_key: >-
      {{
        'dnf'
        if ansible_facts.pkg_mgr in ['dnf', 'dnf5']
        else ansible_facts.pkg_mgr
      }}
  tags:
    - bootstrap
    - packages
