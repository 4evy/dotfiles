---
- name: Ensure local dotfiles Homebrew tap root exists
  ansible.builtin.file:
    path: "{{ bootstrap_homebrew_local_tap_dir }}"
    state: directory
    mode: "0755"
  tags: &bootstrap_homebrew_tap_tags
    - ghostty
    - helix
    - jj
    - kanata
    - theme-run

- name: Synchronize repository-owned local Homebrew tap content
  ansible.posix.synchronize:
    src: "{{ dotfiles_repo_root }}/"
    dest: "{{ bootstrap_homebrew_local_tap_dir }}/"
    archive: true
    checksum: true
    delete: true
    rsync_opts: >-
      {{
        bootstrap_homebrew_tap_rsync_common
        + (bootstrap_homebrew_tap_rsync_macos if platform_is_macos else [])
        + ['--exclude=*', '--delete-excluded', '--prune-empty-dirs']
      }}
  vars:
    bootstrap_homebrew_tap_rsync_common:
      - "--filter=protect_/Sources/***"
      - "--include=/Formula/***"
      - "--include=/flake.lock"
      - "--include=/packages/"
      - "--include=/packages/source-lock/"
      - "--include=/packages/source-lock/***"
    bootstrap_homebrew_tap_rsync_macos:
      - "--include=/libexec/***"
  tags: *bootstrap_homebrew_tap_tags

- name: Ensure local Homebrew source directory exists
  ansible.builtin.file:
    path: "{{ bootstrap_homebrew_local_tap_dir }}/Sources"
    state: directory
    mode: "0755"
  tags:
    - theme-run

- name: Ensure Homebrew temporary directory exists
  ansible.builtin.file:
    path: "{{ bootstrap_homebrew_temp_dir }}"
    state: directory
    mode: "0755"
  tags: *bootstrap_homebrew_tap_tags

- name: Package the current theme-run source for Homebrew
  ansible.builtin.command:
    argv:
      - /usr/bin/tar
      - -cf
      - "{{ bootstrap_homebrew_local_tap_dir }}/Sources/theme-run-0.1.0.tar"
      - -C
      - "{{ dotfiles_repo_root }}/packages/theme-run"
      - go.mod
      - go.sum
      - README.md
      - cmd
      - internal
      - -C
      - "{{ dotfiles_repo_root }}"
      - LICENSE
  environment:
    COPYFILE_DISABLE: "1"
  changed_when: false
  tags:
    - theme-run

- name: Clear Discord cask ASAR locks before Homebrew changes
  ansible.builtin.command:
    argv:
      - chflags
      - nouchg
      - "{{ item }}"
  changed_when: false
  failed_when: false
  when:
    - platform_is_macos
    - not ansible_check_mode
  loop:
    - /Applications/Discord.app/Contents/Resources/app.asar
    - /Applications/Discord.app/Contents/Resources/_app.asar
  tags:
    - discord

- name: Inspect the Ghostty patched Cellar
  ansible.builtin.stat:
    path: "{{ bootstrap_homebrew_prefix }}/Cellar/ghostty-patched"
  register: bootstrap_ghostty_patched_cellar
  when: platform_is_macos
  tags:
    - ghostty

- name: Enumerate installed Ghostty patched kegs
  ansible.builtin.find:
    paths: "{{ bootstrap_homebrew_prefix }}/Cellar/ghostty-patched"
    file_type: directory
    recurse: false
  register: bootstrap_ghostty_patched_kegs
  when:
    - platform_is_macos
    - bootstrap_ghostty_patched_cellar.stat.isdir | default(false)
  tags:
    - ghostty

- name: Inspect installed Ghostty patched keg receipts
  ansible.builtin.stat:
    path: "{{ item.path }}/INSTALL_RECEIPT.json"
  loop: "{{ bootstrap_ghostty_patched_kegs.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: bootstrap_ghostty_patched_receipts
  when: platform_is_macos
  tags:
    - ghostty

- name: Inspect the Ghostty patched Homebrew opt link
  ansible.builtin.stat:
    path: "{{ bootstrap_homebrew_prefix }}/opt/ghostty-patched"
    follow: false
  register: bootstrap_ghostty_patched_opt
  when: platform_is_macos
  tags:
    - ghostty

- name: Inspect the Ghostty patched opt link target receipt
  ansible.builtin.stat:
    path: "{{ bootstrap_ghostty_patched_opt.stat.lnk_source }}/INSTALL_RECEIPT.json"
  register: bootstrap_ghostty_patched_opt_receipt
  when:
    - platform_is_macos
    - bootstrap_ghostty_patched_opt.stat.islnk | default(false)
  tags:
    - ghostty

- name: Remove a Ghostty patched opt link to an incomplete keg
  ansible.builtin.file:
    path: "{{ bootstrap_homebrew_prefix }}/opt/ghostty-patched"
    state: absent
  when:
    - platform_is_macos
    - bootstrap_ghostty_patched_opt.stat.islnk | default(false)
    - not (bootstrap_ghostty_patched_opt_receipt.stat.exists | default(false))
  tags:
    - ghostty

- name: Remove incomplete Ghostty patched kegs
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ bootstrap_ghostty_patched_receipts.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  when:
    - platform_is_macos
    - not item.stat.exists
  tags:
    - ghostty

- name: Ensure privileged Homebrew cask is installed
  community.general.homebrew_cask:
    name: temurin@21
    path: "{{ bootstrap_homebrew_prefix }}/bin"
    state: present
    sudo_password: >-
      {{
        lookup('ansible.builtin.env', 'ANSIBLE_BECOME_PASS')
        or lookup('ansible.builtin.env', 'ANSIBLE_BECOME_PASSWORD')
      }}
  when: platform_is_macos
  tags:
    - temurin

- name: Apply Homebrew bundle
  block:
    - name: Allow Xcode asset builds to reach macOS services
      ansible.builtin.replace:
        path: >-
          {{ bootstrap_homebrew_repository }}/Library/Homebrew/extend/os/mac/sandbox.rb
        regexp: '^        \(deny mach-lookup\)$'
        replace: '        (allow mach-lookup)'
      register: bootstrap_homebrew_xcode_sandbox
      when: platform_is_macos

    - name: Install Homebrew bundle
      ansible.builtin.command:
        argv:
          - "{{ bootstrap_homebrew_prefix }}/bin/brew"
          - bundle
          - install
          - >-
            {{
              '--upgrade'
              if lookup('ansible.builtin.env', 'DOTFILES_HOMEBREW_UPGRADE') == '1'
              else '--no-upgrade'
            }}
          - --force-cleanup
          - --file
          - "-"
      args:
        chdir: "{{ dotfiles_repo_root }}"
        stdin: |-
          {{ lookup('ansible.builtin.file', dotfiles_repo_root ~ '/Brewfile') }}
          {{
            lookup(
              'ansible.builtin.file',
              bootstrap_homebrew_private_bundle_file,
              errors='ignore'
            )
          }}
      environment:
        HOMEBREW_NO_ASK: "1"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_TEMP: "{{ bootstrap_homebrew_temp_dir }}"
        PATH: "{{ bootstrap_homebrew_path }}"
      register: bootstrap_homebrew_bundle_install
      retries: 2
      delay: 2
      until: bootstrap_homebrew_bundle_install.rc == 0
      changed_when: >-
        bootstrap_homebrew_bundle_install.attempts | default(1) > 1
        or bootstrap_homebrew_bundle_install.stdout is search('(^|\n)(==> )?(Installing|Upgrading|Uninstalling|Uninstalled|Untapping|Removing) ')
        or bootstrap_homebrew_bundle_install.stderr is search('(^|\n)(==> )?(Installing|Upgrading|Uninstalling|Uninstalled|Untapping|Removing) ')
  always:
    - name: Restore the Homebrew macOS sandbox profile
      ansible.builtin.replace:
        path: >-
          {{ bootstrap_homebrew_repository }}/Library/Homebrew/extend/os/mac/sandbox.rb
        regexp: '^        \(allow mach-lookup\)$'
        replace: '        (deny mach-lookup)'
      when:
        - platform_is_macos
        - bootstrap_homebrew_xcode_sandbox is changed

- name: Read the packaged theme-run source checksum
  ansible.builtin.stat:
    path: "{{ bootstrap_homebrew_local_tap_dir }}/Sources/theme-run-0.1.0.tar"
    checksum_algorithm: sha256
  register: bootstrap_homebrew_theme_run_source
  tags:
    - theme-run

- name: Inspect the installed theme-run source checksum
  ansible.builtin.stat:
    path: >-
      {{ bootstrap_homebrew_prefix }}/opt/theme-run/share/theme-run/source.sha256
  register: bootstrap_homebrew_theme_run_installed_checksum_file
  tags:
    - theme-run

- name: Inspect the installed theme-run prefix
  ansible.builtin.stat:
    path: "{{ bootstrap_homebrew_prefix }}/opt/theme-run"
  register: bootstrap_homebrew_theme_run_installed_prefix
  tags:
    - theme-run

- name: Read the installed theme-run source checksum
  ansible.builtin.slurp:
    path: >-
      {{ bootstrap_homebrew_prefix }}/opt/theme-run/share/theme-run/source.sha256
  register: bootstrap_homebrew_theme_run_installed_source
  when: >-
    bootstrap_homebrew_theme_run_installed_checksum_file.stat.exists
    | default(false)
  tags:
    - theme-run

- name: Install theme-run or refresh it when its local source changes
  environment:
    HOMEBREW_TEMP: "{{ bootstrap_homebrew_temp_dir }}"
  when:
    - >-
      not (bootstrap_homebrew_theme_run_installed_prefix.stat.exists | default(false))
      or not (
        bootstrap_homebrew_theme_run_installed_checksum_file.stat.exists
        | default(false)
      )
      or (
          bootstrap_homebrew_theme_run_installed_source.content
          | default('')
          | b64decode
          | trim
        ) != bootstrap_homebrew_theme_run_source.stat.checksum
  tags:
    - theme-run
  block:
    - name: Remove theme-run built from the previous local source
      community.general.homebrew:
        name: 4evy/dotfiles/theme-run
        path: "{{ bootstrap_homebrew_prefix }}/bin"
        state: absent

    - name: Install theme-run from the current local source
      community.general.homebrew:
        name: 4evy/dotfiles/theme-run
        force_formula: true
        path: "{{ bootstrap_homebrew_prefix }}/bin"
        state: present
