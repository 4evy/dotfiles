- name: Detect whether full Xcode is active
  ansible.builtin.command:
    argv:
      - /usr/bin/xcodebuild
      - -version
  register: bootstrap_xcode_active
  check_mode: false
  changed_when: false
  failed_when: false
  when: platform_is_macos
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - xcode

- name: Inspect the standard full Xcode application path
  ansible.builtin.stat:
    path: /Applications/Xcode.app/Contents/Developer
  register: bootstrap_xcode_app
  when:
    - platform_is_macos
    - bootstrap_xcode_active.rc != 0
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - xcode

- name: Install full Xcode from the Mac App Store
  ansible.builtin.command:
    argv:
      - "{{ bootstrap_homebrew_prefix }}/bin/mas"
      - get
      - "497799835"
  environment:
    PATH: "{{ bootstrap_homebrew_path }}"
  become: true
  changed_when: true
  when:
    - platform_is_macos
    - bootstrap_xcode_active.rc != 0
    - not bootstrap_xcode_app.stat.exists
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - xcode

- name: Select full Xcode for command-line builds
  ansible.builtin.command:
    argv:
      - /usr/bin/xcode-select
      - --switch
      - /Applications/Xcode.app/Contents/Developer
  become: true
  changed_when: true
  when:
    - platform_is_macos
    - bootstrap_xcode_active.rc != 0
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - xcode

- name: Check whether Xcode first-launch setup is complete
  ansible.builtin.command:
    argv:
      - /usr/bin/xcodebuild
      - -checkFirstLaunchStatus
  register: bootstrap_xcode_first_launch
  check_mode: false
  changed_when: false
  failed_when: false
  when: platform_is_macos
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - xcode

- name: Complete Xcode first-launch setup
  ansible.builtin.command:
    argv:
      - /usr/bin/xcodebuild
      - -runFirstLaunch
  become: true
  changed_when: true
  when:
    - platform_is_macos
    - bootstrap_xcode_first_launch.rc != 0
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - xcode

- name: Inspect the Xcode Metal toolchain component
  ansible.builtin.command:
    argv:
      - /usr/bin/xcodebuild
      - -showComponent
      - MetalToolchain
      - -json
  register: bootstrap_xcode_metal_toolchain
  check_mode: false
  changed_when: false
  when: platform_is_macos
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - xcode

- name: Install the Xcode Metal toolchain component
  ansible.builtin.command:
    argv:
      - /usr/bin/xcodebuild
      - -downloadComponent
      - MetalToolchain
  changed_when: true
  when:
    - platform_is_macos
    - (bootstrap_xcode_metal_toolchain.stdout | from_json).status != 'installed'
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - xcode

- name: Verify full Xcode is active for patched Ghostty builds
  ansible.builtin.command:
    argv:
      - /usr/bin/xcodebuild
      - -version
  check_mode: false
  changed_when: false
  when: platform_is_macos
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - xcode

- name: Remove upstream Ghostty casks before installing the patched native build
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: absent
    install_options: force
    path: "{{ bootstrap_homebrew_prefix }}/bin"
  when: platform_is_macos
  loop:
    - ghostty
    - ghostty@tip
  tags:
    - bootstrap
    - ghostty
    - homebrew

- name: Tap local dotfiles Homebrew formulae
  community.general.homebrew_tap:
    name: 4evy/dotfiles
    url: "{{ dotfiles_repo_root }}"
    state: present
    path: "{{ bootstrap_homebrew_prefix }}/bin"
  environment:
    PATH: "{{ bootstrap_homebrew_path }}"
  when: platform_is_macos
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - kanata

- name: Ensure local dotfiles Homebrew tap Formula directory exists
  ansible.builtin.file:
    path: "{{ bootstrap_homebrew_prefix }}/Library/Taps/4evy/homebrew-dotfiles/Formula"
    state: directory
    mode: "0755"
  when: platform_is_macos
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - kanata

- name: Ensure local Homebrew source archive directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dotfiles_cache_dir }}/homebrew-sources"
    - "{{ bootstrap_homebrew_prefix }}/Library/Taps/4evy/homebrew-dotfiles/Sources"
  when: platform_is_macos
  tags:
    - bootstrap
    - homebrew
    - terminal-theme-tools

- name: Create deterministic terminal theme tools source archive
  ansible.builtin.command:
    argv:
      - /usr/bin/tar
      - -cf
      - "{{ dotfiles_cache_dir }}/homebrew-sources/terminal-theme-tools-0.1.0.tar"
      - -C
      - "{{ dotfiles_repo_root }}/packages/terminal-theme-tools"
      - .clang-tidy
      - data
      - meson.build
      - meson.options
      - src
      - subprojects/.wraplock
      - subprojects/tomlc17.wrap
      - subprojects/packagefiles
      - tests
      - -C
      - "{{ dotfiles_repo_root }}"
      - LICENSE
  environment:
    COPYFILE_DISABLE: "1"
  changed_when: false
  when: platform_is_macos
  tags:
    - bootstrap
    - homebrew
    - terminal-theme-tools

- name: Sync terminal theme tools source archive into local tap
  ansible.builtin.copy:
    src: "{{ dotfiles_cache_dir }}/homebrew-sources/terminal-theme-tools-0.1.0.tar"
    dest: "{{ bootstrap_homebrew_prefix }}/Library/Taps/4evy/homebrew-dotfiles/Sources/terminal-theme-tools-0.1.0.tar"
    mode: "0644"
    remote_src: true
  when: platform_is_macos
  tags:
    - bootstrap
    - homebrew
    - terminal-theme-tools

- name: Sync terminal theme tools formula into local tap
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_root }}/Formula/terminal-theme-tools.rb"
    dest: "{{ bootstrap_homebrew_prefix }}/Library/Taps/4evy/homebrew-dotfiles/Formula/terminal-theme-tools.rb"
    mode: "0644"
  when: platform_is_macos
  tags:
    - bootstrap
    - homebrew
    - terminal-theme-tools

- name: Sync command-enabled Kanata formula into local tap
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_root }}/Formula/kanata-with-cmd.rb"
    dest: "{{ bootstrap_homebrew_prefix }}/Library/Taps/4evy/homebrew-dotfiles/Formula/kanata-with-cmd.rb"
    mode: "0644"
  when: platform_is_macos
  tags:
    - bootstrap
    - homebrew
    - kanata

- name: Sync patched Ghostty formula into local tap
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_root }}/Formula/ghostty-patched.rb"
    dest: "{{ bootstrap_homebrew_prefix }}/Library/Taps/4evy/homebrew-dotfiles/Formula/ghostty-patched.rb"
    mode: "0644"
  when: platform_is_macos
  tags:
    - bootstrap
    - ghostty
    - homebrew

- name: Sync shared source manifest and schema into local Homebrew tap
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_root }}/manifests/{{ item }}"
    dest: "{{ bootstrap_homebrew_prefix }}/Library/Taps/4evy/homebrew-dotfiles/{{ item }}"
    mode: "0644"
  loop:
    - sources.json
    - sources.schema.json
  when: platform_is_macos
  tags:
    - bootstrap
    - ghostty
    - homebrew
    - kanata

- name: Sync Ghostty patches into local Homebrew tap
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_root }}/patches/ghostty/"
    dest: "{{ bootstrap_homebrew_prefix }}/Library/Taps/4evy/homebrew-dotfiles/Patches/ghostty/"
    mode: "0644"
    directory_mode: "0755"
  when: platform_is_macos
  tags:
    - bootstrap
    - ghostty
    - homebrew

- name: Trust local dotfiles Homebrew tap
  ansible.builtin.command:
    argv:
      - "{{ bootstrap_homebrew_prefix }}/bin/brew"
      - trust
      - --tap
      - 4evy/dotfiles
  environment:
    PATH: "{{ bootstrap_homebrew_path }}"
  register: bootstrap_homebrew_dotfiles_tap_trust
  changed_when: bootstrap_homebrew_dotfiles_tap_trust.stdout is search('Trusted')
  when: platform_is_macos
  tags:
    - bootstrap
    - homebrew
    - kanata
    - ghostty

- name: Clear Discord cask ASAR locks before Homebrew changes
  ansible.builtin.command:
    argv:
      - chflags
      - nouchg
      - "{{ item }}"
  changed_when: false
  failed_when: false
  become: true
  when: platform_is_macos
  loop:
    - /Applications/Discord.app/Contents/Resources/app.asar
    - /Applications/Discord.app/Contents/Resources/_app.asar
  tags:
    - bootstrap
    - discord
    - homebrew

- name: Ensure Docker Desktop is installed without upgrading it
  community.general.homebrew_cask:
    name: docker-desktop
    state: present
    install_options:
      - no-binaries
    path: "{{ bootstrap_homebrew_prefix }}/bin"
  environment:
    HOMEBREW_NO_ASK: "1"
    PATH: "{{ bootstrap_homebrew_path }}"
  when: platform_is_macos
  tags:
    - bootstrap
    - docker
    - homebrew

- name: Remove Homebrew core Kanata before installing command-enabled formula
  community.general.homebrew:
    name: kanata
    state: absent
    path: "{{ bootstrap_homebrew_prefix }}/bin"
  environment:
    HOMEBREW_NO_ASK: "1"
    PATH: "{{ bootstrap_homebrew_path }}"
  when: platform_is_macos
  tags:
    - bootstrap
    - homebrew
    - kanata

- name: Apply Homebrew bundle
  ansible.builtin.command:
    argv:
      - "{{ bootstrap_homebrew_prefix }}/bin/brew"
      - bundle
      - install
      - --jobs
      - "1"
      - --force-cleanup
      - --file
      - "{{ dotfiles_repo_root }}/Brewfile"
  args:
    chdir: "{{ dotfiles_repo_root }}"
  environment:
    HOMEBREW_BUNDLE_CASK_SKIP: docker-desktop
    HOMEBREW_NO_ASK: "1"
    PATH: "{{ bootstrap_homebrew_path }}"
  register: bootstrap_homebrew_bundle_install
  changed_when: >-
    bootstrap_homebrew_bundle_install.stdout is search('(^|\n)(==> )?(Installing|Upgrading|Uninstalling|Uninstalled|Untapping|Removing) ')
    or bootstrap_homebrew_bundle_install.stderr is search('(^|\n)(==> )?(Installing|Upgrading|Uninstalling|Uninstalled|Untapping|Removing) ')
  when: bootstrap_homebrew_enabled | default(false)
  tags:
    - bootstrap
    - homebrew

- name: Read terminal theme tools source archive checksum
  ansible.builtin.stat:
    path: "{{ bootstrap_homebrew_prefix }}/Library/Taps/4evy/homebrew-dotfiles/Sources/terminal-theme-tools-0.1.0.tar"
    checksum_algorithm: sha256
  register: bootstrap_homebrew_terminal_theme_tools_source
  when: platform_is_macos
  tags:
    - bootstrap
    - homebrew
    - terminal-theme-tools

- name: Check terminal theme tools installed source checksum
  ansible.builtin.stat:
    path: "{{ bootstrap_homebrew_prefix }}/opt/terminal-theme-tools/share/terminal-theme-tools/source.sha256"
  register: bootstrap_homebrew_terminal_theme_tools_installed_checksum_file
  when: platform_is_macos
  tags:
    - bootstrap
    - homebrew
    - terminal-theme-tools

- name: Read installed terminal theme tools source checksum
  ansible.builtin.slurp:
    path: "{{ bootstrap_homebrew_prefix }}/opt/terminal-theme-tools/share/terminal-theme-tools/source.sha256"
  register: bootstrap_homebrew_terminal_theme_tools_installed_source
  when:
    - platform_is_macos
    - bootstrap_homebrew_terminal_theme_tools_installed_checksum_file.stat.exists
      | default(false)
  tags:
    - bootstrap
    - homebrew
    - terminal-theme-tools

- name: Reinstall terminal theme tools when its local source changes
  ansible.builtin.command:
    argv:
      - "{{ bootstrap_homebrew_prefix }}/bin/brew"
      - reinstall
      - 4evy/dotfiles/terminal-theme-tools
  environment:
    HOMEBREW_NO_ASK: "1"
    PATH: "{{ bootstrap_homebrew_path }}"
  changed_when: true
  when:
    - platform_is_macos
    - bootstrap_homebrew_terminal_theme_tools_source.stat.exists | default(false)
    - bootstrap_homebrew_terminal_theme_tools_installed_checksum_file.stat.exists
      | default(false)
    - >
      (
        bootstrap_homebrew_terminal_theme_tools_installed_source.content
        | default('')
        | b64decode
        | trim
      ) != bootstrap_homebrew_terminal_theme_tools_source.stat.checksum
  tags:
    - bootstrap
    - homebrew
    - terminal-theme-tools

- name: Verify required Homebrew-provided commands are on PATH
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - command -v "$1"
      - dotfiles-homebrew-command
      - "{{ item }}"
  environment:
    PATH: "{{ bootstrap_homebrew_path }}"
  changed_when: false
  loop: "{{ bootstrap_homebrew_required_commands | default([]) }}"
  when: bootstrap_homebrew_enabled | default(false)
  tags:
    - bootstrap
    - homebrew
