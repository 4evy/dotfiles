---
- name: Install Rustup components
  ansible.builtin.command:
    argv:
      - "{{ bootstrap_homebrew_prefix }}/bin/rustup"
      - toolchain
      - install
      - stable
      - --profile
      - default
      - --component
      - rustfmt
      - --component
      - clippy
      - --component
      - rust-analyzer
      - --component
      - rust-src
  environment:
    PATH: "{{ bootstrap_homebrew_path | default(dotfiles_path) }}"
  changed_when: "'unchanged' not in bootstrap_rustup_toolchain.stderr"
  failed_when: bootstrap_rustup_toolchain.rc != 0
  register: bootstrap_rustup_toolchain
  tags:
    - bootstrap
    - rustup
