---
- name: Keep GNOME popup backgrounds free of Blur my Shell effects
  community.general.dconf:
    key: /org/gnome/shell/extensions/blur-my-shell/popup/blur
    value: "false"
    state: present

- name: Configure GNOME window switching shortcuts
  community.general.dconf:
    key: "/org/gnome/desktop/wm/keybindings/{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - key: switch-applications
      value: "@as []"
    - key: switch-applications-backward
      value: "@as []"
    - key: switch-windows
      value: "['<Alt>Tab', '<Super>Tab']"
    - key: switch-windows-backward
      value: "['<Shift><Alt>Tab', '<Shift><Super>Tab']"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - workspace-shortcuts

- name: Free GNOME numbered application shortcuts
  community.general.dconf:
    key: >-
      /org/gnome/shell/keybindings/switch-to-application-{{ item }}
    value: "@as []"
    state: present
  loop: "{{ desktop_gnome_workspace_numbers }}"
  loop_control:
    label: "Super+{{ item }}"
  tags:
    - workspace-shortcuts

- name: Configure GNOME numbered workspace switching shortcuts
  community.general.dconf:
    key: >-
      /org/gnome/desktop/wm/keybindings/switch-to-workspace-{{ item }}
    value: "['<Super>{{ item }}']"
    state: present
  loop: "{{ desktop_gnome_workspace_numbers }}"
  loop_control:
    label: "Super+{{ item }}"
  tags:
    - workspace-shortcuts

- name: Configure GNOME numbered workspace move shortcuts
  community.general.dconf:
    key: >-
      /org/gnome/desktop/wm/keybindings/move-to-workspace-{{ item }}
    value: "['<Super><Shift>{{ item }}']"
    state: present
  loop: "{{ desktop_gnome_workspace_numbers }}"
  loop_control:
    label: "Super+Shift+{{ item }}"
  tags:
    - workspace-shortcuts

- name: Check the Vicinae launcher command
  ansible.builtin.stat:
    path: "{{ desktop_vicinae_command }}"
  register: desktop_vicinae_command_file

- name: Check writable launcher shortcut settings
  ansible.builtin.command:
    argv:
      - gsettings
      - writable
      - org.gnome.settings-daemon.plugins.media-keys
      - custom-keybindings
  changed_when: false
  failed_when: false
  check_mode: false
  register: desktop_vicinae_shortcuts_writable
  when: desktop_vicinae_command_file.stat.executable | default(false)

- name: Read existing GNOME custom keybindings
  community.general.dconf:
    key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
    state: read
  register: desktop_custom_keybindings
  when:
    - desktop_vicinae_shortcuts_writable.stdout | default('false') | trim == 'true'

- name: Register the Vicinae launcher keybinding
  community.general.dconf:
    key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
    value: >-
      {{
        (
          (
            desktop_custom_keybindings.value
            | default('@as []', true)
            | ansible.builtin.regex_replace('^@as\\s+', '')
            | ansible.builtin.from_yaml
          )
          + [desktop_vicinae_binding_path]
        )
        | ansible.builtin.unique
        | ansible.builtin.list
        | ansible.builtin.to_json
      }}
    state: present
  when: desktop_custom_keybindings is not skipped

- name: Configure the Vicinae launcher keybinding
  community.general.dconf:
    key: "{{ desktop_vicinae_binding_path }}{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - key: name
      value: "'Vicinae'"
    - key: command
      value: "'{{ desktop_vicinae_command }} toggle'"
    - key: binding
      value: "'<Super><Control><Alt><Shift>F24'"
  loop_control:
    label: "{{ item.key }}"
  when: desktop_custom_keybindings is not skipped

- name: Configure Vicinae clipboard monitoring
  community.general.dconf:
    key: "/org/gnome/shell/extensions/vicinae/{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - key: enable-clipboard-monitoring
      value: "true"
    - key: blocked-applications
      value: "{{ desktop_vicinae_blocked_applications | ansible.builtin.to_json }}"
  loop_control:
    label: "{{ item.key }}"
  when: desktop_vicinae_command_file.stat.executable | default(false)
