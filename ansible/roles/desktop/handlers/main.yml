---
- name: Stop running Sushi Flatpak process
  ansible.builtin.command:
    argv:
      - flatpak
      - kill
      - "{{ desktop_sushi_app_id }}"
  changed_when: false
  failed_when: false

- name: Stop Nautilus after Sushi rebuild
  ansible.builtin.command:
    argv:
      - nautilus
      - -q
  changed_when: false
  failed_when: false

- name: Refresh user font cache
  ansible.builtin.command:
    argv:
      - /usr/bin/fc-cache
      - -f
  changed_when: true
  when: desktop_fc_cache_binary.stat.executable | default(false)
