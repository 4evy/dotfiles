---
- name: Build repo-local Zig commands
  ansible.builtin.import_tasks: zig.yml
  tags:
    - repo-tools
    - zig

- name: Link uv-installed Python command aliases
  ansible.builtin.import_tasks: python.yml
  tags:
    - repo-tools
    - scripts

- name: Install upstream script commands
  ansible.builtin.import_tasks: upstream.yml
  tags:
    - repo-tools
    - scripts
    - upstream

- name: Verify repo-local commands
  ansible.builtin.import_tasks: verify.yml
  tags:
    - repo-tools
    - verify

- name: Install Bun tools
  ansible.builtin.import_tasks: bun.yml
  tags:
    - bun

- name: Install Nix tools
  ansible.builtin.import_tasks: nix.yml
  when: platform_is_linux or platform_is_macos
  tags:
    - nix
