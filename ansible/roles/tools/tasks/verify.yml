---
- name: Verify repo-local C23 command binaries
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_bin_dir }}/{{ item.1 }}"
      - "--version"
  changed_when: false
  loop: "{{ tools_c_tools | subelements('bins') }}"
  when: platform_system in item.0.platforms
  tags:
    - repo-tools
    - verify

- name: Verify Homebrew-managed command binaries
  ansible.builtin.command:
    argv:
      - "{{ platform_homebrew_prefix }}/bin/{{ item }}"
      - "--version"
  changed_when: false
  loop: "{{ tools_homebrew_commands }}"
  when: platform_is_macos
  tags:
    - repo-tools
    - verify

- name: Verify uv-installed Python command binaries
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_bin_dir }}/{{ item }}"
      - "--version"
  changed_when: false
  loop: "{{ tools_python_tools | default([]) }}"
  tags:
    - repo-tools
    - verify
