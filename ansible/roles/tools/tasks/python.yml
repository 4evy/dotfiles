---
- name: Link conventional Python command names to the project runtime
  ansible.builtin.file:
    # The versioned launcher executes the uv tool environment's interpreter,
    # so standalone scripts see the same dependencies as package entry points.
    src: "{{ dotfiles_bin_dir }}/python3.14"
    dest: "{{ dotfiles_bin_dir }}/{{ item }}"
    state: link
    force: true
    # Operate on the link itself. Following it makes Ansible try to apply file
    # attributes to the target and emits a warning while replacing a stale link.
    follow: false
  loop:
    - python
    - python3
  tags:
    - python
