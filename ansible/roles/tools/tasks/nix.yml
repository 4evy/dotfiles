---
- name: Detect Nix
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - command -v "$1"
      - dotfiles-nix-command
      - nix
  changed_when: false
  failed_when: false
  check_mode: false
  environment:
    PATH: "{{ tools_nix_path }}"
  register: tools_nix_command

- name: Install Nix when unavailable
  ansible.builtin.import_tasks: nix-install.yml
  when: tools_nix_command.rc != 0

- name: Check default Nix binary
  ansible.builtin.stat:
    path: "{{ tools_nix_bin }}"
  register: tools_nix_default_bin

- name: Select Nix binary
  ansible.builtin.set_fact:
    tools_nix_command_bin: >-
      {{
        tools_nix_bin
        if tools_nix_default_bin.stat.executable | default(false)
        else 'nix'
      }}

- name: Detect Nix distribution
  ansible.builtin.command:
    argv:
      - "{{ tools_nix_command_bin }}"
      - --version
  changed_when: false
  check_mode: false
  register: tools_nix_version

- name: Configure Determinate Nix overrides
  ansible.builtin.copy:
    src: nix.custom.conf
    dest: /etc/nix/nix.custom.conf
    owner: root
    group: "{{ 'wheel' if platform_is_macos else 'root' }}"
    mode: "0644"
  become: true
  notify: Restart Determinate Nix daemon
  when:
    - not platform_is_nixos
    - "'Determinate Nix' in tools_nix_version.stdout"

- name: Ensure Determinate Nixd configuration directory exists
  ansible.builtin.file:
    path: /etc/determinate
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: true
  when:
    - platform_is_macos
    - "'Determinate Nix' in tools_nix_version.stdout"

- name: Disable account-gated native Linux builder on macOS
  ansible.builtin.copy:
    src: determinate.config.json
    dest: /etc/determinate/config.json
    owner: root
    group: wheel
    mode: "0644"
  become: true
  notify: Restart Determinate Nix daemon
  when:
    - platform_is_macos
    - "'Determinate Nix' in tools_nix_version.stdout"

- name: Apply Determinate Nix configuration changes
  ansible.builtin.meta: flush_handlers

- name: Reconcile the repository-owned Nix tool profile
  environment:
    PATH: "{{ tools_nix_path }}"
  block:
    - name: Read Nix profile before reconciliation
      ansible.builtin.command:
        argv:
          - "{{ tools_nix_command_bin }}"
          - profile
          - list
          - --json
      check_mode: false
      register: tools_nix_profile_before_reconciliation
      changed_when: false

    - name: Select existing Nix profile elements
      ansible.builtin.set_fact:
        tools_nix_profile_elements: >-
          {{
            (
              tools_nix_profile_before_reconciliation.stdout
              | from_json
            ).elements
          }}

    - name: Install the repository-owned Nix tool bundle
      ansible.builtin.command:
        argv:
          - "{{ tools_nix_command_bin }}"
          - profile
          - add
          - --priority
          - "3"
          - "path:{{ dotfiles_repo_root }}#dotfiles-nix-tools"
      changed_when: true
      when:
        - not ansible_check_mode
        - "'dotfiles-nix-tools' not in tools_nix_profile_elements"

    - name: Upgrade the repository-owned Nix tool bundle
      ansible.builtin.command:
        argv:
          - "{{ tools_nix_command_bin }}"
          - profile
          - upgrade
          - dotfiles-nix-tools
      changed_when: false
      when: not ansible_check_mode

    - name: Detect Nix profile reconciliation changes
      ansible.builtin.command:
        argv:
          - "{{ tools_nix_command_bin }}"
          - profile
          - list
          - --json
      check_mode: false
      register: tools_nix_profile_after_reconciliation
      changed_when: >-
        (
          ansible_check_mode
          and 'dotfiles-nix-tools' not in tools_nix_profile_elements
        )
        or (
            tools_nix_profile_before_reconciliation.stdout
            | from_json
          ).elements != (
            tools_nix_profile_after_reconciliation.stdout
            | from_json
          ).elements
