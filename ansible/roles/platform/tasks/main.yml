---
- name: Ensure local bin and cache directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dotfiles_bin_dir }}"
    - "{{ dotfiles_cache_dir }}"
    - "{{ dotfiles_data_dir }}"
  tags:
    - platform

- name: Set operating system facts
  ansible.builtin.set_fact:
    platform_system: "{{ ansible_facts.system }}"
    platform_architecture: "{{ ansible_facts.architecture }}"
    platform_is_macos: "{{ ansible_facts.system == 'Darwin' }}"
    platform_is_linux: "{{ ansible_facts.system == 'Linux' }}"
    platform_is_nixos: >-
      {{
        ansible_facts.system == 'Linux'
        and ansible_facts.distribution == 'NixOS'
      }}
  tags:
    - platform

- name: Set Homebrew platform paths
  ansible.builtin.set_fact:
    platform_homebrew_prefix: "{{ platform_homebrew_prefix_value }}"
    platform_homebrew_path: "{{ platform_homebrew_path_entries | join(':') }}"
  vars:
    platform_homebrew_prefix_value: >-
      {{
        (
          '/opt/homebrew'
          if platform_architecture == 'arm64'
          else '/usr/local'
        )
        if platform_is_macos
        else '/home/linuxbrew/.linuxbrew'
      }}
    platform_homebrew_path_entries: >-
      {{
        (
          [
            platform_homebrew_prefix_value ~ '/opt/coreutils/libexec/gnubin',
            platform_homebrew_prefix_value ~ '/opt/findutils/libexec/gnubin',
            platform_homebrew_prefix_value ~ '/opt/gnu-sed/libexec/gnubin',
            platform_homebrew_prefix_value ~ '/opt/grep/libexec/gnubin',
            platform_homebrew_prefix_value ~ '/opt/gawk/libexec/gnubin',
            platform_homebrew_prefix_value ~ '/opt/gnu-tar/libexec/gnubin',
            platform_homebrew_prefix_value ~ '/opt/gnu-which/libexec/gnubin',
            platform_homebrew_prefix_value ~ '/opt/diffutils/libexec/gnubin',
            platform_homebrew_prefix_value ~ '/opt/make/libexec/gnubin',
            platform_homebrew_prefix_value ~ '/opt/gnu-getopt/bin',
          ]
          if platform_is_macos
          else []
        )
        + [
          platform_homebrew_prefix_value ~ '/bin',
          platform_homebrew_prefix_value ~ '/sbin',
          dotfiles_path,
        ]
      }}
  tags:
    - platform

- name: Detect rpm-ostree
  ansible.builtin.stat:
    path: /usr/bin/rpm-ostree
  register: platform_rpm_ostree_binary
  when: platform_is_linux
  tags:
    - platform

- name: Detect package managers
  ansible.builtin.set_fact:
    platform_has_rpm_ostree: >-
      {{
        platform_is_linux
        and platform_rpm_ostree_binary.stat.executable | default(false)
      }}
  tags:
    - platform
