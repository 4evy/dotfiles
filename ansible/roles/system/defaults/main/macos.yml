system_macos_karabiner:
  version: 8.2.0
  package_url: >-
    https://github.com/pqrs-org/Karabiner-DriverKit-VirtualHIDDevice/releases/download/v8.2.0/Karabiner-DriverKit-VirtualHIDDevice-8.2.0.pkg
  package_checksum: >-
    sha256:7faf4c33046c2274726da9e29da795fb2d2ad81796557db0fcc1686c611eeafc
  package_path: >-
    {{ dotfiles_cache_dir }}/Karabiner-DriverKit-VirtualHIDDevice-8.2.0.pkg
  label: org.pqrs.service.daemon.Karabiner-VirtualHIDDevice-Daemon
  manager: >-
    /Applications/.Karabiner-VirtualHIDDevice-Manager.app/Contents/MacOS/Karabiner-VirtualHIDDevice-Manager
  install_root: >-
    /Library/Application Support/org.pqrs/Karabiner-DriverKit-VirtualHIDDevice
  executable: Karabiner-VirtualHIDDevice-Daemon
  log_dir: /var/log/karabiner

system_macos_kanata:
  label: dev.4evy.kanata
  app_bin: /Applications/Kanata.app/Contents/MacOS/kanata
  config: "{{ dotfiles_repo_root }}/dotfiles/dot_config/kanata/kanata-macos.kbd"
  log_path: /var/log/kanata.log

system_macos_logitech_keyboard:
  product_id: "0xB377"
  product_name: Pebble K380s
  platform: "0"
