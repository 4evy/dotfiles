---
- name: Detect host tools used by the RustDesk integration
  check_mode: false
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - "command -v {{ item }}"
  changed_when: false
  failed_when: false
  loop:
    - apparmor_parser
    - gdbus
    - gst-inspect-1.0
  register: system_rustdesk_tools

- name: Detect the active local desktop session
  check_mode: false
  ansible.builtin.command:
    argv:
      - loginctl
      - show-user
      - "{{ ansible_facts.user_uid }}"
      - --property=Display
      - --value
  register: system_rustdesk_display_session
  changed_when: false
  failed_when: false

- name: Detect the active local desktop protocol
  check_mode: false
  ansible.builtin.command:
    argv:
      - loginctl
      - show-session
      - "{{ system_rustdesk_display_session.stdout }}"
      - --property=Type
      - --value
  register: system_rustdesk_display_protocol
  changed_when: false
  failed_when: false
  when:
    - system_rustdesk_display_session.stdout | default('') | length > 0

- name: Resolve the RustDesk Wayland session state
  ansible.builtin.set_fact:
    system_rustdesk_wayland_session: >-
      {{
        system_rustdesk_wayland_environment
        or system_rustdesk_display_protocol.stdout | default('') == 'wayland'
      }}

- name: Inspect the AppArmor host state
  ansible.builtin.slurp:
    src: /sys/module/apparmor/parameters/enabled
  failed_when: false
  register: system_rustdesk_apparmor

- name: Install the RustDesk AppArmor profile
  ansible.builtin.copy:
    src: dotfiles-rustdesk.apparmor
    dest: /etc/apparmor.d/dotfiles-rustdesk
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload RustDesk AppArmor profile
  when:
    - system_rustdesk_apparmor_enabled
    - system_rustdesk_apparmor.content | default('') | b64decode | upper is match('^Y')
    - system_rustdesk_tools.results[0].rc == 0

- name: Apply pending host handlers before RustDesk service reconciliation
  ansible.builtin.meta: flush_handlers

- name: Ensure RustDesk configuration directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "0755"
  become: "{{ item.become }}"
  loop:
    - path: "{{ dotfiles_config_home }}/rustdesk"
      become: false
    - path: /root/.config/rustdesk
      owner: root
      group: root
      become: true
  loop_control:
    label: "{{ item.path }}"

- name: Configure RustDesk direct Tailscale access
  community.general.ini_file:
    path: "{{ item.0.path }}"
    section: options
    option: "{{ item.1.option }}"
    value: "{{ item.1.value }}"
    state: present
    no_extra_spaces: false
    owner: "{{ item.0.owner | default(omit) }}"
    group: "{{ item.0.group | default(omit) }}"
    mode: "0644"
  become: "{{ item.0.become }}"
  loop: "{{ rustdesk_config_paths | product(rustdesk_options) | list }}"
  loop_control:
    label: "{{ item.0.path }}:{{ item.1.option }}"
  vars:
    rustdesk_config_paths:
      - path: "{{ dotfiles_config_home }}/rustdesk/RustDesk2.toml"
        become: false
      - path: /root/.config/rustdesk/RustDesk2.toml
        owner: root
        group: root
        become: true
    rustdesk_options:
      - option: direct-server
        value: '"Y"'
      - option: direct-access-port
        value: '"21118"'
      - option: stop-service
        value: '""'

- name: Resolve the native RustDesk executable
  ansible.builtin.set_fact:
    system_rustdesk_executable: >-
      {{
        system_rustdesk_command.stdout
        | trim
        | ansible.builtin.realpath
      }}

- name: Ensure the mutable RustDesk loader directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - /var/lib/rustdesk
    - /var/lib/rustdesk/dotfiles

- name: Install the mutable RustDesk service loader
  ansible.builtin.copy:
    src: "{{ system_rustdesk_executable }}"
    dest: /var/lib/rustdesk/dotfiles/rustdesk
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  become: true
  register: system_rustdesk_loader

- name: Link the native RustDesk libraries beside the mutable loader
  ansible.builtin.file:
    src: "{{ system_rustdesk_executable | dirname }}/lib"
    dest: /var/lib/rustdesk/dotfiles/lib
    state: link
    owner: root
    group: root
    force: true
  become: true

- name: Ensure the RustDesk systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/rustdesk.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Run the RustDesk service from the mutable loader
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=
      ExecStart=/var/lib/rustdesk/dotfiles/rustdesk --service
    dest: /etc/systemd/system/rustdesk.service.d/20-dotfiles-executable.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  register: system_rustdesk_service_dropin

- name: Inspect the existing RustDesk autostart entry
  ansible.builtin.stat:
    path: "{{ dotfiles_config_home }}/autostart/rustdesk.desktop"
  register: system_rustdesk_autostart

- name: Keep the existing RustDesk autostart entry enabled
  community.general.ini_file:
    path: "{{ dotfiles_config_home }}/autostart/rustdesk.desktop"
    section: Desktop Entry
    option: X-GNOME-Autostart-enabled
    value: "true"
    no_extra_spaces: true
    mode: "0644"
  when: system_rustdesk_autostart.stat.exists | default(false)

- name: Reconcile RustDesk host policy
  dotfiles_selinux_service:
    policy_module: rustdesk
    policy_directory: "{{ role_path }}/files/rustdesk-selinux"
    service: rustdesk
    domain: rustdesk_t
    restore_targets:
      - path: /var/lib/rustdesk
        recursive: true
  become: true
  when:
    - >-
      lookup('ansible.builtin.env', 'DOTFILES_RUSTDESK_SELINUX')
      | default('1', true) != '0'

- name: Restore RustDesk mutable loader labels
  ansible.builtin.command:
    argv:
      - restorecon
      - -R
      - -F
      - -v
      - /var/lib/rustdesk
  become: true
  register: system_rustdesk_restorecon
  changed_when: system_rustdesk_restorecon.stdout | length > 0
  when:
    - >-
      lookup('ansible.builtin.env', 'DOTFILES_RUSTDESK_SELINUX')
      | default('1', true) != '0'

- name: Start the image-enabled RustDesk service
  ansible.builtin.systemd_service:
    name: rustdesk.service
    state: >-
      {{
        'restarted'
        if system_rustdesk_loader is changed
        or system_rustdesk_service_dropin is changed
        else 'started'
      }}
    daemon_reload: true
  become: true
  when:
    - not ansible_check_mode

- name: Reconcile RustDesk Wayland dependencies
  ansible.builtin.import_tasks: rustdesk-wayland.yml
  when: system_rustdesk_wayland_session

- name: Inspect Tailscale authentication for RustDesk direct access
  ansible.builtin.command:
    argv:
      - tailscale
      - status
  register: system_rustdesk_tailscale_status
  changed_when: false
  failed_when: false
  when:
    - system_tailscale_command.rc | default(1) == 0
    - not ansible_check_mode

- name: Report unavailable RustDesk direct Tailscale access
  ansible.builtin.debug:
    msg: >-
      Tailscale is unavailable or unauthenticated; RustDesk direct IP access
      will not be available until `tailscale up` succeeds.
  when:
    - not ansible_check_mode
    - >-
      system_tailscale_command.rc | default(1) != 0
      or system_rustdesk_tailscale_status.rc | default(1) != 0
