---
- name: Detect the native RustDesk installation
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - command -v rustdesk
  changed_when: false
  failed_when: false
  register: system_rustdesk_command

- name: Detect host tools used by the RustDesk integration
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - "command -v {{ item }}"
  changed_when: false
  failed_when: false
  loop:
    - apparmor_parser
    - gdbus
    - gst-inspect-1.0
    - update-desktop-database
  register: system_rustdesk_tools
  when: system_rustdesk_command.rc == 0

- name: Detect the active local desktop session
  ansible.builtin.command:
    argv:
      - loginctl
      - show-user
      - "{{ ansible_user_uid }}"
      - --property=Display
      - --value
  register: system_rustdesk_display_session
  changed_when: false
  failed_when: false
  when: system_rustdesk_command.rc == 0

- name: Detect the active local desktop protocol
  ansible.builtin.command:
    argv:
      - loginctl
      - show-session
      - "{{ system_rustdesk_display_session.stdout }}"
      - --property=Type
      - --value
  register: system_rustdesk_display_protocol
  changed_when: false
  failed_when: false
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_display_session.stdout | default('') | length > 0

- name: Resolve the RustDesk Wayland session state
  ansible.builtin.set_fact:
    system_rustdesk_wayland_session: >-
      {{
        system_rustdesk_wayland_environment
        or system_rustdesk_display_protocol.stdout | default('') == 'wayland'
      }}
  when: system_rustdesk_command.rc == 0

- name: Inspect the AppArmor host state
  ansible.builtin.slurp:
    src: /sys/module/apparmor/parameters/enabled
  failed_when: false
  register: system_rustdesk_apparmor
  when: system_rustdesk_command.rc == 0

- name: Install the RustDesk AppArmor profile
  ansible.builtin.copy:
    src: dotfiles-rustdesk.apparmor
    dest: /etc/apparmor.d/dotfiles-rustdesk
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload RustDesk AppArmor profile
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_apparmor_enabled
    - system_rustdesk_apparmor.content | default('') | b64decode | upper
      is match('^Y')
    - system_rustdesk_tools.results[0].rc == 0

- name: Apply pending host handlers before RustDesk service reconciliation
  ansible.builtin.meta: flush_handlers

- name: Ensure RustDesk configuration directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "0755"
  become: "{{ item.become }}"
  loop:
    - path: "{{ dotfiles_config_home }}/rustdesk"
      become: false
    - path: /root/.config/rustdesk
      owner: root
      group: root
      become: true
  loop_control:
    label: "{{ item.path }}"
  when: system_rustdesk_command.rc == 0

- name: Configure RustDesk direct Tailscale access
  community.general.ini_file:
    path: "{{ item.0.path }}"
    section: options
    option: "{{ item.1.option }}"
    value: "{{ item.1.value }}"
    state: present
    no_extra_spaces: false
    owner: "{{ item.0.owner | default(omit) }}"
    group: "{{ item.0.group | default(omit) }}"
    mode: "0644"
  become: "{{ item.0.become }}"
  loop: "{{ rustdesk_config_paths | product(rustdesk_options) | list }}"
  loop_control:
    label: "{{ item.0.path }}:{{ item.1.option }}"
  when: system_rustdesk_command.rc == 0
  vars:
    rustdesk_config_paths:
      - path: "{{ dotfiles_config_home }}/rustdesk/RustDesk2.toml"
        become: false
      - path: /root/.config/rustdesk/RustDesk2.toml
        owner: root
        group: root
        become: true
    rustdesk_options:
      - option: direct-server
        value: '"Y"'
      - option: direct-access-port
        value: '"21118"'

- name: Ensure the user application directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_data_home }}/applications"
    state: directory
    mode: "0755"
  when: system_rustdesk_command.rc == 0

- name: Install the RustDesk desktop entry
  ansible.builtin.copy:
    src: rustdesk.desktop
    dest: "{{ dotfiles_data_home }}/applications/rustdesk.desktop"
    mode: "0644"
  register: system_rustdesk_desktop
  when: system_rustdesk_command.rc == 0

- name: Inspect the existing RustDesk autostart entry
  ansible.builtin.stat:
    path: "{{ dotfiles_config_home }}/autostart/rustdesk.desktop"
  register: system_rustdesk_autostart
  when: system_rustdesk_command.rc == 0

- name: Keep the existing RustDesk autostart entry enabled
  ansible.builtin.copy:
    content: >-
      {{
        (
          lookup(
            'ansible.builtin.file',
            role_path ~ '/files/rustdesk.desktop'
          ) | trim
        )
        ~ '\nX-GNOME-Autostart-enabled=true\n'
      }}
    dest: "{{ dotfiles_config_home }}/autostart/rustdesk.desktop"
    mode: "0644"
  when: system_rustdesk_autostart.stat.exists | default(false)

- name: Refresh the user desktop database
  ansible.builtin.command:
    argv:
      - update-desktop-database
      - "{{ dotfiles_data_home }}/applications"
  changed_when: true
  when:
    - system_rustdesk_desktop is changed
    - system_rustdesk_tools.results[3].rc == 0

- name: Reconcile RustDesk host policy
  dotfiles_selinux_service:
    policy_module: rustdesk
    policy_directory: "{{ role_path }}/files/rustdesk-selinux"
    hash_file: /var/lib/rustdesk/dotfiles-selinux-policy.sha256
    service: rustdesk
    domain: rustdesk_t
    restore_targets:
      - path: /usr/bin/rustdesk
        recursive: true
      - path: /usr/lib/rustdesk/rustdesk
        recursive: true
      - path: /usr/share/rustdesk/rustdesk
        recursive: true
  become: true
  when:
    - system_rustdesk_command.rc == 0
    - lookup('env', 'DOTFILES_RUSTDESK_SELINUX') | default('1', true) != '0'

- name: Enable and start the native RustDesk service
  ansible.builtin.systemd_service:
    name: rustdesk.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when:
    - system_rustdesk_command.rc == 0
    - not ansible_check_mode

- name: Reset failed RustDesk Wayland dependencies
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - reset-failed
      - xdg-desktop-portal.service
      - xdg-desktop-portal-gnome.service
      - xdg-desktop-portal-gtk.service
      - pipewire.service
      - wireplumber.service
  changed_when: false
  failed_when: false
  environment:
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ system_rustdesk_runtime_dir }}/bus
    XDG_RUNTIME_DIR: "{{ system_rustdesk_runtime_dir }}"
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_wayland_session
    - not ansible_check_mode

- name: Start RustDesk Wayland dependencies
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - start
      - xdg-desktop-portal.service
      - pipewire.service
      - wireplumber.service
  changed_when: false
  failed_when: false
  environment:
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ system_rustdesk_runtime_dir }}/bus
    XDG_RUNTIME_DIR: "{{ system_rustdesk_runtime_dir }}"
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_wayland_session
    - not ansible_check_mode

- name: Inspect RustDesk portal interfaces
  ansible.builtin.command:
    argv:
      - gdbus
      - introspect
      - --session
      - --dest
      - org.freedesktop.portal.Desktop
      - --object-path
      - /org/freedesktop/portal/desktop
  register: system_rustdesk_portal
  changed_when: false
  failed_when: false
  environment:
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ system_rustdesk_runtime_dir }}/bus
    XDG_RUNTIME_DIR: "{{ system_rustdesk_runtime_dir }}"
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_wayland_session
    - system_rustdesk_tools.results[1].rc == 0
    - not ansible_check_mode

- name: Report unavailable RustDesk portal interfaces
  ansible.builtin.debug:
    msg: >-
      The desktop portal does not expose both ScreenCast and RemoteDesktop;
      RustDesk Wayland capture or input will fail. Check
      xdg-desktop-portal and the desktop-specific portal backend.
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_wayland_session
    - not ansible_check_mode
    - >-
      system_rustdesk_portal.rc | default(1) != 0
      or 'org.freedesktop.portal.ScreenCast'
      not in system_rustdesk_portal.stdout | default('')
      or 'org.freedesktop.portal.RemoteDesktop'
      not in system_rustdesk_portal.stdout | default('')

- name: Inspect the RustDesk PipeWire GStreamer source
  ansible.builtin.command:
    argv:
      - gst-inspect-1.0
      - pipewiresrc
  register: system_rustdesk_pipewire_plugin
  changed_when: false
  failed_when: false
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_wayland_session
    - system_rustdesk_tools.results[2].rc == 0
    - not ansible_check_mode

- name: Report an unavailable RustDesk PipeWire source
  ansible.builtin.debug:
    msg: >-
      GStreamer's pipewiresrc plugin is unavailable; install pipewire-gstreamer
      before using RustDesk as a Wayland controlled side.
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_wayland_session
    - not ansible_check_mode
    - system_rustdesk_pipewire_plugin.rc | default(1) != 0

- name: Inspect RustDesk Wayland session interfaces
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - path: >-
        {{ system_rustdesk_runtime_dir }}/bus
      socket: true
      message: >-
        Wayland session bus is unavailable; RustDesk portal capture will fail
        until the user session is healthy.
    - path: >-
        {{ system_rustdesk_runtime_dir }}/pipewire-0
      socket: true
      message: >-
        PipeWire socket is unavailable; RustDesk Wayland capture will fail.
    - path: /dev/uinput
      socket: false
      message: >-
        /dev/uinput is unavailable; RustDesk's Wayland input fallback will fail.
  register: system_rustdesk_wayland_interfaces
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_wayland_session

- name: Report unavailable RustDesk Wayland interfaces
  ansible.builtin.debug:
    msg: "{{ item.item.message }}"
  loop: "{{ system_rustdesk_wayland_interfaces.results | default([]) }}"
  when:
    - system_rustdesk_wayland_session
    - >-
      not item.stat.exists | default(false)
      or item.item.socket and not item.stat.issock | default(false)

- name: Inspect the active Wayland compositor socket
  ansible.builtin.command:
    argv:
      - find
      - "{{ system_rustdesk_runtime_dir }}"
      - -maxdepth
      - "1"
      - -type
      - s
      - -name
      - wayland-*
      - -print
      - -quit
  register: system_rustdesk_wayland_socket
  changed_when: false
  failed_when: false
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_wayland_session

- name: Report an unavailable Wayland compositor socket
  ansible.builtin.debug:
    msg: >-
      No Wayland compositor socket is available; RustDesk cannot inspect the
      active display layout.
  when:
    - system_rustdesk_command.rc == 0
    - system_rustdesk_wayland_session
    - system_rustdesk_wayland_socket.stdout | default('') | length == 0

- name: Inspect Tailscale authentication for RustDesk direct access
  ansible.builtin.command:
    argv:
      - tailscale
      - status
  register: system_rustdesk_tailscale_status
  changed_when: false
  failed_when: false
  when:
    - system_rustdesk_command.rc == 0
    - system_tailscale_command.rc | default(1) == 0
    - not ansible_check_mode

- name: Report unavailable RustDesk direct Tailscale access
  ansible.builtin.debug:
    msg: >-
      Tailscale is unavailable or unauthenticated; RustDesk direct IP access
      will not be available until `tailscale up` succeeds.
  when:
    - system_rustdesk_command.rc == 0
    - not ansible_check_mode
    - >-
      system_tailscale_command.rc | default(1) != 0
      or system_rustdesk_tailscale_status.rc | default(1) != 0
