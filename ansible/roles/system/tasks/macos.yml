---
- name: Configure macOS defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ system_macos_defaults }}"
  loop_control:
    label: "{{ item.domain }}:{{ item.key }}"
  notify: Restart applications affected by macOS defaults
  tags:
    - host
    - macos

- name: Register Homebrew shells as macOS login shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ platform_homebrew_prefix }}/bin/{{ item }}"
    state: present
  loop:
    - bash
    - zsh
  become: true
  tags:
    - host
    - macos

- name: Configure the macOS account login shell
  ansible.builtin.user:
    name: >-
      {{ ansible_facts.get('user_id',
         ansible_facts.get('ansible_user_id', lookup('env', 'USER'))) }}
    shell: "{{ platform_homebrew_prefix }}/bin/zsh"
  become: true
  tags:
    - host
    - macos

- name: Ensure macOS dotfiles application support directory exists
  ansible.builtin.file:
    path: /Library/Application Support/dotfiles
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: true
  tags:
    - host
    - macos
    - tailscale

- name: Detect system Tailscale service definition
  ansible.builtin.stat:
    path: /Library/LaunchDaemons/homebrew.mxcl.tailscale.plist
  register: system_tailscale_system_service
  tags:
    - host
    - macos
    - tailscale

- name: Install Tailscale as a system launch daemon
  ansible.builtin.command:
    argv:
      - "{{ platform_homebrew_prefix }}/bin/brew"
      - services
      - start
      - tailscale
  environment:
    PATH: "{{ platform_homebrew_path }}"
  become: true
  register: system_tailscale_system_service_install
  changed_when: >-
    'Successfully started' in system_tailscale_system_service_install.stdout
  when: not system_tailscale_system_service.stat.exists
  tags:
    - host
    - macos
    - tailscale

- name: Ensure the Tailscale system launch daemon is running
  community.general.launchd:
    name: homebrew.mxcl.tailscale
    enabled: true
    state: started
  become: true
  tags:
    - host
    - macos
    - tailscale

- name: Wait for the Tailscale daemon socket
  ansible.builtin.wait_for:
    path: /var/run/tailscaled.socket
    state: present
    timeout: 15
  tags:
    - host
    - macos
    - tailscale

- name: Install Tailscale SSH launch daemon helper
  ansible.builtin.template:
    src: macos/tailscale-ssh-helper.py.in
    dest: /Library/Application Support/dotfiles/tailscale-ssh.py
    owner: root
    group: wheel
    mode: "0755"
    variable_start_string: "@"
    variable_end_string: "@"
  vars:
    system_python_bin: "{{ dotfiles_bin_dir }}/python3.14"
    system_tailscale_bin: "{{ platform_homebrew_prefix }}/bin/tailscale"
  become: true
  register: system_tailscale_ssh_helper_result
  tags:
    - host
    - macos
    - tailscale

- name: Install Tailscale SSH launch daemon definition
  ansible.builtin.template:
    src: macos/tailscale-ssh.plist.in
    dest: /Library/LaunchDaemons/dev.4evy.tailscale-ssh.plist
    owner: root
    group: wheel
    mode: "0644"
    variable_start_string: "@"
    variable_end_string: "@"
  vars:
    system_tailscale_ssh_label: dev.4evy.tailscale-ssh
    system_tailscale_ssh_helper: /Library/Application Support/dotfiles/tailscale-ssh.py
    system_python_bin: "{{ dotfiles_bin_dir }}/python3.14"
  register: system_tailscale_ssh_plist
  become: true
  tags:
    - host
    - macos
    - tailscale

- name: Configure Tailscale SSH launch daemon on macOS
  community.general.launchd:
    name: dev.4evy.tailscale-ssh
    enabled: true
    state: >-
      {{
        'restarted'
        if system_tailscale_ssh_helper_result is changed
        or system_tailscale_ssh_plist is changed
        else 'started'
      }}
  become: true
  tags:
    - host
    - macos
    - tailscale

- name: Inspect Karabiner VirtualHID
  ansible.builtin.stat:
    path: "{{ system_macos_karabiner.manager }}"
  register: system_karabiner_manager
  tags:
    - host
    - kanata
    - macos

- name: Download Karabiner VirtualHID
  ansible.builtin.get_url:
    # renovate: datasource=github-releases depName=pqrs-org/Karabiner-DriverKit-VirtualHIDDevice
    url: "{{ system_macos_karabiner.package_url }}"
    dest: "{{ system_macos_karabiner.package_path }}"
    checksum: "{{ system_macos_karabiner.package_checksum }}"
    mode: "0644"
  when: not system_karabiner_manager.stat.exists
  tags:
    - host
    - kanata
    - macos

- name: Install Karabiner VirtualHID
  ansible.builtin.command:
    argv:
      - /usr/sbin/installer
      - -pkg
      - "{{ system_macos_karabiner.package_path }}"
      - -target
      - /
    creates: "{{ system_macos_karabiner.manager }}"
  become: true
  register: system_karabiner_package
  tags:
    - host
    - kanata
    - macos

- name: Activate Karabiner VirtualHID
  ansible.builtin.command:
    argv:
      - "{{ system_macos_karabiner.manager }}"
      - forceActivate
  become: true
  changed_when: system_karabiner_package is changed
  when: not ansible_check_mode
  tags:
    - host
    - kanata
    - macos

- name: Ensure Karabiner VirtualHID log directory exists
  ansible.builtin.file:
    path: "{{ system_macos_karabiner.log_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: true
  tags:
    - host
    - kanata
    - macos

- name: Install Karabiner VirtualHID launch daemon definition
  ansible.builtin.template:
    src: macos/karabiner-vhid.plist.j2
    dest: "/Library/LaunchDaemons/{{ system_macos_karabiner.label }}.plist"
    owner: root
    group: wheel
    mode: "0644"
  become: true
  register: system_karabiner_plist
  tags:
    - host
    - kanata
    - macos

- name: Ensure Karabiner VirtualHID launch daemon is running
  community.general.launchd:
    name: "{{ system_macos_karabiner.label }}"
    enabled: true
    state: >-
      {{
        'restarted'
        if system_karabiner_package is changed
        or system_karabiner_plist is changed
        else 'started'
      }}
  become: true
  tags:
    - host
    - kanata
    - macos

- name: Install and sign Kanata on macOS
  ansible.builtin.file:
    path: "{{ system_macos_kanata.app_bin | dirname }}"
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: true
  tags:
    - host
    - kanata
    - macos

- name: Install the Kanata application executable
  ansible.builtin.copy:
    src: "{{ platform_homebrew_prefix }}/bin/kanata"
    dest: "{{ system_macos_kanata.app_bin }}"
    remote_src: true
    owner: root
    group: wheel
    mode: "0755"
  become: true
  register: system_kanata_executable
  tags:
    - host
    - kanata
    - macos

- name: Install the Kanata application metadata
  ansible.builtin.template:
    src: macos/kanata-app-info.plist.j2
    dest: /Applications/Kanata.app/Contents/Info.plist
    owner: root
    group: wheel
    mode: "0644"
  become: true
  register: system_kanata_metadata
  tags:
    - host
    - kanata
    - macos

- name: Keep Kanata's macOS signing identity stable
  dotfiles_codesign:
    bundle: /Applications/Kanata.app
    identity: Kanata Local Code Signing
    keychain: /Library/Keychains/System.keychain
    administrator_trust: true
  become: true
  environment:
    PATH: "{{ platform_homebrew_path }}"
  register: system_kanata_application
  tags:
    - host
    - kanata
    - macos

- name: Register the Kanata application with Launch Services
  ansible.builtin.command:
    argv:
      - >-
        /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
      - -f
      - /Applications/Kanata.app
  become: true
  changed_when: true
  when: >-
    system_kanata_executable is changed
    or system_kanata_metadata is changed
    or system_kanata_application is changed
  tags:
    - host
    - kanata
    - macos

- name: Configure Logitech keyboard for Kanata
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_bin_dir }}/python3.14"
      - "{{ role_path }}/files/macos/logitech-platform.py"
      - --product-id
      - "{{ system_macos_logitech_keyboard.product_id }}"
      - --product-name
      - "{{ system_macos_logitech_keyboard.product_name }}"
      - --platform
      - "{{ system_macos_logitech_keyboard.platform }}"
  become: true
  register: system_logitech_platform
  changed_when: >-
    'updated current host platform' in system_logitech_platform.stdout
  failed_when: false
  tags:
    - host
    - kanata
    - macos

- name: Install Kanata launch daemon definition
  ansible.builtin.template:
    src: macos/kanata.plist.j2
    dest: "/Library/LaunchDaemons/{{ system_macos_kanata.label }}.plist"
    owner: root
    group: wheel
    mode: "0644"
  become: true
  register: system_kanata_plist
  tags:
    - host
    - kanata
    - macos

- name: Ensure Kanata launch daemon is running
  community.general.launchd:
    name: "{{ system_macos_kanata.label }}"
    enabled: true
    state: >-
      {{
        'restarted'
        if system_kanata_application is changed
        or system_kanata_plist is changed
        else 'started'
      }}
  become: true
  tags:
    - host
    - kanata
    - macos
