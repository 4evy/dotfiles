---
- name: Detect the native Tailscale installation
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - command -v tailscale && command -v tailscaled
  changed_when: false
  failed_when: false
  register: system_tailscale_command

- name: Enable and start the native Tailscale service
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  become: true
  when: system_tailscale_command.rc == 0

- name: Reconcile Tailscale host policy
  ansible.builtin.command:
    argv: >-
      {{
        [
          dotfiles_bin_dir ~ '/dotfiles-scripts',
          'host',
          'apps',
          'tailscale-bluefin'
        ]
        + (['--check'] if ansible_check_mode else [])
      }}
  environment:
    PATH: "{{ dotfiles_bin_dir }}:{{ dotfiles_path }}"
  changed_when: false
  check_mode: false
  when: system_tailscale_command.rc == 0
