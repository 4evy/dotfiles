---
dotfiles_repo_root: "{{ inventory_dir | dirname | dirname }}"
dotfiles_lock: >-
  {{ lookup('ansible.builtin.file', dotfiles_repo_root ~ '/flake.lock') | from_json }}
dotfiles_lock_inputs: "{{ dotfiles_lock.nodes[dotfiles_lock.root].inputs }}"
dotfiles_toshy_pin: "{{ dotfiles_lock.nodes[dotfiles_lock_inputs['source-toshy']] }}"
dotfiles_karabiner_pin: >-
  {{ dotfiles_lock.nodes[dotfiles_lock_inputs['source-karabiner-vhid-package']].locked }}
dotfiles_home_dir: >-
  {{
    ansible_facts.get('env', {}).get(
      'HOME',
      lookup('ansible.builtin.env', 'HOME')
    )
  }}
dotfiles_path: >-
  {{
    ansible_facts.get('env', {}).get(
      'PATH',
      lookup('ansible.builtin.env', 'PATH')
    )
  }}
dotfiles_cache_home: "{{ ansible_facts.get('env', {}).get('XDG_CACHE_HOME', dotfiles_home_dir + '/.cache') }}"
dotfiles_config_home: "{{ ansible_facts.get('env', {}).get('XDG_CONFIG_HOME', dotfiles_home_dir + '/.config') }}"
dotfiles_data_home: "{{ ansible_facts.get('env', {}).get('XDG_DATA_HOME', dotfiles_home_dir + '/.local/share') }}"
dotfiles_state_home: "{{ ansible_facts.get('env', {}).get('XDG_STATE_HOME', dotfiles_home_dir + '/.local/state') }}"
dotfiles_cache_dir: "{{ dotfiles_cache_home }}/dotfiles/ansible"
dotfiles_bin_dir: "{{ dotfiles_home_dir }}/.local/bin"
dotfiles_data_dir: "{{ dotfiles_data_home }}/dotfiles"
