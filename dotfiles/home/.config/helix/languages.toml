[[language]]
name = "python"
auto-format = true
language-servers = ["ruff"]
code-actions-on-save = ["source.organizeImports", "source.fixAll"]

[[language]]
name = "go"
language-servers = ["gopls"]

[[language]]
name = "bash"
file-types = [
  "sh",
  "bash",
  "zsh",
  { glob = "*.sh.tmpl" },
  { glob = "*.bash.tmpl" },
  { glob = "*.zsh.tmpl" },
  { glob = ".bash_profile.tmpl" },
  { glob = ".bashenv.tmpl" },
  { glob = ".bashrc.tmpl" },
  { glob = ".zshenv.tmpl" },
  { glob = ".zshrc.tmpl" },
]
auto-format = true
diagnostic-severity = "warning"
formatter = { command = "shfmt", args = ["--filename", "%{buffer_name}"] }
language-servers = ["bash-language-server"]

[[language]]
name = "javascript"
auto-format = true
indent = { tab-width = 4, unit = "    " }
language-servers = ["tsrs"]

[[language]]
name = "jsx"
language-servers = ["tsrs"]

[[language]]
name = "typescript"
language-servers = ["tsrs"]

[[language]]
name = "tsx"
language-servers = ["tsrs"]

[[language]]
name = "css"
auto-format = true
language-servers = ["vscode-css-language-server"]

[[language]]
name = "html"
language-servers = ["vscode-html-language-server"]

[[language]]
name = "markdown"
auto-format = true
formatter = { command = "rumdl", args = [
  "fmt",
  "--stdin",
  "--stdin-filename",
  "%{buffer_name}",
] }
language-servers = ["rumdl"]

[[language]]
name = "dockerfile"
language-servers = ["docker-langserver"]

[[language]]
name = "json"
file-types = ["json", "jsonc", { glob = "*.json.tmpl" }]
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = ["vscode-json-language-server"]

[[language]]
name = "yaml"
file-types = ["yaml", "yml", { glob = "*.yaml.tmpl" }, { glob = "*.yml.tmpl" }]
language-servers = ["yaml-language-server"]

[[language]]
name = "toml"
file-types = ["toml", { glob = "*.toml.tmpl" }]
auto-format = true
language-servers = ["taplo"]

[[language]]
name = "nix"
auto-format = true
formatter = { command = "nixfmt" }
language-servers = ["nil"]

[language-server.rumdl]
command = "bun"
args = ["@HOME@/.local/lib/helix/helix.ts"]

[language-server.ruff]
command = "ruff"
args = ["server", "--preview"]
[language-server.ruff.config.settings.lint]
extendSelect = ["I"]

[language-server.tsrs]
command = "tsrs"
args = ["--lsp", "--stdio"]

[language-server.vscode-css-language-server]
command = "bunx"
args = [
  "--bun",
  "-p",
  "vscode-langservers-extracted",
  "vscode-css-language-server",
  "--stdio",
]

[language-server.vscode-html-language-server]
command = "bunx"
args = [
  "--bun",
  "-p",
  "vscode-langservers-extracted",
  "vscode-html-language-server",
  "--stdio",
]

[language-server.vscode-json-language-server]
command = "bunx"
args = [
  "--bun",
  "-p",
  "vscode-langservers-extracted",
  "vscode-json-language-server",
  "--stdio",
]

[language-server.yaml-language-server.config.yaml]
format = { enable = true }

[language-server.docker-langserver]
command = "bunx"
args = [
  "--bun",
  "-p",
  "dockerfile-language-server-nodejs",
  "docker-langserver",
  "--stdio",
]

[language-server.taplo.config.evenBetterToml.formatter]
alignEntries = true
columnWidth = 100
