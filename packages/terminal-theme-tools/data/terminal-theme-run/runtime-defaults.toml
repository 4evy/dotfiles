javascript_runtimes = ["node", "bun"]

javascript_runtime_paths = [
  "/usr/bin/node",
  "/bin/node",
  "/run/current-system/sw/bin/node",
]

javascript_runtime_home_paths = [".cache/.bun/bin/bun", ".bun/bin/bun"]
javascript_shebang_interpreters = ["node"]

# Theme detection policy is data; terminal.c only implements the probes and parsers.
theme_environment = ["COLOR_SCHEME", "TERMINAL_THEME", "THEME"]
theme_dark_aliases = ["frappe", "macchiato", "mocha", "catppuccin-frappe-pink"]
theme_light_aliases = ["latte", "catppuccin-latte-pink"]
theme_terminal_program_environment = "TERM_PROGRAM"
# Ghostty sets TERM_PROGRAM=ghostty and both terminals advertise their default
# terminfo names through TERM. Keeping both forms also covers ordinary SSH,
# where TERM is forwarded even when terminal-specific variables are not.
theme_terminal_queries = { ghostty = "color-scheme", xterm-ghostty = "color-scheme", kitty = "color-scheme", xterm-kitty = "color-scheme", "*" = "background" }
theme_macos_commands = ["defaults read -g AppleInterfaceStyle"]
theme_unix_commands = [
  "gsettings get org.gnome.desktop.interface color-scheme",
  "gsettings get org.gnome.desktop.interface gtk-theme",
]
theme_macos_fallback = "dark"
theme_unix_fallback = "dark"
theme_probe_timeout_ms = 100
helper_timeout_ms = 4000
helper_output_limit_bytes = 65536
