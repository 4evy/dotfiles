[[integration]]
name = "argument-theme"
strategy = "arguments"
dark_theme = "night"
light_theme = "day"
arguments = ["--appearance", "{theme}", "--access", "{context}"]
context_table = "workspaces"
context_field = "access"
context_value = "allowed"
context_path_flags = ["-C", "--cd"]
context_path_prefixes = ["-C", "--cd="]
context_argument_separator = "--"
context_directory_commands = []

[[integration]]
name = "cached-config"
strategy = "config"
dark_theme = "night"
light_theme = "day"
default_config = ".config/monitor/config"
assignment = "palette"
config_flags = ["--settings", "-s"]
config_output_flag = "--settings"
temporary_prefix = "terminal-theme-run-cache-test-XXXXXX"
temporary_location = "cache"
cache_subdirectory = "terminal-theme-run/cache-test"
quote = '"'

[[integration]]
name = "validated-config"
strategy = "config"
display_name = "Editor"
dark_theme = "night"
light_theme = "day"
default_config = ".config/editor/config.toml"
assignment = "appearance"
config_flags = ["--settings", "-s"]
config_output_flag = "--settings"
temporary_prefix = "terminal-theme-run-validated-test-XXXXXX"
temporary_location = "system"
quote = "'"
validation = "toml"
