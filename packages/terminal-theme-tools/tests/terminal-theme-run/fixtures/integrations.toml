[[integration]]
name = "argument-theme"
strategy = "arguments"
dark_theme = "night"
light_theme = "day"
arguments = ["--appearance", "{theme}", "--access", "{trust}"]
trust_table = "workspaces"
trust_field = "access"
trust_value = "allowed"
trust_cwd_flags = ["-C", "--cd"]
trust_cwd_prefixes = ["-C", "--cd="]

[[integration]]
name = "cached-config"
strategy = "config"
dark_theme = "night"
light_theme = "day"
default_config = ".config/monitor/config"
assignment = "palette"
config_flags = ["--settings", "-s"]
config_output_flag = "--settings"
temporary_prefix = "terminal-theme-run-cache-test-XXXXXX"
temporary_location = "cache"
cache_subdirectory = "terminal-theme-run/cache-test"
quote = '"'

[[integration]]
name = "validated-config"
strategy = "config"
display_name = "Editor"
dark_theme = "night"
light_theme = "day"
default_config = ".config/editor/config.toml"
assignment = "appearance"
config_flags = ["--settings", "-s"]
config_output_flag = "--settings"
temporary_prefix = "terminal-theme-run-validated-test-XXXXXX"
temporary_location = "system"
quote = "'"
validation = "toml"
