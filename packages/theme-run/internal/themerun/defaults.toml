[runtime]
theme_environment = [
  "COLOR_SCHEME",
  "LC_TERMINAL_THEME",
  "TERMINAL_THEME",
  "THEME",
]
theme_aliases = { dark = [
  "dark",
  "catppuccin-custom-dark",
], light = [
  "light",
  "catppuccin-custom-light",
  "default",
  "adwaita",
] }
theme_terminal_program_environment = "TERM_PROGRAM"
theme_terminal_queries = { ghostty = "color-scheme", xterm-ghostty = "color-scheme", kitty = "color-scheme", xterm-kitty = "color-scheme", "*" = "background" }
theme_probe_timeout_ms = 100
helper_timeout_ms = 4000
helper_output_limit_bytes = 65536

[runtime.theme_platforms.darwin]
commands = [["defaults", "read", "-g", "AppleInterfaceStyle"]]
fallback = "light"

[runtime.theme_platforms."*"]
commands = [
  [
    "gsettings",
    "get",
    "org.gnome.desktop.interface",
    "color-scheme",
  ],
  [
    "gsettings",
    "get",
    "org.gnome.desktop.interface",
    "gtk-theme",
  ],
]
fallback = "dark"
