[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "dotfiles-python"
version = "0.1.0"
description = "Personal workstation commands for Linux and macOS."
requires-python = ">=3.14,<3.15"
dependencies = [
  "cyclopts>=4.20,<5",
  "packaging>=24,<27",
  "platformdirs>=4.3,<5",
  "psutil>=7,<8",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "pyobjc-framework-Cocoa>=11.1,<13; sys_platform == 'darwin'",
  "rich>=15,<16",
]

[project.scripts]
extra-shell-completions = "workstation.local.shell_completions:main"
raycast-t3-chat = "workstation.macos.raycast:main"
sync-equicord-settings = "workstation.apps.equicord_settings:main"
vscode-t3-chat-icons = "workstation.apps.vscode_icons:main"
desktop-perf-audit = "workstation.local.desktop_audit:desktop_perf_audit_entrypoint"
discord-equicord = "workstation.apps.discord:entrypoint"
gnome-t3-chat-accent = "workstation.local.gnome:gnome_t3_chat_accent_entrypoint"
jj-diff = "workstation.local.jj:jj_diff_entrypoint"
macos-t3-chat-appearance = "workstation.macos.appearance:apply_appearance"
phone-mirror = "workstation.local.phone_mirror:entrypoint"
terminal-t3-chat = "workstation.macos.terminal:terminal_profile"

[dependency-groups]
automation = [
  "ansible>=14,<15",
  "ansible-core>=2.21,<2.22",
  "ansible-lint>=26,<27",
]
dev = [
  "astral>=3.2,<4",
  "complexipy>=7,<8",
  "defusedxml>=0.7,<1",
  "deptry>=0.25.1,<0.26",
  "ruff>=0.16,<0.17",
  "ty>=0.0.57,<0.1",
  "vulture>=2.14,<3",
]

[tool.uv]
default-groups = ["dev", "automation"]
required-version = ">=0.11.26,<0.13"
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.pip]
strict = true

[tool.setuptools.packages.find]
where = ["packages/dotfiles-python/src"]
include = ["workstation", "workstation.*"]
namespaces = false

[tool.setuptools.data-files]
"share/dotfiles-python/desktop" = [
  "packages/dotfiles-python/assets/desktop/*.json",
  "packages/dotfiles-python/assets/desktop/*.in",
]

[tool.ruff]
force-exclude = true
line-length = 88
preview = true
show-fixes = true
target-version = "py314"
unsafe-fixes = false

[tool.ruff.lint]
ignore = [
  # Ruff formatter conflicts: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "incorrect-blank-line-before-class",
  "docstring-tab-indentation",
  "multi-line-summary-second-line",
  "triple-single-quotes",
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "multi-line-implicit-string-concatenation",
  "bad-quotes-inline-string",
  "bad-quotes-multiline-string",
  "bad-quotes-docstring",
  "avoidable-escaped-quote",
  "unnecessary-escaped-quote",
  "tab-indentation",
  # The formatter intentionally leaves some long URLs and command strings intact.
  "line-too-long",
  # Copyright headers and exhaustive API prose do not make automation safer.
  "missing-copyright-notice",
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "undocumented-magic-method",
  "undocumented-public-nested-class",
  "undocumented-public-init",
  "DOC",
  # Factoring every exception string into a variable obscures local error handling.
  "raw-string-in-exception",
  "f-string-in-exception",
  "raise-vanilla-args",
  # Boolean state and predicate helpers remain clearest at their call sites.
  "FBT",
  # These rewrites tend to reduce readability without improving correctness.
  "static-join-to-f-string",
  "magic-value-comparison",
  "no-self-use",
  "unnecessary-paren-on-raise-exception",
  "try-consider-else",
  # These are command-line programs; stdout is part of their interface.
  "print",
  # Importing subprocess and using argv without a shell are intentional here.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-no-shell",
  # Standalone automation scripts are not importable packages.
  "implicit-namespace-package",
  # Package initializers intentionally register Cyclopts command trees.
  "non-empty-init-module",
  # Runtime import placement is deliberate; ty checks the annotations themselves.
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  # Ruff cannot infer the shared fail() helper's NoReturn contract here; ty can.
  "implicit-return",
]
select = ["ALL"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["workstation"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Toshy executes these slices inside its config namespace and supplies the API.
"ansible/roles/keyboard/files/toshy/slices/*.py" = [
  "runtime-import-in-type-checking-block",
]
# This variable name is Toshy's public configuration interface.
"ansible/roles/keyboard/files/toshy/slices/kbtype_override.py" = [
  "mixed-case-variable-in-global-scope",
]
"packages/dotfiles-python/src/workstation/macos/terminal.py" = [
  "get-attr-with-constant",
]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-locals = 20
max-positional-args = 8
max-returns = 10
max-statements = 60
max-statements-in-try = 10

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.ty.environment]
extra-paths = [
  "./",
  "./ansible/roles/keyboard/files/toshy",
  "./packages/dotfiles-python/src",
  "./bluebuild/files/kmscon",
  "./packages/source-lock",
  "./dotfiles/dot_local/lib/python",
]

[tool.ty.src]
include = [".github", "ansible", "bluebuild", "dotfiles", "packages"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.vulture]
exclude = ["*/node_modules/*", "*/__pycache__/*"]
min_confidence = 100
paths = [".github", "ansible", "bluebuild", "dotfiles", "packages"]
sort_by_size = true

[tool.deptry]
root = [".github", "ansible", "bluebuild", "dotfiles", "packages"]
# Keep first-party setup.py helpers in dependency discovery.
exclude = [
  "(^|.*/)(venv|\\.venv|\\.direnv|\\.git|\\.jj|node_modules|build|dist)(/|$)",
]
known_first_party = [
  "kmscon_files",
  "lsp_jsonrpc",
  "source_lock",
  "workstation",
]

[tool.deptry.per_rule_ignores]
# Solaar and Toshy supply their own deployment runtimes.
DEP001 = ["solaar", "xwaykeyz"]
# Cocoa is macOS-only and loaded dynamically through importlib.
DEP002 = ["pyobjc-framework-Cocoa"]
# These dependencies belong to separately deployed helpers, not this wheel.
DEP004 = ["ansible", "astral"]

[tool.complexipy]
exclude = ["**/node_modules/**", "**/__pycache__/**"]
failed = true
max-complexity-allowed = 15
paths = [".github", "ansible", "bluebuild", "dotfiles", "packages"]
