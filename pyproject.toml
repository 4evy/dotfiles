[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "dotfiles-python"
version = "0.1.0"
description = "Python tooling for dotfiles."
requires-python = ">=3.14,<3.15"
dependencies = [
  "astral>=3.2,<4",
  "cyclopts>=4.20,<5",
  "defusedxml>=0.7,<1",
  "filelock>=3.18,<4",
  "githubkit>=0.15,<1",
  "humanize>=4.13,<5",
  "httpx>=0.28,<1",
  "httpx-retries>=0.6,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.26,<5",
  "packaging>=24,<27",
  "pillow>=11,<13",
  "platformdirs>=4.3,<5",
  "plumbum>=2,<3",
  "psutil>=7,<8",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14.2,<3",
  "pyobjc-framework-Cocoa>=12,<13; sys_platform == 'darwin'",
  "questionary>=2.1,<3",
  "rich>=15,<16",
  "tenacity>=9.1,<10",
]

[project.scripts]
alt-tab-license = "workstation.local.licenses:alt_tab_license_entrypoint"
codex = "workstation.local.shims:codex_entrypoint"
desktop-perf-audit = "workstation.local.desktop_audit:desktop_perf_audit_entrypoint"
discord-equicord = "workstation.apps.discord:entrypoint"
dotfiles-python = "workstation.local.shims:python_entrypoint"
dotfiles-python3 = "workstation.local.shims:python3_entrypoint"
dotfiles-scripts = "workstation.cli:entrypoint"
gnome-catppuccin-accent = "workstation.local.gnome:gnome_catppuccin_accent_entrypoint"
hyper-window-tiling-build = "workstation.local.hyper_window_tiling_build:entrypoint"
install-ghidra-mcp = "workstation.apps.ghidra_mcp:entrypoint"
install-yaml-language-server = "workstation.host.devtools:install_entrypoint"
jj-get = "workstation.local.jj:jj_get_entrypoint"
jj-git-fetch = "workstation.local.jj:jj_git_fetch_entrypoint"
jj-redate = "workstation.local.jj:jj_redate_entrypoint"
phone-mirror = "workstation.local.phone_mirror:entrypoint"
raycast-beta-patch = "workstation.local.raycast:entrypoint"
spectrum-build = "spectrum_build.cli:entrypoint"
system-runner = "workstation.local.system_runner:entrypoint"
vscode-nixd = "workstation.local.shims:vscode_nixd_entrypoint"
vscode-nixfmt = "workstation.local.shims:vscode_nixfmt_entrypoint"
yaml-language-server = "workstation.host.devtools:yaml_language_server_entrypoint"

[dependency-groups]
dev = [
  "complexipy>=6,<7",
  "deptry>=0.25.1,<0.26",
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
  "ty>=0.0.57,<0.1",
  "vulture>=2.14,<3",
]

[tool.uv]
required-version = ">=0.11.26,<0.12"
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.pip]
strict = true

[tool.setuptools]
package-dir = { workstation = "packages/dotfiles-python/src/workstation", spectrum_build = "spectrum/scripts/spectrum_build" }
packages = [
  "workstation",
  "workstation.apps",
  "workstation.host",
  "workstation.lib",
  "workstation.local",
  "workstation.local.jj",
  "workstation.macos",
  "spectrum_build",
  "spectrum_build.core",
  "spectrum_build.image",
  "spectrum_build.integrations",
  "spectrum_build.manifests",
  "spectrum_build.programs",
]

[tool.setuptools.package-data]
"spectrum_build.image" = ["*.sh", "*.zsh"]

[tool.setuptools.data-files]
"share/dotfiles-python/manifests" = [
  "manifests/*.json",
  "manifests/*.toml",
  "manifests/*.txt",
]
"share/dotfiles-python/apps" = [
  "packages/dotfiles-python/assets/apps/install-ghostty-tip-linux.container.py",
]
"share/dotfiles-python/apps/ghidra-mcp" = [
  "packages/dotfiles-python/assets/apps/ghidra-mcp/bridge-auth-token.patch",
  "packages/dotfiles-python/assets/apps/ghidra-mcp/required-ghidra-jars.txt",
  "packages/dotfiles-python/assets/apps/ghidra-mcp/rewrite-pom.py",
]
"share/dotfiles-python/apps/ghidra-mcp/wrappers" = [
  "packages/dotfiles-python/assets/apps/ghidra-mcp/wrappers/*.py.in",
]
"share/dotfiles-python/apps/ghostty/patches" = [
  "patches/ghostty/*.patch",
  "patches/ghostty/series",
]
"share/dotfiles-python/apps/helium" = [
  "browser/helium.toml",
  "browser/helium-profile-avatar.png",
]
"share/dotfiles-python/apps/helium/settings" = ["browser/settings/*.json"]
"share/dotfiles-python/host/apps" = [
  "packages/dotfiles-python/assets/host/apps/rustdesk.desktop",
]
"share/dotfiles-python/host/apps/rustdesk-selinux" = [
  "packages/dotfiles-python/assets/host/apps/rustdesk-selinux/*",
]
"share/dotfiles-python/host/apps/tailscale-selinux" = [
  "packages/dotfiles-python/assets/host/apps/tailscale-selinux/*",
]
"share/dotfiles-python/desktop" = [
  "packages/dotfiles-python/assets/desktop/*.json",
  "packages/dotfiles-python/assets/desktop/*.in",
]
"share/dotfiles-python/macos" = [
  "packages/dotfiles-python/assets/macos/*.applescript",
  "packages/dotfiles-python/assets/macos/logitech-platform.py",
]
"share/dotfiles-python/macos/templates" = [
  "packages/dotfiles-python/assets/macos/templates/*.in",
]

[tool.pytest.ini_options]
filterwarnings = ["error"]
minversion = "9.0"
strict = true
testpaths = [
  "packages/dotfiles-python/tests",
  "ansible/tests",
  "spectrum/scripts/tests",
]

[tool.ruff]
extend-exclude = ["packages/toshy/slices"]
force-exclude = true
line-length = 88
preview = true
show-fixes = true
target-version = "py314"
unsafe-fixes = false

[tool.ruff.lint]
ignore = [
  # Ruff formatter conflicts: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "incorrect-blank-line-before-class",
  "docstring-tab-indentation",
  "multi-line-summary-second-line",
  "triple-single-quotes",
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "multi-line-implicit-string-concatenation",
  "bad-quotes-inline-string",
  "bad-quotes-multiline-string",
  "bad-quotes-docstring",
  "avoidable-escaped-quote",
  "unnecessary-escaped-quote",
  "tab-indentation",
  # The formatter intentionally leaves some long URLs and command strings intact.
  "line-too-long",
  # Copyright headers and exhaustive API prose do not make automation safer.
  "missing-copyright-notice",
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "undocumented-magic-method",
  "undocumented-public-nested-class",
  "undocumented-public-init",
  "DOC",
  # Factoring every exception string into a variable obscures local error handling.
  "raw-string-in-exception",
  "f-string-in-exception",
  "raise-vanilla-args",
  # Boolean state and predicate helpers remain clearest at their call sites.
  "FBT",
  # These rewrites tend to reduce readability without improving correctness.
  "static-join-to-f-string",
  "magic-value-comparison",
  "no-self-use",
  "unnecessary-paren-on-raise-exception",
  "try-consider-else",
  # These are command-line programs; stdout is part of their interface.
  "print",
  # Importing subprocess and using argv without a shell are intentional here.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-no-shell",
  # Standalone automation scripts and tests are not importable packages.
  "implicit-namespace-package",
  # Package initializers intentionally register Cyclopts command trees.
  "non-empty-init-module",
  # Runtime import placement is deliberate; ty checks the annotations themselves.
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  # Ruff cannot infer the shared fail() helper's NoReturn contract here; ty can.
  "implicit-return",
]
select = ["ALL"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["workstation", "spectrum_build"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"ansible/library/dotfiles_operation.py" = [
  "module-import-not-at-top-of-file",
  "shebang-not-executable",
]
"**/test_*.py" = [
  "import-private-name",
  "magic-value-comparison",
  "assert",
  "private-member-access",
]
"spectrum/scripts/spectrum_build/integrations/dnf.py" = ["any-type"]
"packages/dotfiles-python/assets/apps/ghidra-mcp/rewrite-pom.py" = [
  "suspicious-xml-etree-import",
]
"packages/dotfiles-python/assets/apps/install-ghostty-tip-linux.container.py" = [
  "start-process-with-partial-path",
]
"packages/dotfiles-python/src/workstation/automation.py" = [
  "import-outside-top-level",
]
"packages/dotfiles-python/src/workstation/macos/terminal.py" = [
  "get-attr-with-constant",
]
"packages/dotfiles-python/src/workstation/apps/ghostty.py" = [
  "hardcoded-temp-file",
]
"packages/dotfiles-python/src/workstation/lib/files.py" = [
  "tarfile-unsafe-members",
]
"packages/dotfiles-python/src/workstation/lib/templates.py" = [
  "jinja2-autoescape-false",
]
"spectrum/scripts/build.py" = ["start-process-with-partial-path"]
"spectrum/scripts/spectrum_build/image/cleanup.py" = ["hardcoded-temp-file"]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-locals = 20
max-positional-args = 8
max-returns = 10
max-statements = 60
max-statements-in-try = 10

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.ty.environment]
extra-paths = [
  "./spectrum/scripts",
  "./packages/dotfiles-python/src",
  "./packages/toshy",
]

[tool.ty.src]
exclude = ["packages/toshy/slices"]
include = ["ansible", "dotfiles", "packages", "spectrum"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.vulture]
min_confidence = 100
paths = ["ansible", "dotfiles", "packages", "spectrum"]
sort_by_size = true

[tool.deptry]
extend_exclude = [".*tests/"]
known_first_party = ["spectrum_build", "workstation"]

[tool.deptry.per_rule_ignores]
# Ansible injects its module runtime; Toshy injects xwaykeyz into its slices.
DEP001 = ["ansible", "xwaykeyz"]
# Cocoa is macOS-only and loaded dynamically through importlib.
DEP002 = ["pyobjc-framework-Cocoa"]

[tool.complexipy]
failed = true
max-complexity-allowed = 15
paths = ["ansible", "dotfiles", "packages", "spectrum"]
