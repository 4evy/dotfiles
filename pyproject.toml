[project]
name = "dotfiles-toshy"
version = "0.1.0"
description = "Repository checks for Toshy configuration"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
dev = [
  "complexipy>=8.0.1,<9",
  "deptry>=0.25.1,<0.26",
  "ruff>=0.17.1,<0.18",
  "ty>=0.0.89,<0.1",
  "vulture>=2.16,<3",
]

[tool.uv]
package = false
default-groups = ["dev"]
required-version = ">=0.13,<0.14"
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.pip]
strict = true

[tool.ruff]
force-exclude = true
line-length = 88
preview = true
show-fixes = true
target-version = "py314"
unsafe-fixes = false

[tool.ruff.lint]
ignore = [
  # Ruff formatter conflicts: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "incorrect-blank-line-before-class",
  "docstring-tab-indentation",
  "multi-line-summary-second-line",
  "triple-single-quotes",
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "multi-line-implicit-string-concatenation",
  "bad-quotes-inline-string",
  "bad-quotes-multiline-string",
  "bad-quotes-docstring",
  "avoidable-escaped-quote",
  "unnecessary-escaped-quote",
  "tab-indentation",
  # The formatter intentionally leaves some long URLs and command strings intact.
  "line-too-long",
  # Copyright headers and exhaustive API prose do not make automation safer.
  "missing-copyright-notice",
  "missing-trailing-period",
  "missing-terminal-punctuation",
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "undocumented-magic-method",
  "undocumented-public-nested-class",
  "undocumented-public-init",
  "DOC",
  # Factoring every exception string into a variable obscures local error handling.
  "raw-string-in-exception",
  "f-string-in-exception",
  "raise-vanilla-args",
  # Boolean state and predicate helpers remain clearest at their call sites.
  "FBT",
  # These rewrites tend to reduce readability without improving correctness.
  "static-join-to-f-string",
  "magic-value-comparison",
  "no-self-use",
  "unnecessary-paren-on-raise-exception",
  "try-consider-else",
  # These are command-line programs; stdout is part of their interface.
  "print",
  # Importing subprocess and using argv without a shell are intentional here.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
  "start-process-with-no-shell",
  # Standalone automation scripts are not importable packages.
  "implicit-namespace-package",
  # Package initializers intentionally register Cyclopts command trees.
  "non-empty-init-module",
  # Every source declares its Python version, including non-executable modules.
  "shebang-not-executable",
  # Runtime import placement is deliberate; ty checks the annotations themselves.
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  # Ruff cannot infer the shared fail() helper's NoReturn contract here; ty can.
  "implicit-return",
]
select = ["ALL"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Toshy executes these slices inside its config namespace and supplies the API.
"packages/toshy-user/slices/*.py" = ["runtime-import-in-type-checking-block"]
# This variable name is Toshy's public configuration interface.
"packages/toshy-user/slices/kbtype_override.py" = [
  "mixed-case-variable-in-global-scope",
]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-locals = 20
max-positional-args = 8
max-returns = 10
max-statements = 60
max-statements-in-try = 10

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["./", "./packages/toshy-user"]

[tool.ty.src]
include = ["packages/toshy-user", "scripts/setup/toshy.py"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.vulture]
exclude = ["*/node_modules/*", "*/__pycache__/*"]
min_confidence = 100
paths = ["packages/toshy-user", "scripts/setup/toshy.py"]
sort_by_size = true

[tool.deptry]
root = ["packages/toshy-user", "scripts"]
# Keep first-party setup.py helpers in dependency discovery.
exclude = [
  "(^|.*/)(venv|\\.venv|\\.direnv|\\.git|\\.jj|node_modules|zig-pkg|build|dist)(/|$)",
]

[tool.deptry.per_rule_ignores]
# Solaar and Toshy supply their own deployment runtimes.
DEP001 = ["xwaykeyz"]

[tool.complexipy]
exclude = ["**/node_modules/**", "**/__pycache__/**"]
failed = true
max-complexity-allowed = 15
paths = ["packages/toshy-user", "scripts/setup/toshy.py"]
