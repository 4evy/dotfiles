[Unit]
Documentation=https://github.com/RedBearAK/Toshy https://github.com/jtroo/kanata/blob/main/docs/setup-linux.md

[Service]
Environment=DOTFILES_TOSHY_ONLY_DEVICES=/run/kanata-main/main
ExecStartPre=/bin/sh -c 'readonly readiness_attempts=25 readiness_poll_seconds=0.2; attempt=0; while [ "$$attempt" -lt "$$readiness_attempts" ]; do [ -e /run/kanata-main/main ] && exit 0; sleep "$$readiness_poll_seconds"; attempt=$$((attempt + 1)); done; echo "toshy-config: waiting for /run/kanata-main/main timed out" >&2; exit 1'
