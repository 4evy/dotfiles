---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
version: 2
base:
  image:
    registry: ghcr.io
    repository: ublue-os/bluefin-nvidia-open
    tag: "45"
    digest: sha256:dcf0c82bcb6a4e7677db1d84be1f8653a16b93fd87186890ad0c151875809a58
metadata:
  name: spectrum
  description: Evy's Bluefin workstation image
  labels:
    org.opencontainers.image.source: https://github.com/4evy/dotfiles
spec:
  tool-versions:
    # The all-features CLI is pinned in spectrum/stages/files.yml
    bluebuild: none
  platforms:
    - linux/amd64

stages:
  - from-file: spectrum/stages/bun-dependencies.yml
  - from-file: spectrum/stages/workstation.yml
  - from-file: spectrum/stages/tiling/tiling.yml
  - from-file: spectrum/stages/kanata-inputs.yml
  - from-file: spectrum/stages/kanata.yml
  - from-file: spectrum/stages/bootvine-inputs.yml
  - from-file: spectrum/stages/bootvine.yml
  - from-file: spectrum/stages/files.yml

modules:
  # Put immutable, remote-heavy work first. Local source and configuration
  # changes then invalidate only the cheap assembly/finalization tail.
  - from-file: spectrum/modules/software.yml
  - from-file: spectrum/modules/local.yml
  - from-file: spectrum/modules/system.yml
