---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: spectrum-files
from: docker.io/oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
modules:
  # Assemble local resources here, then copy one tree into the large final image
  # Release installers omit the recipe-v2 and bootc features used on the host
  - type: containerfile
    snippets:
      - COPY --from=ghcr.io/blue-build/cli:main-installer@sha256:e3a2445a70ea9b1d5a21113549b59db54dbe0272b8af0da6fc6ccf654788ec19 /out/bluebuild /out/usr/bin/bluebuild

  - type: copy@v1
    from: workstation
    src: /out/usr
    dest: /out/usr

  - type: copy@v1
    from: hyper-window-tiling
    src: /src/tools/tiling/gnome/metadata.json
    dest: /out/usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/metadata.json

  - type: copy@v1
    from: hyper-window-tiling
    src: /src/tools/tiling/dist/gnome/extension.js
    dest: /out/usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/extension.js

  - type: copy@v1
    from: hyper-window-tiling
    src: /src/tools/tiling/dist/gnome/schemas/org.gnome.shell.extensions.hyper-window-tiling.gschema.xml
    dest: /out/usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/schemas/org.gnome.shell.extensions.hyper-window-tiling.gschema.xml

  - type: copy@v1
    from: hyper-window-tiling
    src: /src/tools/tiling/kde/metadata.json
    dest: /out/usr/share/kwin/scripts/hyper-window-tiling/metadata.json

  - type: copy@v1
    from: hyper-window-tiling
    src: /src/tools/tiling/dist/kde/contents/code/main.js
    dest: /out/usr/share/kwin/scripts/hyper-window-tiling/contents/code/main.js

  - type: copy@v1
    from: kanata
    src: /out/usr
    dest: /out/usr

  - type: copy@v1
    from: bootvine
    src: /out
    dest: /out

  - type: copy@v1
    src: systems/spectrum/files/system
    dest: /out

  - type: copy@v1
    src: systems/spectrum/recipes/spectrum/sources/system
    dest: /out

  - type: copy@v1
    src: systems/spectrum/files/selinux
    dest: /out/tmp/spectrum-policy-sources

  - type: copy@v1
    src: packages/solaar/tray.patch
    dest: /out/tmp/solaar-no-tray.patch

  - type: copy@v1
    src: packages/kanata/kanata.kbd
    dest: /out/usr/libexec/dotfiles/kanata/kanata.kbd

  - type: copy@v1
    src: home/theme/palette/palette.json
    dest: /out/usr/share/dotfiles/catppuccin_custom_palette.json

  - type: copy@v1
    src: data/rustdesk/options.json
    dest: /out/usr/share/dotfiles/rustdesk-options.json
