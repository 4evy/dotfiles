---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: kanata
# Use the final image's Fedora release and runtime libraries.
from: ${BASE_IMAGE}
modules:
  # Keep the Fedora toolchain layer independent of changing source inputs
  - type: dnf@v1
    source: ghcr.io/blue-build/modules/dnf:v1@sha256:f461849889b66098b7b5c7dc2661ac41c8a9b5cad6e0fbedd142de8e42ae72ec
    install:
      install-weak-deps: false
      packages:
        - cargo
        - gcc
        - git
        - jq
        - pkgconf-pkg-config
        - python3
        - rust
        - systemd-devel

  # Bind only these inputs so unrelated context edits preserve the compile cache
  # Stage-backed binds work under SELinux without Podman-only relabel options
  - type: containerfile
    snippets:
      - |-
        RUN \
          --mount=type=bind,from=kanata-inputs,src=/src/sources.json,target=/src/sources.json \
          --mount=type=bind,from=kanata-inputs,src=/src/patches.json,target=/src/patches.json \
          --mount=type=bind,from=kanata-inputs,src=/src/build-kanata.sh,target=/src/build-kanata.sh \
          --mount=type=cache,id=spectrum-kanata-cargo-registry-v1,sharing=locked,target=/root/.cargo/registry \
          --mount=type=cache,id=spectrum-kanata-cargo-git-v1,sharing=locked,target=/root/.cargo/git \
          --mount=type=cache,id=spectrum-kanata-target-v1,sharing=locked,target=/build/kanata-source/target \
          SOURCE_LOCK=/src/sources.json \
          SOURCE_PIN=kanata-homebrew \
          PATCHES_LOCK=/src/patches.json \
          PATCH_STACK=kanata \
          PREFIX=/out/usr \
          bash /src/build-kanata.sh
