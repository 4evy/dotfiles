---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: hyper-window-tiling
from: bun-dependencies
modules:
  - type: copy@v1
    src: tools/tiling/tsconfig.json
    dest: /src/tools/tiling/tsconfig.json

  - type: copy@v1
    src: tools/tiling/bindings.json
    dest: /src/tools/tiling/bindings.json

  - type: copy@v1
    src: tools/tiling/scripts
    dest: /src/tools/tiling/scripts

  - type: copy@v1
    src: tools/tiling/src
    dest: /src/tools/tiling/src

  - type: copy@v1
    src: tools/tiling/gnome
    dest: /src/tools/tiling/gnome

  - type: copy@v1
    src: tools/tiling/kde
    dest: /src/tools/tiling/kde

  - type: containerfile
    snippets:
      - RUN cd /src/tools/tiling && bun run build
