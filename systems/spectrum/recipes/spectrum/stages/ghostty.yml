---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: ghostty
# Use the final image's Fedora release and runtime libraries.
from: ${BASE_IMAGE}
modules:
  # Keep the Fedora toolchain layer independent of changing source inputs
  - type: dnf@v1
    source: ghcr.io/blue-build/modules/dnf:v1@sha256:e6cffa08197dc55f2cdc9f596e5bae6af4dc82e8a33884ff5a4edccc251b0218
    install:
      install-weak-deps: false
      packages:
        - blueprint-compiler
        - dbus-devel
        - fontconfig-devel
        - freetype-devel
        - gcc
        - gcc-c++
        - gettext
        - git
        - gtk4-devel
        - gtk4-layer-shell-devel
        - jq
        - libadwaita-devel
        - libdrm-devel
        - libglvnd-devel
        - libxkbcommon-devel
        - libxml2-devel
        - mesa-libgbm-devel
        - ncurses-devel
        - openssl
        - pango-devel
        - patch
        - python3
        - pkgconf-pkg-config
        - tar
        - xz

  # Mount the lightweight input stage instead of committing a Fedora layer for
  # every helper, manifest, and lock. Only the compiled output enters this layer
  - type: containerfile
    snippets:
      - |-
        RUN \
          --mount=type=bind,from=ghostty-source,src=/src,target=/src \
          --mount=type=bind,from=ghostty-source,src=/usr/local/bin/bun,target=/usr/local/bin/bun \
          --mount=type=cache,id=spectrum-ghostty-zig-global-v1,sharing=locked,target=/build/zig-cache \
          --mount=type=cache,id=spectrum-ghostty-zig-local-v1,sharing=locked,target=/build/source/.zig-cache \
          SOURCE_LOCK=/src/sources.json \
          SOURCE_PIN=ghostty \
          ZIG_PIN=ghostty-zig-x86-64-linux \
          PATCHES_LOCK=/src/patches.json \
          PATCH_STACK=ghostty \
          PREFIX=/out/usr \
          ARTIFACT=/out/usr/bin/ghostty \
          VERSION_PREFIX=1.4.0+patched \
          BUILD_ARGUMENTS="-j1 -Dcpu=baseline -Doptimize=fast -Demit-test-exe=false" \
          bash /src/build-ghostty.sh
