---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: workstation
from: docker.io/oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
modules:
  # Source and palette edits must not invalidate dependency installation
  - type: copy@v1
    src: tools/workstation/package.json
    dest: /src/tools/workstation/package.json

  - type: copy@v1
    src: package.json
    dest: /src/package.json

  - type: copy@v1
    src: bun.lock
    dest: /src/bun.lock

  - type: copy@v1
    src: home/package.json
    dest: /src/home/package.json

  - type: copy@v1
    src: home/files/.local/lib/package.json
    dest: /src/home/files/.local/lib/package.json

  - type: copy@v1
    src: lib/typescript/package.json
    dest: /src/lib/typescript/package.json

  - type: copy@v1
    src: tools/tiling/package.json
    dest: /src/tools/tiling/package.json

  - type: containerfile
    snippets:
      - |-
        RUN \
          --mount=type=cache,id=spectrum-workstation-bun-v1,sharing=locked,target=/root/.bun/install/cache \
          cd /src && \
          bun install --frozen-lockfile --ignore-scripts --filter @dotfiles/workstation

  # Workspace packages retain their source-relative runtime dependency lookup
  - type: copy@v1
    src: lib/typescript
    dest: /src/lib/typescript

  # Build entrypoint and compiler configs are also source fingerprint inputs
  - type: copy@v1
    src: tsconfig.json
    dest: /src/tsconfig.json

  - type: copy@v1
    src: tools/workstation/tsconfig.json
    dest: /src/tools/workstation/tsconfig.json

  - type: copy@v1
    src: tools/workstation/build.ts
    dest: /src/tools/workstation/build.ts

  - type: copy@v1
    src: tools/workstation/src
    dest: /src/tools/workstation/src

  - type: copy@v1
    src: tools/workstation/assets
    dest: /src/tools/workstation/assets

  - type: copy@v1
    src: home/theme/palette/palette.json
    dest: /src/home/theme/palette/palette.json

  - type: copy@v1
    src: home/generators.json
    dest: /src/home/generators.json

  - type: copy@v1
    src: home/deploy/schema.ts
    dest: /src/home/deploy/schema.ts

  # Keep the runtime source closure aligned with install.ts's source fingerprint
  - type: copy@v1
    src: home/files/.local/lib/typescript/process.ts
    dest: /src/home/files/.local/lib/typescript/process.ts

  - type: copy@v1
    src: home/files/.local/lib/typescript/runtime.ts
    dest: /src/home/files/.local/lib/typescript/runtime.ts

  - type: copy@v1
    src: tools/workstation/install.ts
    dest: /src/tools/workstation/install.ts

  - type: copy@v1
    src: tools/workstation/install.sh
    dest: /src/tools/workstation/install.sh

  - type: containerfile
    snippets:
      - |-
        RUN set -euo pipefail; \
          cd /src/tools/workstation && \
          bun run build && \
          install -Dm755 dist/workstation /out/usr/bin/workstation && \
          bun -e 'import { commandNames } from "./src/registry.ts"; console.log(commandNames.join("\n"))' | \
          while IFS= read -r command; do \
            ln -s workstation "/out/usr/bin/$command"; \
          done; \
          mkdir -p /out/usr/share/dotfiles; \
          bun /src/tools/workstation/install.ts --fingerprint > /out/usr/share/dotfiles/workstation.sha256
