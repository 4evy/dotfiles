---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: kargs@v1
    source: ghcr.io/blue-build/modules/kargs:v1@sha256:e54b580450f2f6674721b8fc752686cd198fdfbe2210a2502a02dd16738ad247
    kargs:
      - plymouth.enable=0
      - rd.plymouth=0
      - systemd.show_status=1
      - rd.systemd.show_status=1
      - loglevel=7
      # Turing notebooks need explicit runtime D3 power management
      - nvidia.NVreg_DynamicPowerManagement=0x02

  - type: systemd@v1
    source: ghcr.io/blue-build/modules/systemd:v1@sha256:2d2b3d8f7388a999544dbaa90de639f4bbe37f2f6adb4af8dabce5cb5cd4090a
    system:
      enabled:
        - brew-setup.service
        - fedora-atomic-desktop-appstream-cache-refresh.timer
        - kanata-main.service
        - kmscon-theme-refresh.timer
        - kmsconvt@.service
        - pcscd.socket
        - podman.socket
        - rustdesk.service
        - spectrum-tailscale-policy.service
        - sshd-tailscale.socket
        - systemd-oomd.service
        - systemd-oomd.socket
        - tailscaled.service
        - uresourced.service
      disabled:
        - brew-update.timer
        - brew-upgrade.timer
        - bootc-unified-storage.service
        - fedora-atomic-desktop-appstream-cache-refresh.service
    user:
      enabled:
        - toshy-kanata-device.path
        - vicinae.service

  - type: script@v2
    source: ghcr.io/blue-build/modules/script:v2@sha256:d6076360da9195e2a6d781043a1b049bede3d2389757912a828a957bc78929b8
    snippets:
      - |
        install -d -m 0755 /usr/share/selinux/packages/spectrum
        for module in tailscaled rustdesk; do
          source="/tmp/spectrum-selinux/$module"
          install -d "$source"
          cp "/tmp/spectrum-policy-sources/$module/"* "$source/"
          make -f /usr/share/selinux/devel/Makefile -C "$source" "$module.pp"
          install -m 0644 "$source/$module.pp" /usr/share/selinux/packages/spectrum/
        done
        semodule -n -i /usr/share/selinux/packages/spectrum/tailscaled.pp /usr/share/selinux/packages/spectrum/rustdesk.pp
        rm -rf /tmp/spectrum-selinux /tmp/spectrum-policy-sources
      # OpenSSH owns forwarding sockets as the authenticated user
      - semanage port -a -N -t ssh_port_t -p tcp 2222
      - install -d -m 0755 /nix /var/roothome
      - dconf update
      - touch /nix/.spectrum-mountpoint
      # Keep the analytics opt-out previously supplied by the brew module.
      - |
        touch /etc/environment
        sed -i '/^HOMEBREW_NO_ANALYTICS=/d' /etc/environment
        printf '%s\n' 'HOMEBREW_NO_ANALYTICS=1' >> /etc/environment
      - |
        if authselect is-feature-enabled with-fingerprint >/dev/null 2>&1; then
          authselect disable-feature with-fingerprint
        fi
      - rm -rf -- /boot/efi
      - rm -rf -- /run/selinux-policy /run/setrans
      - rm -f -- /usr/etc/profile.d/umotd.sh /etc/profile.d/umotd.sh
      - >-
        glib-compile-schemas
        /usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/schemas
      - systemd-sysusers /usr/lib/sysusers.d/uinput.conf
      - |
        for unit in \
          zfs.target \
          zfs-import-cache.service \
          zfs-mount.service \
          zfs-share.service \
          zfs-zed.service \
          zfs-volume-wait.service \
          flatpak-preinstall.service \
          NetworkManager-wait-online.service; do
          if systemctl list-unit-files "$unit" --no-legend 2>/dev/null | grep -q .; then
            systemctl disable "$unit"
          fi
        done
      - |-
        for directory in /run/rpm-ostree/lock /run/rpm-ostree /run/dnf; do
          if test -d "$directory"; then
            rmdir "$directory"
          fi
        done
