---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Local edits invalidate one assembly layer after the remote-heavy modules
  - type: copy@v1
    from: spectrum-files
    src: /out
    dest: /

  - type: script@v2
    source: ghcr.io/blue-build/modules/script:v2@sha256:04bff0d405b71c7d49d5c7499ad7a42f1bcf5fa339c6381ddbeef376c332c122
    snippets:
      - patch --batch --forward -p2 -d "$(/usr/bin/python3 -c 'import importlib.util; from pathlib import Path; print(Path(importlib.util.find_spec("solaar").origin).parent.parent)')" < /tmp/solaar-no-tray.patch
      - rm /tmp/solaar-no-tray.patch
