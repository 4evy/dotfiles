---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Install stable, remote-heavy inputs before repository-local files so local
  # edits do not force these downloads to run again.
  # The pinned DNF module resolves repo files under CONFIG_DIRECTORY/dnf
  - type: copy@v1
    src: systems/spectrum/files/dnf
    dest: /tmp/spectrum-config/dnf

  - type: dnf@v1
    source: ghcr.io/blue-build/modules/dnf:v1@sha256:f461849889b66098b7b5c7dc2661ac41c8a9b5cad6e0fbedd142de8e42ae72ec
    env:
      CONFIG_DIRECTORY: /tmp/spectrum-config
    repos:
      cleanup: true
      files:
        - 1password.repo
      copr:
        - scottames/vicinae
      keys:
        - https://downloads.1password.com/linux/keys/1password.asc
      nonfree: rpmfusion
    install:
      install-weak-deps: false
      packages:
        - 1password
        - 1password-cli
        - blueprint-compiler
        - bootc
        - bubblewrap
        - ayugram-desktop
        - curl
        - dbus-libs
        - file
        - findutils
        - flatpak
        - fuse3
        - git
        - gjs
        - google-noto-color-emoji-fonts
        - google-noto-emoji-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-sans-egyptian-hieroglyphs-fonts
        - google-noto-sans-mono-cjk-vf-fonts
        - google-noto-sans-mono-vf-fonts
        - google-noto-sans-symbols-2-fonts
        - google-noto-sans-symbols-vf-fonts
        - google-noto-sans-vf-fonts
        - gsound
        - gtk4-layer-shell
        - just
        - kmscon
        - kmscon-freetype
        - libgda
        - libgda-sqlite
        - liberation-mono-fonts
        - liberation-sans-fonts
        - liberation-serif-fonts
        - libxdo
        - ncurses
        - opensc
        - openssh-clients
        - openssh-server
        - patch
        - pinentry
        - pinentry-gnome3
        - pipewire-gstreamer
        - podman
        - podman-compose
        - procps-ng
        - python3.15
        - rsync
        - selinux-policy-devel
        - solaar
        - systemd-oomd-defaults
        - systemd-libs
        - tailscale
        - telegram-desktop
        - uresourced
        - vim-enhanced
        - vicinae
        - vulkan-tools
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - https://discord.com/api/download?platform=linux&format=rpm

  # The RPM owns desktop files and icons. Keep helper GIDs consistent between
  # the image group database, setgid executables, and boot-time sysusers.
  - type: script@v2
    source: ghcr.io/blue-build/modules/script:v2@sha256:7c53921aee3ea68f91edacccac13f793ec63424d1376b0b0c8b1c0b56eca5b4c
    snippets:
      - |
        readonly onepassword_gid=1500 onepassword_cli_gid=1600 onepassword_mcp_gid=1700
        rm -rf /tmp/spectrum-config
        groupmod --gid "$onepassword_gid" onepassword
        groupmod --gid "$onepassword_cli_gid" onepassword-cli
        groupmod --gid "$onepassword_mcp_gid" onepassword-mcp
        chmod 4755 /opt/1Password/chrome-sandbox
        chgrp "$onepassword_gid" /opt/1Password/1Password-BrowserSupport
        chmod g+s /opt/1Password/1Password-BrowserSupport
        chgrp "$onepassword_cli_gid" /usr/bin/op
        chmod g+s /usr/bin/op
        chgrp "$onepassword_mcp_gid" /opt/1Password/1password-mcp
        chmod g+s /opt/1Password/1password-mcp
        printf 'g onepassword %s\n' "$onepassword_gid" > /usr/lib/sysusers.d/onepassword.conf
        printf 'g onepassword-cli %s\n' "$onepassword_cli_gid" > /usr/lib/sysusers.d/onepassword-cli.conf
        printf 'g onepassword-mcp %s\n' "$onepassword_mcp_gid" > /usr/lib/sysusers.d/onepassword-mcp.conf
        rm -f /usr/lib/sysusers.d/30-rpmostree-pkg-group-onepassword.conf
        rm -f /usr/lib/sysusers.d/30-rpmostree-pkg-group-onepassword-cli.conf
        rm -f /usr/lib/sysusers.d/30-rpmostree-pkg-group-onepassword-mcp.conf

  # Reconcile user Flatpaks at boot. Flatpak itself selects and maintains the
  # host's matching graphics-driver extensions with each runtime.
  - type: default-flatpaks@v2
    source: ghcr.io/blue-build/modules/default-flatpaks:v2@sha256:05ad18b6d39c2152db9810eccd6d7fa6a0a0fcce854b0abcd32d39846657c26a
    configurations:
      - scope: user
        notify: false
        repo:
          name: flathub
          title: Flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - org.gnome.NautilusPreviewer

  - type: gnome-extensions@v1
    source: ghcr.io/blue-build/modules/gnome-extensions:v1@sha256:7208c3e6f925715f3fee04557eedc69ac2477438cd12b4eb2b03bb767303be74
    install:
      - 4974 # Window Calls Extended
      - 5060 # Xremap
      - 5592 # Focused Window D-Bus
      - 8594 # Vicinae
      - 8834 # Copyous

  # Versioned RPM updates must not invalidate the bulk install and extensions
  - type: dnf@v1
    source: ghcr.io/blue-build/modules/dnf:v1@sha256:f461849889b66098b7b5c7dc2661ac41c8a9b5cad6e0fbedd142de8e42ae72ec
    install:
      install-weak-deps: false
      packages:
        # renovate: datasource=github-releases depName=rustdesk/rustdesk
        - https://github.com/rustdesk/rustdesk/releases/download/1.5.3/rustdesk-1.5.3-0.x86_64.rpm
