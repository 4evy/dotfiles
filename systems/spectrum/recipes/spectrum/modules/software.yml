---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Install stable, remote-heavy inputs before repository-local files so local
  # edits do not force these downloads to run again.
  # The pinned DNF module resolves repo files under CONFIG_DIRECTORY/dnf
  - type: copy@v1
    src: systems/spectrum/files/dnf
    dest: /tmp/spectrum-config/dnf

  - type: dnf@v1
    source: ghcr.io/blue-build/modules/dnf:v1@sha256:e6cffa08197dc55f2cdc9f596e5bae6af4dc82e8a33884ff5a4edccc251b0218
    env:
      CONFIG_DIRECTORY: /tmp/spectrum-config
    repos:
      cleanup: true
      files:
        - 1password.repo
        - vscode.repo
      copr:
        - scottames/vicinae
      keys:
        - https://downloads.1password.com/linux/keys/1password.asc
        - https://packages.microsoft.com/keys/microsoft.asc
      nonfree: rpmfusion
    install:
      install-weak-deps: false
      packages:
        - 1password
        - 1password-cli
        - blueprint-compiler
        - bootc
        - bubblewrap
        - ayugram-desktop
        - code
        - curl
        - file
        - findutils
        - flatpak
        - fuse3
        - git
        - gjs
        - google-noto-color-emoji-fonts
        - google-noto-emoji-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-sans-egyptian-hieroglyphs-fonts
        - google-noto-sans-mono-cjk-vf-fonts
        - google-noto-sans-mono-vf-fonts
        - google-noto-sans-symbols-2-fonts
        - google-noto-sans-symbols-vf-fonts
        - google-noto-sans-vf-fonts
        - gsound
        - gtk4-layer-shell
        - just
        - kmscon
        - kmscon-freetype
        - libgda
        - libgda-sqlite
        - liberation-mono-fonts
        - liberation-sans-fonts
        - liberation-serif-fonts
        - libxdo
        - ncurses
        - opensc
        - openssh-clients
        - patch
        - pinentry
        - pinentry-gnome3
        - pipewire-gstreamer
        - podman
        - podman-compose
        - procps-ng
        - python3.15
        - rsync
        - selinux-policy-devel
        - solaar
        - systemd-oomd-defaults
        - tailscale
        - telegram-desktop
        - uresourced
        - vim-enhanced
        - vicinae
        - vulkan-tools
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        # renovate: datasource=github-releases depName=rustdesk/rustdesk
        - https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-0.x86_64.rpm
        - https://discord.com/api/download?platform=linux&format=rpm

  # The RPM owns desktop files and icons. Keep helper GIDs consistent between
  # the image group database, setgid executables, and boot-time sysusers.
  - type: script@v2
    source: ghcr.io/blue-build/modules/script:v2@sha256:d6076360da9195e2a6d781043a1b049bede3d2389757912a828a957bc78929b8
    snippets:
      - |
        rm -rf /tmp/spectrum-config
        groupmod --gid 1500 onepassword
        groupmod --gid 1600 onepassword-cli
        groupmod --gid 1700 onepassword-mcp
        chmod 4755 /opt/1Password/chrome-sandbox
        chgrp 1500 /opt/1Password/1Password-BrowserSupport
        chmod g+s /opt/1Password/1Password-BrowserSupport
        chgrp 1600 /usr/bin/op
        chmod g+s /usr/bin/op
        chgrp 1700 /opt/1Password/1password-mcp
        chmod g+s /opt/1Password/1password-mcp
        printf 'g onepassword 1500\n' > /usr/lib/sysusers.d/onepassword.conf
        printf 'g onepassword-cli 1600\n' > /usr/lib/sysusers.d/onepassword-cli.conf
        printf 'g onepassword-mcp 1700\n' > /usr/lib/sysusers.d/onepassword-mcp.conf
        rm -f /usr/lib/sysusers.d/30-rpmostree-pkg-group-onepassword.conf
        rm -f /usr/lib/sysusers.d/30-rpmostree-pkg-group-onepassword-cli.conf
        rm -f /usr/lib/sysusers.d/30-rpmostree-pkg-group-onepassword-mcp.conf

  # Reconcile user Flatpaks at boot. Flatpak itself selects and maintains the
  # host's matching graphics-driver extensions with each runtime.
  - type: default-flatpaks@v2
    source: ghcr.io/blue-build/modules/default-flatpaks:v2@sha256:9a57a74188d54cd717520a6c434ddfa41346f769b48bbb3bbf418538180f8397
    configurations:
      - scope: user
        notify: false
        repo:
          name: flathub
          title: Flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - org.gnome.NautilusPreviewer

  - type: gnome-extensions@v1
    source: ghcr.io/blue-build/modules/gnome-extensions:v1@sha256:01fc3f2497deccf8572213a232347e35b4d78d3447317e88ecedb5ad0c89e1c9
    install:
      - 4974 # Window Calls Extended
      - 5060 # Xremap
      - 5592 # Focused Window D-Bus
      - 8594 # Vicinae
      - 8834 # Copyous
