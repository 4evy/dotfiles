#:schema ./spectrum-programs.schema.json

"$schema" = "./spectrum-programs.schema.json"
format_version = 1

[[program]]
key = "onepassword"
group = "packaged"
kind = "dnf"
name = "1Password"
packages = ["1password", "1password-cli"]
enabled_repositories = ["1password"]
validation_packages = ["1password", "1password-cli"]

[[program.repositories]]
destination = "/etc/pki/rpm-gpg/RPM-GPG-KEY-1password"
source_url = "https://downloads.1password.com/linux/keys/1password.asc"
import_rpm_key = true

[[program.repositories]]
destination = "/etc/yum.repos.d/1password.repo"
source_path = "image/repos/1password.repo"
repo_ids = ["1password"]

[[program.system_groups]]
name = "onepassword-mcp"
gid = 954

[[program.system_groups]]
name = "onepassword-cli"
gid = 955

[[program.system_groups]]
name = "onepassword"
gid = 956

[[program.before_install]]
kind = "ensure-directory"
path = "/var/usrlocal/bin"

[[program.after_install]]
kind = "require-file"
path = "/opt/1Password/1password-mcp"

[[program.after_install]]
kind = "unlink"
path = "/var/usrlocal/bin/1password-mcp"

[[program.after_install]]
kind = "remove-empty-directory"
path = "/var/usrlocal/bin"

[[program.after_install]]
kind = "remove-empty-directory"
path = "/var/usrlocal"

[[program.after_install]]
kind = "unlink"
path = "/usr/bin/1password-mcp"

[[program.after_install]]
kind = "symlink"
path = "/usr/bin/1password-mcp"
target = "/opt/1Password/1password-mcp"

[[program]]
key = "vscode"
group = "packaged"
kind = "dnf"
name = "Visual Studio Code"
packages = ["code"]
enabled_repositories = ["code"]
validation_packages = ["code"]

[[program.repositories]]
destination = "/etc/yum.repos.d/vscode.repo"
source_path = "image/repos/vscode.repo"
repo_ids = ["code"]

[[program]]
key = "sops"
group = "packaged"
kind = "github-release-rpm"
name = "SOPS"
source = "sops"
asset_pattern = 'sops-[0-9].*-1\.{arch}\.rpm'
validation_packages = ["sops"]

[[program]]
key = "rustdesk"
group = "packaged"
kind = "github-release-rpm"
name = "RustDesk"
source = "rustdesk"
asset_pattern = 'rustdesk-[0-9].*-0\.{arch}\.rpm'
validation_packages = ["rustdesk"]

[[program]]
key = "discord"
group = "packaged"
kind = "dnf"
name = "Discord"
packages = ["https://discord.com/api/download?platform=linux&format=rpm"]
validation_packages = ["discord"]
nogpgcheck = true

[[program]]
key = "telegram"
group = "packaged"
kind = "dnf"
name = "Telegram"
packages = ["telegram-desktop"]
repository_packages = [
  "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{fedora_version}.noarch.rpm",
]
generated_repository_files = [
  "/etc/yum.repos.d/rpmfusion-free.repo",
  "/etc/yum.repos.d/rpmfusion-free-updates.repo",
  "/etc/yum.repos.d/rpmfusion-free-updates-testing.repo",
]
enabled_repositories = ["rpmfusion-free", "rpmfusion-free-updates"]
validation_packages = ["telegram-desktop"]

[[program.package_variables]]
name = "fedora_version"
command = ["rpm", "-E", "%fedora"]

[[program]]
key = "copyous"
group = "extension"
kind = "gnome-shell-extension"
name = "Copyous"
source = "copyous"
uuid = "copyous@boerdereinar.dev"
asset_pattern = 'copyous@boerdereinar\.dev\.zip'
packages = ["libgda", "libgda-sqlite", "gsound"]
required_files = [
  "extension.js",
  "schemas/org.gnome.shell.extensions.copyous.gschema.xml",
]
schema_directories = ["schemas"]

[[program]]
key = "ghostty"
group = "ghostty"
kind = "module"
module = "ghostty"
sources = ["ghostty"]

[[program]]
key = "kmscon"
group = "kmscon"
kind = "module"
module = "kmscon"
sources = ["kmscon", "libtsm", "python_astral"]
