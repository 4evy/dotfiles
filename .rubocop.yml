---
AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  Exclude:
    - .ruby-lsp/**/*
    # Homebrew's dedicated style command owns Formula rules. Its cop settings
    # intentionally conflict with upstream RuboCop in a few places.
    - Formula/**/*
    - vendor/bundle/**/*
    - packages/**/vendor/**/*
    - '**/zig-pkg/**/*'

Layout/LineLength:
  Max: 118

Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table

# Keep Homebrew's Pathname DSL (`root/"child"`) compact.
Layout/SpaceAroundOperators:
  Enabled: false

Lint/RedundantRequireStatement:
  Enabled: false

Metrics:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

# All URI.open call sites validate URI::HTTP before opening.
Security/Open:
  Enabled: false

Style/ArgumentsForwarding:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
