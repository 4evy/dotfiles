value = true

[[browser.preferences.local_state_values]]
path = "profile.info_cache.Default.custom_avatar_picture_file_name"
value = "Custom Avatar Picture.png"

[[browser.preferences.variation_values]]
path = "user_experience_metrics.stability.exited_cleanly"
value = true

[[browser.preferences.variation_values]]
path = "variations_crash_streak"
value = 0

[[browser.preferences.values]]
path = "helium.services.schema_version"
value = 1

[[browser.preferences.values]]
path = "helium.browser.layout"
value = 2

[[browser.preferences.values]]
path = "helium.browser.centered_location_bar"
value = true

[[browser.preferences.values]]
path = "helium.browser.rounded_frame"
value = false

[[browser.preferences.values]]
path = "profile.name"
value = "Evy"

[[browser.preferences.values]]
path = "profile.using_default_name"
value = false

[[browser.preferences.values]]
path = "profile.using_default_avatar"
value = false

[[browser.preferences.values]]
path = "profile.using_gaia_avatar"
value = false

[[browser.preferences.values]]
path = "profile.using_custom_avatar"
value = true

[browser.helium]
completed_onboarding = true
crash_reporting = "disabled"

[browser.helium.services]
enabled = true
user_consented = true
extension_proxy = true
bangs = true
spellcheck_files = true
browser_updates = true
ublock_assets = true

[extension_settings]
files = [
  "settings/control-panel-for-twitter.json",
  "settings/enhancer-for-youtube.json",
  "settings/minimal-twitter-theme.json",
  "settings/refined-github.json",
  "settings/ublock-origin.json",
  "settings/ublock-origin-helium.json",
]

