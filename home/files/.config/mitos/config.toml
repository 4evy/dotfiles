[theme]
dark = "catppuccin_custom_dark"
light = "catppuccin_custom_light"
fallback = "catppuccin_custom_dark"

[editor]
format.on-save = true
files.auto-save.focus-lost = false
idle-timeout = 100
completion.trigger-delay = 50
cursor.highlight-line = true
line-number = "relative"
mouse.enable = true
bufferline.show = "always"
completion.replace = true
completion.trigger-length = 1
text-width = 80
diagnostics.end-of-line.severity = "hint"
border-style = "rounded"
rainbow-brackets.enable = true

# Keep messages in the bottom statusline rather than a separate command row
[editor.command-line]
show = "auto"

[editor.cursor.shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.gutters]
layout = ["diagnostics", "code-action-hint", "line-numbers", "spacer", "diff"]

[editor.indent-guides]
render = true

# Show symbols only; the bufferline and statusline already identify the file
[editor.breadcrumb]
enable = true
path = "none"

[editor.statusline]
# Mitos has no center region; retain branch information beside the file name
left = [
  "mode",
  "spinner",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
  "branch",
  "debug-session",
]
mode.color = true
right = [
  "diagnostics",
  "workspace-diagnostics",
  "selections",
  "register",
  "position",
  "position-percentage",
  "file-indent-style",
  "file-line-ending",
  "file-encoding",
  "file-type",
]

[editor.whitespace]
render = { space = "none", newline = "none", tab = "all", nbsp = "all" }

[editor.whitespace.characters]
nbsp = "⍽"
space = " "
tab = "→"
tabpad = " "

[editor.lsp]
messages.enable = true
inlay-hints.enable = true
progress.enable = false
document-highlight.auto-trigger = true
inlay-hints.length-limit = 50

[editor.diagnostics.inline]
cursor-line = "warning"

[editor.file-picker]
git-global = true
git-ignore = true
hidden = false

[editor.file-explorer]
hidden = false
parents = true
ignore = true
git-ignore = true
git-global = true
git-exclude = true
# Mitos displays the directory tree without the fork's flatten-dirs option

[editor.buffer-picker]
start-position = "previous"

[editor.soft-wrap]
enable = false
wrap-at-text-width = false

[editor.indent.smart-tab]
enable = true

[editor.completion.word]
enable = true
trigger-length = 4

[editor.search]
smart-case = true
wrap-around = true

[terminal]
true-color = true
keyboard.kitty-protocol = "auto"

[keys.normal]
"{" = "page_cursor_half_up"
"}" = "page_cursor_half_down"
# Keep the counted G motion; ge goes to the last line
G = "goto_line"
# Reflow the existing selection; use mip first to select a paragraph
g = { g = "goto_file_start", q = ":reflow" }
Z = { Z = ":write-quit", Q = ":quit!" }
"space" = { "space" = "file_picker" }
C-space = "yank_to_clipboard"
tab = "move_parent_node_end"
S-tab = "move_parent_node_start"
# Keep the discarded selections available through Ctrl-o
esc = ["save_selection", "collapse_selection", "keep_primary_selection"]

[keys.insert]
S-tab = "move_parent_node_start"

[keys.select]
"{" = "page_cursor_half_up"
"}" = "page_cursor_half_down"
G = "extend_to_file_end"
g = { g = "extend_to_file_start", q = ":reflow" }
Z = { Z = ":write-quit", Q = ":quit!" }
C-space = "yank_to_clipboard"
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"
