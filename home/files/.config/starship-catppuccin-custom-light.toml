add_newline = true
command_timeout = 5000
continuation_prompt = "[∙](subtle) "
format = "$directory$line_break$sudo$character$command_timeout"
palette = "catppuccin_custom_light"
right_format = "$cmd_duration$time"

[character]
error_symbol = "[💔 ❯ ](bold love)"
format = "$symbol"
success_symbol = "[🦋 ❯ ](bold sky)"

[cmd_duration]
format = "[took $duration]($style) "
min_time = 2000
style = "subtle"

[directory]
fish_style_pwd_dir_length = 1
format = "[🌈 $path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold love"
style = "bold pink"
truncate_to_repo = false
truncation_symbol = "../"

[palettes.catppuccin_custom_light]
base = "@COLOR_LIGHT_BASE@"
blue = "@COLOR_LIGHT_BLUE@"
crust = "@COLOR_LIGHT_CRUST@"
flamingo = "@COLOR_LIGHT_FLAMINGO@"
green = "@COLOR_LIGHT_GREEN@"
lavender = "@COLOR_LIGHT_LAVENDER@"
love = "@COLOR_LIGHT_LOVE@"
mantle = "@COLOR_LIGHT_MANTLE@"
maroon = "@COLOR_LIGHT_MAROON@"
mauve = "@COLOR_LIGHT_MAUVE@"
overlay0 = "@COLOR_LIGHT_OVERLAY0@"
overlay1 = "@COLOR_LIGHT_OVERLAY1@"
overlay2 = "@COLOR_LIGHT_OVERLAY2@"
peach = "@COLOR_LIGHT_PEACH@"
pink = "@COLOR_LIGHT_PINK@"
red = "@COLOR_LIGHT_RED@"
rose = "@COLOR_LIGHT_ROSE@"
rosewater = "@COLOR_LIGHT_ROSEWATER@"
sapphire = "@COLOR_LIGHT_SAPPHIRE@"
sky = "@COLOR_LIGHT_SKY@"
subtle = "@COLOR_LIGHT_SUBTLE@"
subtext0 = "@COLOR_LIGHT_SUBTEXT0@"
subtext1 = "@COLOR_LIGHT_SUBTEXT1@"
surface0 = "@COLOR_LIGHT_SURFACE0@"
surface1 = "@COLOR_LIGHT_SURFACE1@"
surface2 = "@COLOR_LIGHT_SURFACE2@"
teal = "@COLOR_LIGHT_TEAL@"
text = "@COLOR_LIGHT_TEXT@"
yellow = "@COLOR_LIGHT_YELLOW@"


[sudo]
disabled = false
format = "[$symbol]($style) "
style = "bold love"
symbol = "🔓 root"

[time]
disabled = false
format = "[✨ $time]($style)"
style = "subtle"
time_format = "%H:%M:%S"
