add_newline = true
command_timeout = 5000
continuation_prompt = "[∙](subtle) "
format = "$directory$line_break$sudo$character$command_timeout"
palette = "catppuccin_custom_variant"
right_format = "$cmd_duration$time"

[character]
error_symbol = "[💔 ❯ ](bold love)"
format = "$symbol"
success_symbol = "[🦋 ❯ ](bold sky)"

[cmd_duration]
format = "[took $duration]($style) "
min_time = 2000
style = "subtle"

[directory]
fish_style_pwd_dir_length = 1
format = "[🌈 $path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold love"
style = "bold pink"
truncate_to_repo = false
truncation_symbol = "../"

[palettes.catppuccin_custom_variant]
base = "@COLOR_VARIANT_BASE@"
blue = "@COLOR_VARIANT_BLUE@"
crust = "@COLOR_VARIANT_CRUST@"
flamingo = "@COLOR_VARIANT_FLAMINGO@"
green = "@COLOR_VARIANT_GREEN@"
lavender = "@COLOR_VARIANT_LAVENDER@"
love = "@COLOR_VARIANT_LOVE@"
mantle = "@COLOR_VARIANT_MANTLE@"
maroon = "@COLOR_VARIANT_MAROON@"
mauve = "@COLOR_VARIANT_MAUVE@"
overlay0 = "@COLOR_VARIANT_OVERLAY0@"
overlay1 = "@COLOR_VARIANT_OVERLAY1@"
overlay2 = "@COLOR_VARIANT_OVERLAY2@"
peach = "@COLOR_VARIANT_PEACH@"
pink = "@COLOR_VARIANT_PINK@"
red = "@COLOR_VARIANT_RED@"
rose = "@COLOR_VARIANT_ROSE@"
rosewater = "@COLOR_VARIANT_ROSEWATER@"
sapphire = "@COLOR_VARIANT_SAPPHIRE@"
sky = "@COLOR_VARIANT_SKY@"
subtle = "@COLOR_VARIANT_SUBTLE@"
subtext0 = "@COLOR_VARIANT_SUBTEXT0@"
subtext1 = "@COLOR_VARIANT_SUBTEXT1@"
surface0 = "@COLOR_VARIANT_SURFACE0@"
surface1 = "@COLOR_VARIANT_SURFACE1@"
surface2 = "@COLOR_VARIANT_SURFACE2@"
teal = "@COLOR_VARIANT_TEAL@"
text = "@COLOR_VARIANT_TEXT@"
yellow = "@COLOR_VARIANT_YELLOW@"


[sudo]
disabled = false
format = "[$symbol]($style) "
style = "bold love"
symbol = "🔓 root"

[time]
disabled = false
format = "[✨ $time]($style)"
style = "subtle"
time_format = "%H:%M:%S"
